lang: typescript
group: Generics
title: "Generics — Generic Functions/Classes, Constraints, Default Type Params"
tag: E
summary: |
  Generics allow writing code that is parameterised over types, avoiding both `any`
  (which loses type info) and repetition (separate functions for each type).

  - Generic functions: `function identity<T>(arg: T): T` — TS infers T from the call
    site or you specify it explicitly.
  - Constraints: `<T extends Lengthwise>` restricts T to types that satisfy the
    constraint; prevents accessing .length on number.
  - Multiple type parameters: `<T, K extends keyof T>` — ordering matters
    (dependencies declared first).
  - Default type parameters: `<T = string>` makes T optional at the call site.
  - Generic classes: only the instance side uses the type parameter; static members
    cannot reference it.
  - Variance annotations (in/out) — available in TS 4.7+ for explicitly marking
    co/contravariance; avoid unless you have a specific need.

  Common mistakes: over-constraining (`<T extends string>` when you just want
  `string`); type inference failing with complex HOFs (prefer explicit annotation over
  silent any widening); static members in a generic class cannot use the class type
  parameter; required type params cannot follow optional ones.
exercises:
  - prompt: |
      Implement `pick<T, K extends keyof T>(obj: T, keys: K[]): Pick<T, K>`.
      Call it with a valid key list and then with an invalid key — verify the invalid
      call produces a compile error.
    kind: fix-it
    broken_code: |
      function pick(obj: any, keys: string[]): any {
        return Object.fromEntries(keys.map((k) => [k, obj[k]]));
      }

      const user = { id: 1, name: "Alice", role: "admin" };
      const subset = pick(user, ["id", "oops"]); // should "oops" error?
    fixed_code: |
      function pick<T, K extends keyof T>(obj: T, keys: K[]): Pick<T, K> {
        return Object.fromEntries(
          keys.map((k) => [k, obj[k]]),
        ) as Pick<T, K>;
      }

      const user = { id: 1, name: "Alice", role: "admin" };
      const subset = pick(user, ["id", "name"]);    // OK
      // const bad = pick(user, ["id", "oops"]);    // error: "oops" not in keyof typeof user
    bug: |
      The `any`-based version accepts any string keys including invalid ones — there is
      no type-safety. Adding `K extends keyof T` constrains the keys array to only
      known property names of T, so passing an unknown key becomes a compile-time
      error. The return type `Pick<T, K>` also accurately narrows the result to only
      the selected properties.
    check: compiles
    signal: ""
  - prompt: |
      Implement a type-safe `pipe` that composes two functions: the output type of
      the first must match the input type of the second. Show a mismatched call
      producing a compile error.
    kind: fix-it
    broken_code: |
      function pipe(f: Function, g: Function): Function {
        return (a: unknown) => g(f(a));
      }

      const result = pipe(
        (s: string) => s.length,
        (n: string) => n.toUpperCase(), // n should be number, not string
      );
    fixed_code: |
      function pipe<A, B, C>(f: (a: A) => B, g: (b: B) => C): (a: A) => C {
        return (a: A) => g(f(a));
      }

      const result = pipe(
        (s: string) => s.length,     // A=string, B=number
        (n: number) => n.toFixed(2), // B=number, C=string — types chain correctly
      );

      // const bad = pipe(
      //   (s: string) => s.length,
      //   (n: string) => n.toUpperCase(), // error: number not assignable to string
      // );
    bug: |
      Using bare `Function` types loses all type information — there is nothing to
      catch mismatched intermediate types. The generic signature `<A, B, C>` with
      dependent parameters forces TS to unify B across both functions. If the output
      type of `f` does not match the input type of `g`, inference fails and a compile
      error is reported.
    check: compiles
    signal: ""
  - prompt: |
      Create a generic `Stack<T extends { id: string }>` class with `push` and
      `findById`. Verify that instantiating with a type missing `id` errors.
    kind: fix-it
    broken_code: |
      class Stack<T> {
        private items: T[] = [];
        push(item: T): void {
          this.items.push(item);
        }
        findById(id: string): T | undefined {
          return (this.items as any[]).find((i) => i.id === id);
        }
      }

      const s = new Stack<number>();
      s.push(42);
      s.findById("1"); // number has no .id — runtime bug, not caught
    fixed_code: |
      class Stack<T extends { id: string }> {
        private items: T[] = [];

        push(item: T): void {
          this.items.push(item);
        }

        findById(id: string): T | undefined {
          return this.items.find((item) => item.id === id);
        }
      }

      interface User {
        id: string;
        name: string;
      }

      const s = new Stack<User>();
      s.push({ id: "1", name: "Alice" });
      console.log(s.findById("1"));

      // const bad = new Stack<number>(); // error: number does not satisfy { id: string }
    bug: |
      Without the constraint `T extends { id: string }`, TS allows instantiating
      `Stack<number>` even though `findById` accesses `.id` — the `any` cast in the
      original hides this. Adding the constraint enforces the contract at the
      instantiation site, and `.id` can be accessed safely inside the class body
      without any cast.
    check: compiles
    signal: ""
  - prompt: |
      Write `createResponse<T = Record<string, unknown>>(data: T)` with a default
      type param. Show calling it without a type arg (gets default) and with an
      explicit one.
    kind: fix-it
    broken_code: |
      function createResponse(data: Record<string, unknown>): {
        data: Record<string, unknown>;
        status: number;
      } {
        return { data, status: 200 };
      }

      const r1 = createResponse({ name: "Alice" });
      const r2 = createResponse("hello"); // should this be allowed?
    fixed_code: |
      function createResponse<T = Record<string, unknown>>(data: T): {
        data: T;
        status: number;
      } {
        return { data, status: 200 };
      }

      const r1 = createResponse({ name: "Alice" }); // T inferred as { name: string }
      const r2 = createResponse<string>("hello");    // explicit T overrides default
      const r3 = createResponse();                   // T uses default: Record<string, unknown>
    bug: |
      The non-generic version locks the input and output to `Record<string, unknown>`,
      losing specificity (r1.data.name is unknown, not string). The default type
      parameter `<T = Record<string, unknown>>` lets callers omit the type arg when
      the default is appropriate, while allowing explicit override. TS infers T from
      the argument when provided.
    check: compiles
    signal: ""
