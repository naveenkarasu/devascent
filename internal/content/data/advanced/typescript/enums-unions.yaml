lang: typescript
group: Enums & Unions
title: "Enums & Unions — Enums, Discriminated Unions, Exhaustiveness Checks"
tag: E
summary: |
  Enums are one of TS's few features that emit JavaScript (a runtime object). Numeric
  enums auto-increment; string enums require explicit initialisation. `const enum`
  members are inlined at compile time and the object is erased entirely.

  Why discriminated unions are often preferred over enums:
  - Enums emit JS — they are not erased like other TS types, which can cause
    tree-shaking issues and bundle surprises.
  - `const enum` with ambient declarations causes inlining bugs when library versions
    change.
  - The `object as const` pattern (`{ Up: "UP" } as const`) keeps code aligned with
    plain JS and is Zod/JSON-serialization-friendly.
  - Numeric enums have reverse mapping (`Direction[0]` returns `"Up"`), which
    surprises: the TS team has said they regret introducing enums (they predate modern
    TS patterns).

  Discriminated unions — union of types sharing a literal-typed discriminant field;
  combined with exhaustiveness checking via `never` they are the idiomatic TS
  alternative.

  Common mistakes: numeric enums have reverse mapping; string enums do not; `const
  enum` in .d.ts files (ambient) breaks consumers using isolatedModules; heterogeneous
  enums (mixed number/string) are technically valid but practically always a mistake;
  enums prevent tree-shaking; two enums with the same values are not structurally
  compatible (nominal-like behaviour).
exercises:
  - prompt: |
      Refactor the `Status` enum and its usage to an `as const` object + union type,
      while keeping all the same type checks passing.
    kind: fix-it
    broken_code: |
      enum Status {
        Pending = "PENDING",
        Active = "ACTIVE",
        Archived = "ARCHIVED",
      }

      function describe(s: Status): string {
        if (s === Status.Active) return "live";
        return "other";
      }

      // A string enum is nominal — even its own underlying value is rejected.
      describe("PENDING"); // error: '"PENDING"' is not assignable to parameter of type 'Status'
    fixed_code: |
      const Status = {
        Pending: "PENDING",
        Active: "ACTIVE",
        Archived: "ARCHIVED",
      } as const;

      type Status = (typeof Status)[keyof typeof Status];

      function describe(s: Status): string {
        if (s === Status.Active) return "live";
        return "other";
      }

      // The as-const union is structural — the raw string literal is accepted.
      describe("PENDING");
      describe(Status.Pending);
    bug: |
      A string enum is nominal: the literal `"PENDING"` is NOT assignable to the enum
      type `Status`, even though that is its underlying value — so the call errors. The
      `as const` object + union pattern is structural: the derived union
      `"PENDING" | "ACTIVE" | "ARCHIVED"` (computed via `(typeof Status)[keyof typeof
      Status]`) accepts the raw string literal directly. It also emits no extra JS
      runtime object beyond the plain constant, which is what makes it Zod- and
      JSON-serialization-friendly. The existing call-site checks remain identical.
    check: compiles
    signal: ""
  - prompt: |
      Implement `area(s: Shape): number` for a discriminated union of
      Circle | Square | Triangle with a `never` exhaustiveness guard. Then add
      `Rectangle` to the union and confirm the resulting compile error.
    kind: fix-it
    broken_code: |
      type Shape =
        | { kind: "circle"; radius: number }
        | { kind: "square"; side: number }
        | { kind: "triangle"; base: number; height: number };

      function assertNever(x: never): never {
        throw new Error(`Unhandled shape: ${JSON.stringify(x)}`);
      }

      function area(s: Shape): number {
        switch (s.kind) {
          case "circle":
            return Math.PI * s.radius ** 2;
          case "square":
            return s.side ** 2;
          // "triangle" case is missing — the exhaustiveness guard catches it
          default:
            return assertNever(s); // error: the triangle member is not assignable to 'never'
        }
      }
    fixed_code: |
      type Shape =
        | { kind: "circle"; radius: number }
        | { kind: "square"; side: number }
        | { kind: "triangle"; base: number; height: number };

      function assertNever(x: never): never {
        throw new Error(`Unhandled shape: ${JSON.stringify(x)}`);
      }

      function area(s: Shape): number {
        switch (s.kind) {
          case "circle":
            return Math.PI * s.radius ** 2;
          case "square":
            return s.side ** 2;
          case "triangle":
            return 0.5 * s.base * s.height;
          default:
            return assertNever(s);
        }
      }
    bug: |
      Assigning the `default` value to `assertNever(x: never)` turns a missing case into
      a compile error: if any union member reaches the default branch, TS knows the
      value is not `never` and rejects the call. Here the `triangle` member has no
      `case`, so it falls to the default and the assertion fails — the error points to
      the exact assertion site. Adding the missing `case "triangle"` makes the value
      `never` at the default again and the code compiles.
    check: compiles
    signal: ""
  - prompt: |
      Show the reverse-mapping quirk of numeric enums: `Direction[Direction.Up]`
      compiles and returns `"Up"` at runtime. Demonstrate that a string enum does NOT
      have reverse mapping. Explain why this makes numeric enums weaker for
      serialisation.
    kind: spot-the-bug
    broken_code: |
      enum Direction {
        Up,    // 0
        Down,  // 1
      }

      enum Color {
        Red = "RED",
        Blue = "BLUE",
      }

      console.log(Direction[Direction.Up]);  // what does this print?
      console.log(Color[Color.Red]);         // what does this print?
    fixed_code: |
      enum Direction {
        Up,    // 0
        Down,  // 1
      }

      enum Color {
        Red = "RED",
        Blue = "BLUE",
      }

      // Direction[0] === "Up"  — reverse mapping exists for numeric enums
      console.log(Direction[Direction.Up]); // "Up"

      // String enums have NO reverse mapping, and TS rejects the lookup at compile time:
      // console.log(Color[Color.Red]); // error TS2551: Property 'RED' does not exist on type 'typeof Color'
    bug: |
      Numeric enums emit a JS object with both forward (`Up → 0`) and reverse
      (`0 → "Up"`) mappings, so `Direction[Direction.Up]` compiles and returns `"Up"`
      at runtime. String enums emit only forward mappings: there is no `"RED"` key on
      the `Color` object, so `Color[Color.Red]` (which indexes by the value `"RED"`) is
      a compile error under `--strict` — `Property 'RED' does not exist on type
      'typeof Color'`. Removing that line (the fix) restores a clean compile. The bug
      is the broken code's attempt to reverse-map a string enum; that string enums
      reject value-lookup at compile time is exactly what makes them safer for
      serialisation and JSON round-trips than numeric enums.
    check: compiles
    signal: ""
