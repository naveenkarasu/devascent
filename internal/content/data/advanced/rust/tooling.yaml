lang: rust
group: Tooling
title: "Tooling — Cargo, rustfmt, clippy, and the Rust ecosystem"
tag: C
summary: |
  Rust's tooling is a first-class part of the language experience and a major
  productivity differentiator.

  Cargo is the build system and package manager. Key commands: cargo new (scaffold a
  project), cargo build, cargo run, cargo test, cargo add <crate> (adds a dependency
  to Cargo.toml). Cargo.toml declares dependencies with semantic-version constraints;
  Cargo.lock pins the exact resolved versions and should be committed in applications
  (not libraries). Workspace support allows multiple related crates to share a single
  Cargo.lock and build cache.

  rustfmt applies canonical, opinionated formatting via cargo fmt. It is non-negotiable
  on most teams — PR reviewers should not spend time on whitespace. Configure exceptions
  in rustfmt.toml if needed.

  clippy is a large suite of lints for idiomatic code, common mistakes, and performance
  patterns. Run with cargo clippy. In CI it is commonly run as
  cargo clippy -- -D warnings to fail the build on any warning. Clippy catches patterns
  the compiler accepts but that are considered poor style or likely bugs.

  crates.io is the official package registry. docs.rs hosts auto-generated API
  documentation for every published crate, built from the crate's doc comments.

  rustup manages toolchain versions and target triples for cross-compilation. Common
  commands: rustup update (get the latest stable), rustup target add (add a compilation
  target such as wasm32-unknown-unknown or thumbv7em-none-eabihf for embedded).

  New Rust projects should run cargo clippy and cargo fmt from day one. The tight
  feedback loop between the borrow checker, clippy, and rustfmt is one of the primary
  productivity multipliers in the Rust ecosystem.
