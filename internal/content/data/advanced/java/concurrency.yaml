lang: java
group: Concurrency
title: "Concurrency — threads, executors, CompletableFuture & virtual threads"
tag: E
summary: |
  Java's concurrency model is thread-based. Primitives: Thread and Runnable.
  Modern abstraction: ExecutorService (thread pools via Executors factory methods).

  Synchronisation tools:
  - synchronized block/method: intrinsic monitor (mutex); simplest, but coarse-grained.
  - ReentrantLock: explicit lock with tryLock(), timed lock, and fairness option.
    Preferred over synchronized in virtual-thread-heavy code (see below).
  - volatile: guarantees visibility of writes across threads but NOT atomicity.
    count++ is three operations (read, increment, write) and is NOT safe with volatile.
  - AtomicInteger / AtomicLong / AtomicReference: lock-free atomic operations
    (compareAndSet, incrementAndGet).

  Higher-level building blocks (java.util.concurrent):
  - ConcurrentHashMap: lock-striped map; compound ops like computeIfAbsent are atomic.
  - CountDownLatch, Semaphore, CyclicBarrier: coordination primitives.
  - CompletableFuture<T>: async computation graph. Key methods:
    supplyAsync, thenApply (sync transform), thenCompose (returns another future),
    thenCombine (merge two futures), allOf / anyOf, exceptionally, handle.
    Prefer .join() over .get() in functional chains — throws CompletionException
    (unchecked) rather than checked ExecutionException.

  Java 21 — Virtual Threads (JEP 444):
  Lightweight threads managed by the JVM scheduler, not OS threads. Created via
  Thread.ofVirtual().start(() -> ...) or Executors.newVirtualThreadPerTaskExecutor().
  They block cheaply (JVM parks them, not the OS thread), enabling a simple
  thread-per-task model at very high scale (millions of virtual threads).
  Key caveat: synchronized blocks can PIN a virtual thread to its carrier platform
  thread for the duration of the block, reintroducing platform-thread exhaustion.
  Replace synchronized with ReentrantLock in hot paths under virtual threads.
  Virtual threads do NOT improve CPU-bound work — they shine for blocking I/O.

  Gotchas:
  - Thread.sleep() inside a synchronized block holds the lock during sleep —
    degrades throughput.
  - ConcurrentHashMap does not make compound operations atomic: the sequence
    !map.containsKey(k) / map.put(k,v) still races; use computeIfAbsent.
  - CompletableFuture.join() is preferred over .get() in functional chains —
    throws CompletionException (unchecked) instead of checked ExecutionException.
exercises:
  - prompt: |
      A Counter class increments a shared count from 10 threads (100 increments each).
      The result is often less than 1000 due to a race condition. Fix it in two ways:
      (a) using synchronized, (b) using AtomicInteger. Explain why volatile alone
      does not fix the race.
    kind: fix-it
    broken_code: |
      class Counter {
          private int count = 0;
          void increment() { count++; }   // not atomic: read-modify-write race
          int get() { return count; }
      }

      Counter counter = new Counter();
      List<Thread> threads = new ArrayList<>();
      for (int i = 0; i < 10; i++) {
          threads.add(Thread.ofPlatform().start(() -> {
              for (int j = 0; j < 100; j++) counter.increment();
          }));
      }
      for (Thread t : threads) t.join();
      System.out.println(counter.get());   // often < 1000
    fixed_code: |
      // (a) synchronized — simplest mutual exclusion:
      class SyncCounter {
          private int count = 0;
          synchronized void increment() { count++; }
          synchronized int get() { return count; }
      }

      // (b) AtomicInteger — lock-free CAS; preferred for simple counters:
      class AtomicCounter {
          private final AtomicInteger count = new AtomicInteger(0);
          void increment() { count.incrementAndGet(); }
          int get() { return count.get(); }
      }

      // volatile alone does NOT fix the race:
      // count++ compiles to: read count → add 1 → write count (three steps).
      // volatile guarantees the write is visible to other threads immediately,
      // but another thread can still read the old value between the read and write,
      // causing lost increments. AtomicInteger uses CPU-level compareAndSet to make
      // the entire read-modify-write indivisible.
    bug: |
      count++ is not atomic: it is a read-modify-write sequence. Two threads can both
      read the same value, both compute +1, and both write the same result — losing one
      increment. volatile prevents stale reads (visibility) but does not prevent this
      interleaving (atomicity). synchronized or AtomicInteger make the whole operation
      indivisible.
    check: stdout
    signal: "1000"

  - prompt: |
      Submit 20 file-parsing tasks to a FixedThreadPool(4). Collect each result via
      Future<String>, handle ExecutionException, and correctly shut down the pool.
      Show the common mistake of calling Future.get() in a submit loop (serialises work)
      versus collecting futures first, then joining.
    kind: implement
    broken_code: |
      ExecutorService pool = Executors.newFixedThreadPool(4);
      List<String> results = new ArrayList<>();

      for (int i = 0; i < 20; i++) {
          final int taskId = i;
          // BUG: get() blocks immediately — tasks run one-at-a-time despite the pool
          Future<String> f = pool.submit(() -> parseFile(taskId));
          results.add(f.get());   // blocks here until task finishes
      }
      pool.shutdown();
    fixed_code: |
      ExecutorService pool = Executors.newFixedThreadPool(4);
      List<Future<String>> futures = new ArrayList<>();

      // Submit ALL tasks first — they queue and run in parallel:
      for (int i = 0; i < 20; i++) {
          final int taskId = i;
          futures.add(pool.submit(() -> parseFile(taskId)));
      }

      // Then collect results — actual parallelism happened above:
      List<String> results = new ArrayList<>();
      for (Future<String> f : futures) {
          try {
              results.add(f.get());
          } catch (ExecutionException e) {
              System.err.println("Task failed: " + e.getCause().getMessage());
          } catch (InterruptedException e) {
              Thread.currentThread().interrupt();
              break;
          }
      }

      pool.shutdown();
      pool.awaitTermination(30, TimeUnit.SECONDS);
    bug: |
      Calling future.get() immediately after each submit() blocks the calling thread
      until that task finishes — tasks run serially despite the pool. The fix: submit
      all tasks first (they queue and run in parallel), then iterate futures to collect
      results. Also important: failing to call shutdown() keeps the JVM alive
      indefinitely; shutdownNow() cancels queued tasks aggressively, so use shutdown()
      + awaitTermination() for a graceful drain.
    check: none
    signal: ""

  - prompt: |
      Build a CompletableFuture pipeline that fetches a user record and their order
      list concurrently (supplyAsync), combines the results with thenCombine, and
      handles failure with exceptionally. Use the async executor form for both
      initial tasks so they run in parallel.
    kind: implement
    broken_code: |
      // Sequential (slow) version — second call blocks until first completes:
      static String buildDashboard(int userId) {
          String user   = fetchUser(userId);    // blocking
          List<String> orders = fetchOrders(userId);  // waits for fetchUser
          return "User: " + user + ", Orders: " + orders.size();
      }
    fixed_code: |
      static CompletableFuture<String> buildDashboard(int userId) {
          CompletableFuture<String> userFuture =
              CompletableFuture.supplyAsync(() -> fetchUser(userId));

          CompletableFuture<List<String>> orderFuture =
              CompletableFuture.supplyAsync(() -> fetchOrders(userId));

          return userFuture
              .thenCombine(orderFuture,
                  (user, orders) -> "User: " + user + ", Orders: " + orders.size())
              .exceptionally(ex -> "Error loading dashboard: " + ex.getMessage());
      }

      // thenApply  — synchronous transform (runs in completing thread)
      // thenCompose — for when the mapper itself returns a CompletableFuture
      //               (avoids CompletableFuture<CompletableFuture<T>>)
      // thenCombine — merges two independent futures when both complete
      // allOf       — returns CompletableFuture<Void>; results retrieved from
      //               original futures separately (NOT from the allOf future)
    bug: |
      The sequential version blocks the calling thread twice. supplyAsync submits both
      tasks to the common ForkJoinPool simultaneously — they run in parallel. thenCombine
      waits for both to complete and merges results. Note: allOf() is for more than two
      futures but returns CompletableFuture<Void> — the actual results must be extracted
      from the original future references; this surprises many developers who expect
      allOf to carry the results.
    check: none
    signal: ""

  - prompt: |
      Take the FixedThreadPool(4) solution from the executor exercise and swap it to
      newVirtualThreadPerTaskExecutor(). Then add a synchronized block inside the task
      and observe (via comment) what "pinning" means. Explain which scenario benefits
      from virtual threads and which does not.
    kind: implement
    broken_code: |
      // Platform thread pool — limited to 4 concurrent tasks even if all are blocked on I/O:
      ExecutorService pool = Executors.newFixedThreadPool(4);
      for (int i = 0; i < 20; i++) {
          final int id = i;
          pool.submit(() -> {
              String result = callExternalApi(id);   // blocking I/O, ~200ms
              return result;
          });
      }
      pool.shutdown();
    fixed_code: |
      // Virtual thread executor — JVM creates one lightweight virtual thread per task:
      try (ExecutorService pool = Executors.newVirtualThreadPerTaskExecutor()) {
          for (int i = 0; i < 20; i++) {
              final int id = i;
              pool.submit(() -> {
                  // When callExternalApi blocks on I/O, the virtual thread is parked
                  // and the carrier platform thread is freed to run another virtual thread.
                  String result = callExternalApi(id);
                  return result;
              });
          }
      }   // try-with-resources calls shutdown() and awaits termination automatically

      // PINNING: if the task used synchronized instead of ReentrantLock on a hot path:
      //   synchronized (sharedLock) {
      //       callExternalApi(id);   // virtual thread PINNED to carrier during block
      //   }
      // The carrier platform thread cannot be shared with other virtual threads while
      // the virtual thread holds the monitor — neutralises the scaling benefit.
      // Fix: replace synchronized with ReentrantLock in virtual-thread-heavy code.

      // CPU-BOUND tasks: virtual threads do NOT help.
      //   10 virtual threads crunching numbers still contend for 10 CPU cores.
      //   A FixedThreadPool(Runtime.getRuntime().availableProcessors()) is better there.
    bug: |
      Virtual threads are cheap to create (JVM-managed, not OS threads), so a
      thread-per-task model scales to millions of blocking I/O tasks. The two caveats:
      (1) synchronized blocks pin the virtual thread to its carrier platform thread for
      the entire synchronized region — if the pinned region blocks on I/O, the carrier
      is held and the scalability benefit is lost. Use ReentrantLock instead.
      (2) CPU-bound work is not improved: virtual threads still need CPU time, and the
      JVM cannot parallelise beyond the number of available cores.
    check: none
    signal: ""
