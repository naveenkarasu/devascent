group: Tooling
title: "C++ Tooling — Build, Test, Sanitize"
tag: C
summary: |
  A reference for the C++ build and quality toolchain encountered daily.

  Build system — CMake: the de-facto standard meta-build system. Generates
  platform-specific build files (Makefiles, Ninja, MSVC project files). Modern CMake
  (3.x+) uses target-based dependency management (target_include_directories,
  target_link_libraries).

  Compilers — GCC (g++) and Clang (clang++): both production-quality; Clang
  generally gives better error messages and is the basis of most static-analysis
  tools. MSVC is dominant on Windows.

  Testing — Google Test (gtest/gmock): widely used C++ unit testing framework.
  Tests are compiled into a separate binary.

  Memory/race detection — AddressSanitizer, ThreadSanitizer, UBSanitizer:
  compiler-instrumented runtime detectors (-fsanitize=address, -fsanitize=thread,
  -fsanitize=undefined). Valgrind is the classic alternative (slower, no recompile
  needed).

  Package management — vcpkg / Conan: vcpkg (Microsoft) and Conan are the two
  dominant C++ package managers; neither is as universal as npm or cargo yet.

  Static analysis — clang-tidy: enforces C++ Core Guidelines rules and catches
  common bugs at compile time; configurable via .clang-tidy.

  Sources:
    - C++ Core Guidelines — tooling section: recommends ASan/TSan/UBSan and
      clang-tidy.
    - CMake documentation (cmake.org/documentation/) — canonical CMake reference.
