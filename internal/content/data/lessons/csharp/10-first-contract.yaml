id: first-contract
lang: csharp
order: 10
title: First Contract
stages:
  - kind: i_do
    title: I do — watch
    body: |
      You now have every tool for an Easy problem: variables, conditionals, loops,
      arrays, and reading a spec. Strategy: read the brief, name inputs/outputs,
      build a result with an accumulator loop, and use if / else if / else to
      decide what to append each pass. The most specific condition must come FIRST.
      To turn a number into a string, use i.ToString().

      Classify 1..n as "low" (<3) else "high": loop i, append "low" if i<3 else
      "high". n=4 → ["low","low","high","high"].
  - kind: we_do
    title: We do — together (with a hint)
    body: 'FizzBuzz: for 1..n return an array of strings. Hint: test i%15 FIRST, then i%3, then i%5, else i.ToString().'
    task:
      prompt: For 1..n — "FizzBuzz" if divisible by 3 and 5; "Fizz" if by 3; "Buzz" if by 5; else the number as a string.
      func_name: fizz_report
      starter: |
        public class Solution {
            public string[] fizz_report(long n) {
                // hint: var result = new System.Collections.Generic.List<string>();
                //       loop 1..n; check i%15==0 first; result.Add(...); return result.ToArray();
            }
        }
      solution: |
        public class Solution {
            public string[] fizz_report(long n) {
                var result = new System.Collections.Generic.List<string>();
                for (long i = 1; i <= n; i++) {
                    if (i % 15 == 0) {
                        result.Add("FizzBuzz");
                    } else if (i % 3 == 0) {
                        result.Add("Fizz");
                    } else if (i % 5 == 0) {
                        result.Add("Buzz");
                    } else {
                        result.Add(i.ToString());
                    }
                }
                return result.ToArray();
            }
        }
      tests:
        - {name: fizz_report(5), input: [5], expected: ["1", "2", "Fizz", "4", "Buzz"]}
        - {name: fizz_report(3), input: [3], expected: ["1", "2", "Fizz"]}
        - {name: fizz_report(15), input: [15], expected: ["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz"]}
  - kind: you_do
    title: You do — solo (graduation)
    body: Filter an array — your last task before the bench.
    task:
      prompt: Return a new array with only the words that are 4+ letters, in original order ([] → []).
      func_name: long_words
      starter: |
        public class Solution {
            public string[] long_words(string[] words) {
                // <- build a List<string>; keep w when w.Length >= 4; return list.ToArray()
            }
        }
      solution: |
        public class Solution {
            public string[] long_words(string[] words) {
                var result = new System.Collections.Generic.List<string>();
                foreach (var w in words) {
                    if (w.Length >= 4) {
                        result.Add(w);
                    }
                }
                return result.ToArray();
            }
        }
      tests:
        - {name: 'long_words([hi,code,ok,loops])', input: [["hi", "code", "ok", "loops"]], expected: ["code", "loops"]}
        - {name: 'long_words([])', input: [[]], expected: []}
        - {name: 'long_words([a,be,see])', input: [["a", "be", "see"]], expected: []}
