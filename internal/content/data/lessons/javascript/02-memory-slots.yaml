id: memory-slots
lang: javascript
order: 2
title: Memory Slots
stages:
  - kind: i_do
    title: I do — watch
    body: |
      A variable is a named box that stores a value. In JavaScript, use let to
      declare a variable that may change, or const for one that won't:
      let name = value.  Function parameters arrive as ready-made variables.

          function triple(x) {
              let result = x * 3;
              return result;
          }

      triple(4) gives 12.  Math uses + - * / .  JavaScript is dynamically typed —
      you don't declare the type; the value carries it.
  - kind: we_do
    title: We do — together (with a hint)
    body: You're given a number score. Store double the score, then hand it back.
    task:
      prompt: Return double the given score.
      func_name: double_score
      starter: |
        function double_score(score) {
            // hint:  let total = score * 2;  then  return total;
        }
      solution: |
        function double_score(score) {
            let total = score * 2;
            return total;
        }
      tests:
        - {name: 'double_score(5)', input: [5], expected: 10}
        - {name: 'double_score(0)', input: [0], expected: 0}
        - {name: 'double_score(21)', input: [21], expected: 42}
  - kind: you_do
    title: You do — solo
    body: Now on your own.
    task:
      prompt: Given price and quantity, return the total cost (price times quantity).
      func_name: total_cost
      starter: |
        function total_cost(price, quantity) {
            // <- delete this line and write your code
        }
      solution: |
        function total_cost(price, quantity) {
            return price * quantity;
        }
      tests:
        - {name: 'total_cost(3, 4)', input: [3, 4], expected: 12}
        - {name: 'total_cost(10, 0)', input: [10, 0], expected: 0}
        - {name: 'total_cost(7, 2)', input: [7, 2], expected: 14}
