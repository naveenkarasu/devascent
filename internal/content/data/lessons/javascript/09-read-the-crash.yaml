id: read-the-crash
lang: javascript
order: 9
title: Read the Crash
stages:
  - kind: i_do
    title: I do — watch
    body: |
      Errors are clues, not failures. At runtime JavaScript throws a TypeError or
      RangeError and prints a message and a stack trace. Common ones: reading a
      property of undefined (TypeError), accessing an index that doesn't exist
      (returns undefined rather than throwing — silent but wrong), and dividing
      by zero (returns Infinity, not a crash). Read the FIRST line of the error.

          const s = [];
          s[0]   // → undefined (no crash, but wrong data)

      The fix: check the length before you index.
  - kind: we_do
    title: We do — together (with a hint)
    body: 'Returning items[0] gives undefined on an empty array. JavaScript has no "None", so signal "empty" with -1 instead.'
    task:
      prompt: Return the first item, or -1 if the array is empty.
      func_name: safe_first
      starter: |
        function safe_first(items) {
            // buggy: return items[0];  -- returns undefined when empty
            // hint: guard first — if (items.length === 0) { return -1; }
        }
      solution: |
        function safe_first(items) {
            if (items.length === 0) {
                return -1;
            }
            return items[0];
        }
      tests:
        - {name: 'safe_first([5,6])', input: [[5, 6]], expected: 5}
        - {name: 'safe_first([])', input: [[]], expected: -1}
        - {name: 'safe_first([7])', input: [[7]], expected: 7}
  - kind: you_do
    title: You do — solo
    body: Dividing by length gives Infinity (or NaN) on an empty array. Make empty → 0, otherwise the true average.
    task:
      prompt: Return the average of the array; empty array → 0.
      func_name: average
      starter: |
        function average(numbers) {
            // <- guard the empty case, else  sum / numbers.length
        }
      solution: |
        function average(numbers) {
            if (numbers.length === 0) {
                return 0;
            }
            let s = 0;
            for (const n of numbers) {
                s += n;
            }
            return s / numbers.length;
        }
      tests:
        - {name: 'average([1,2])', input: [[1, 2]], expected: 1.5}
        - {name: 'average([2,4])', input: [[2, 4]], expected: 3.0}
        - {name: 'average([])', input: [[]], expected: 0.0}
        - {name: 'average([10])', input: [[10]], expected: 10.0}
