id: forks
lang: javascript
order: 3
title: Forks in the Road
stages:
  - kind: i_do
    title: I do — watch
    body: |
      Code chooses paths with if / else if / else. The if tests a condition
      (true/false); if true its block (inside { }) runs, else control falls
      through. Compare with > < >= <= === (strict equal) !== (not equal). In
      JavaScript, braces { } mark the block — not indentation — and the condition
      goes in parentheses after if.

          function label(n) {
              if (n >= 0) {
                  return "non-negative";
              } else {
                  return "negative";
              }
          }
  - kind: we_do
    title: We do — together (with a hint)
    body: Given an age, return "allowed" if 18 or older, otherwise "denied".
    task:
      prompt: Return "allowed" if age >= 18 else "denied".
      func_name: can_enter
      starter: |
        function can_enter(age) {
            // hint: "18 or older" is  age >= 18 . Use if/else returning the two texts.
        }
      solution: |
        function can_enter(age) {
            if (age >= 18) {
                return "allowed";
            }
            return "denied";
        }
      tests:
        - {name: can_enter(20), input: [20], expected: "allowed"}
        - {name: can_enter(18), input: [18], expected: "allowed"}
        - {name: can_enter(12), input: [12], expected: "denied"}
  - kind: you_do
    title: You do — solo
    body: Three-way choice this time.
    task:
      prompt: Return "positive" if n>0, "negative" if n<0, "zero" if exactly 0.
      func_name: sign_of
      starter: |
        function sign_of(n) {
            // <- use if / else if / else
        }
      solution: |
        function sign_of(n) {
            if (n > 0) {
                return "positive";
            } else if (n < 0) {
                return "negative";
            }
            return "zero";
        }
      tests:
        - {name: sign_of(7), input: [7], expected: "positive"}
        - {name: sign_of(-3), input: [-3], expected: "negative"}
        - {name: sign_of(0), input: [0], expected: "zero"}
