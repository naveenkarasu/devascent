id: functions
lang: java
order: 5
title: Build Your Own Tools
stages:
  - kind: i_do
    title: I do — watch
    body: |
      A method is a named, reusable block inside a class:
        returnType name(paramType param) { ... return value; }
      Parameters are inputs; the declared return type and return value are the
      single output. You DEFINE it once and CALL it many times.
      (You've been using this already — now it has a name.)

          class Solution {
              public long square(long x) {
                  return x * x;
              }
          }

      square(6) → 36 ; square(2) → 4. Same definition, different inputs.
  - kind: we_do
    title: We do — together (with a hint)
    body: Write a method that adds two numbers.
    task:
      prompt: Return the sum of a and b.
      func_name: add
      starter: |
        class Solution {
            public long add(long a, long b) {
                // hint: one line —  return a + b;
            }
        }
      solution: |
        class Solution {
            public long add(long a, long b) {
                return a + b;
            }
        }
      tests:
        - {name: 'add(2, 3)', input: [2, 3], expected: 5}
        - {name: 'add(-1, 1)', input: [-1, 1], expected: 0}
        - {name: 'add(100, 250)', input: [100, 250], expected: 350}
  - kind: you_do
    title: You do — solo
    body: Now on your own.
    task:
      prompt: Return the area of a rectangle (width times height).
      func_name: rectangle_area
      starter: |
        class Solution {
            public long rectangle_area(long width, long height) {
                // <- delete this line and write your code
            }
        }
      solution: |
        class Solution {
            public long rectangle_area(long width, long height) {
                return width * height;
            }
        }
      tests:
        - {name: 'rectangle_area(3, 4)', input: [3, 4], expected: 12}
        - {name: 'rectangle_area(5, 5)', input: [5, 5], expected: 25}
        - {name: 'rectangle_area(10, 1)', input: [10, 1], expected: 10}
