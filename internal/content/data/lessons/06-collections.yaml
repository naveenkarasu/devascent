  - kind: i_do
    title: I do — watch
    body: |
      A list holds many values in order:  [10, 20, 30].  Read by position with
      numbers[0] (positions start at 0). Loop over every item with
      for item in numbers:. Lists power the accumulator pattern over real data.

          def count_items(items):
              c = 0
              for x in items:
                  c += 1
              return c
