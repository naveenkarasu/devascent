id: dicts
lang: typescript
order: 7
title: Labeled Storage
stages:
  - kind: i_do
    title: I do — watch
    body: |
      An object literal stores values under named keys, typed as
      `{[k: string]: number}` for a string-keyed number map. Look up a value with
      `obj[key]`. A missing key returns `undefined`, so check before reading or
      default with `obj[key] ?? 0`. A `Set<string>` stores DISTINCT items —
      add with `set.add(x)`, count with `set.size`.

          const counts: {[k: string]: number} = {}
          counts["a"] = (counts["a"] ?? 0) + 1   // {"a": 1}
          counts["a"] = (counts["a"] ?? 0) + 1   // {"a": 2}
  - kind: we_do
    title: We do — together (with a hint)
    body: 'Count the DISTINCT items. Put each into a Set, then the answer is how many items it holds.'
    task:
      prompt: Return how many distinct items are in the array ([] → 0).
      func_name: unique_count
      starter: |
        function unique_count(items: string[]): number {
            // hint: const seen = new Set<string>(); for (const it of items) { seen.add(it) }  return seen.size
        }
      solution: |
        function unique_count(items: string[]): number {
            const seen = new Set<string>()
            for (const it of items) {
                seen.add(it)
            }
            return seen.size
        }
      tests:
        - {name: 'unique_count([a,b,a])', input: [["a", "b", "a"]], expected: 2}
        - {name: 'unique_count([x])', input: [["x"]], expected: 1}
        - {name: 'unique_count([])', input: [[]], expected: 0}
  - kind: you_do
    title: You do — solo
    body: 'Tally each character with an object map, and return the highest count (the most frequent character''s count). "" → 0.'
    task:
      prompt: Return the count of the most frequent character in word ("" → 0).
      func_name: top_count
      starter: |
        function top_count(word: string): number {
            // <- const counts: {[k: string]: number} = {}; for each char: counts[c] = (counts[c] ?? 0) + 1; track the max
        }
      solution: |
        function top_count(word: string): number {
            const counts: {[k: string]: number} = {}
            let best = 0
            for (const c of word) {
                counts[c] = (counts[c] ?? 0) + 1
                if (counts[c] > best) {
                    best = counts[c]
                }
            }
            return best
        }
      tests:
        - {name: 'top_count(aab)', input: ["aab"], expected: 2}
        - {name: 'top_count(abc)', input: ["abc"], expected: 1}
        - {name: 'top_count(empty)', input: [""], expected: 0}
