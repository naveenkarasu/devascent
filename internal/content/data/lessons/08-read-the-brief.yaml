id: read-the-brief
order: 8
title: Read the Brief
stages:
  - kind: i_do
    title: I do — watch
    body: |
      Before coding, decode the problem: the INPUTS (name + type), the OUTPUT
      (type + meaning), and the EDGE CASES (empty, zero, negative). A *test case*
      is a chosen input paired with the output you expect — writing one forces you
      to understand the spec first.

      Brief: "Given a number, return whether it is even." Input: int n. Output:
      bool. Edge case: 0 is even. A good test:  is_even(0) → True.
  - kind: we_do
    title: We do — together (with a hint)
    body: 'Implement the brief: return True if n is even, else False.'
    task:
      prompt: Return True if n is even, otherwise False.
      func_name: is_even
      starter: |
        def is_even(n):
            pass  # hint: even means remainder 0 after /2 →  return n % 2 == 0
      tests:
        - {name: is_even(4), input: [4], expected: true}
        - {name: is_even(7), input: [7], expected: false}
        - {name: is_even(0), input: [0], expected: true}
  - kind: you_do
    title: You do — solo
    body: 'New brief — decode it, then implement: "Given a list of test scores, return how many are passing (60 or above). Empty list → 0."'
    task:
      prompt: Return how many scores are 60 or above.
      func_name: count_passing
      starter: |
        def count_passing(scores):
            pass  # <- accumulator + a condition (score >= 60)
      tests:
        - {name: 'count_passing([55,60,90])', input: [[55, 60, 90]], expected: 2}
        - {name: 'count_passing([])', input: [[]], expected: 0}
        - {name: 'count_passing([40,60,60])', input: [[40, 60, 60]], expected: 2}
