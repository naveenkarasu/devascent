id: forks
lang: rust
order: 3
title: Forks in the Road
stages:
  - kind: i_do
    title: I do — watch
    body: |
      Code chooses paths with if / else if / else. The if tests a condition
      (true/false); if true its block (inside { }) runs, else control falls
      through. Compare with > < >= <= == (equal) != (not equal). In Rust, braces { }
      mark the block — not indentation — and the condition needs no parentheses.

          fn label(n: i64) -> String {
              if n >= 0 {
                  "non-negative".to_string()
              } else {
                  "negative".to_string()
              }
          }

      Because if/else is an expression in Rust, the last value in each branch
      is returned — no semicolon, no explicit return needed. Remember to call
      .to_string() on every literal — the return type is String, not &str.
  - kind: we_do
    title: We do — together (with a hint)
    body: Given an age, return "allowed" if 18 or older, otherwise "denied".
    task:
      prompt: Return "allowed" if age >= 18 else "denied".
      func_name: can_enter
      starter: |
        fn can_enter(age: i64) -> String {
            // hint: "18 or older" is  age >= 18 . Use if/else returning the two texts with .to_string()
        }
      solution: |
        fn can_enter(age: i64) -> String {
            if age >= 18 {
                "allowed".to_string()
            } else {
                "denied".to_string()
            }
        }
      tests:
        - {name: can_enter(20), input: [20], expected: "allowed"}
        - {name: can_enter(18), input: [18], expected: "allowed"}
        - {name: can_enter(12), input: [12], expected: "denied"}
  - kind: you_do
    title: You do — solo
    body: Three-way choice this time.
    task:
      prompt: Return "positive" if n>0, "negative" if n<0, "zero" if exactly 0.
      func_name: sign_of
      starter: |
        fn sign_of(n: i64) -> String {
            // <- use if / else if / else
        }
      solution: |
        fn sign_of(n: i64) -> String {
            if n > 0 {
                "positive".to_string()
            } else if n < 0 {
                "negative".to_string()
            } else {
                "zero".to_string()
            }
        }
      tests:
        - {name: sign_of(7), input: [7], expected: "positive"}
        - {name: sign_of(-3), input: [-3], expected: "negative"}
        - {name: sign_of(0), input: [0], expected: "zero"}
