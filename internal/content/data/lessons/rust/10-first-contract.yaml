id: first-contract
lang: rust
order: 10
title: First Contract
stages:
  - kind: i_do
    title: I do — watch
    body: |
      You now have every tool for an Easy problem: variables, conditionals, loops,
      Vecs, and reading a spec. Strategy: read the brief, name inputs/outputs,
      build a result Vec with an accumulator loop, and use if / else if / else to
      decide what to push each pass. The most specific condition must come FIRST.
      To turn a number into a String, use  i.to_string().

      Classify 1..=n as "low" (<3) else "high": loop i, push "low" if i<3 else
      "high". n=4 → ["low","low","high","high"].
  - kind: we_do
    title: We do — together (with a hint)
    body: 'FizzBuzz: for 1..=n return a Vec of strings. Hint: test i%15 FIRST, then i%3, then i%5, else i.to_string().'
    task:
      prompt: For 1..=n — "FizzBuzz" if divisible by 3 and 5; "Fizz" if by 3; "Buzz" if by 5; else the number as a string.
      func_name: fizz_report
      starter: |
        fn fizz_report(n: i64) -> Vec<String> {
            // hint: let mut out = Vec::new(); loop 1..=n; check i%15==0 first; out.push(...); return out
        }
      solution: |
        fn fizz_report(n: i64) -> Vec<String> {
            let mut out = Vec::new();
            for i in 1..=n {
                if i % 15 == 0 {
                    out.push("FizzBuzz".to_string());
                } else if i % 3 == 0 {
                    out.push("Fizz".to_string());
                } else if i % 5 == 0 {
                    out.push("Buzz".to_string());
                } else {
                    out.push(i.to_string());
                }
            }
            out
        }
      tests:
        - {name: fizz_report(5), input: [5], expected: ["1", "2", "Fizz", "4", "Buzz"]}
        - {name: fizz_report(3), input: [3], expected: ["1", "2", "Fizz"]}
        - {name: fizz_report(15), input: [15], expected: ["1", "2", "Fizz", "4", "Buzz", "Fizz", "7", "8", "Fizz", "Buzz", "11", "Fizz", "13", "14", "FizzBuzz"]}
  - kind: you_do
    title: You do — solo (graduation)
    body: Filter a Vec — your last task before the bench.
    task:
      prompt: Return a new Vec with only the words that are 4+ letters, in original order ([] → []).
      func_name: long_words
      starter: |
        fn long_words(words: Vec<String>) -> Vec<String> {
            // <- build a result Vec; keep w when w.len() >= 4
        }
      solution: |
        fn long_words(words: Vec<String>) -> Vec<String> {
            let mut out = Vec::new();
            for w in words {
                if w.len() >= 4 {
                    out.push(w);
                }
            }
            out
        }
      tests:
        - {name: 'long_words([hi,code,ok,loops])', input: [["hi", "code", "ok", "loops"]], expected: ["code", "loops"]}
        - {name: 'long_words([])', input: [[]], expected: []}
        - {name: 'long_words([a,be,see])', input: [["a", "be", "see"]], expected: []}
