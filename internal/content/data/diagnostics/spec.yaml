- id: spec_largest
  slot: spec
  order: 6
  difficulty: 2
  measures: spec
  kind: spec
  prompt: |
    Reading a problem statement is half the job. Here's one:

      "Write a function that takes a list of numbers and returns the
       largest one."

    In your own words: what is the INPUT, and what is the OUTPUT?
    (Type a sentence or two, then [enter].)
  spec:
    required: ["list|array|collection|numbers", "largest|biggest|max|maximum|greatest|highest"]
    answer: >
      Input: a list (array) of numbers. Output: a single number — the largest
      (maximum) value. The exact words don't matter; what matters is spotting
      what goes IN and what comes OUT.

