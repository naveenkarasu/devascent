- id: spec_search
  slot: spec
  order: 6
  difficulty: 2
  measures: spec
  kind: spec
  prompt: |
    Here's a problem statement:

      "Given a list of names and a target name, return True if the target
       is in the list, otherwise False."

    In your own words: what are the INPUTS, and what is the OUTPUT?
  spec:
    required: ["list|names|array", "target|name", "true|false|boolean|yes|no|present|found"]
    answer: >
      Inputs: a list of names AND a target name. Output: True/False — whether the
      target is in the list. Two inputs and a yes/no answer.
