# Slot: spec — read a problem statement, state inputs & output (free text).
# Graded leniently by synonym groups (one word from each group must appear).
- id: spec_double
  slot: spec
  order: 6
  difficulty: 1
  measures: spec
  kind: spec
  prompt: |
    Reading a problem statement is half the job. Here's a simple one:

      "Write a function that takes a number and returns it doubled."

    In your own words: what is the INPUT, and what is the OUTPUT?
  spec:
    required: ["number|value|integer|n", "double|twice|two|2x|times 2"]
    answer: >
      Input: a number. Output: that number doubled (number x 2). Spotting
      "a number in, a number out" is the whole point.

