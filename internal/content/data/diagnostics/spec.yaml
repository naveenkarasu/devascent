- id: spec_evens
  slot: spec
  order: 6
  difficulty: 2
  measures: spec
  kind: spec
  prompt: |
    Here's a problem statement:

      "Given a list of integers, return a new list containing only the
       even numbers."

    In your own words: what is the INPUT, and what is the OUTPUT?
  spec:
