# Graph + Trie problems that fit the plain function-call grader honestly:
# graphs as grids / adjacency lists (no node harness needed), and Trie as the
# standard "design" op-list format with the dispatch loop scaffolded so the
# player fills only the data-structure methods. Authored original; grader-validated.

# ── Graph (plain grid / adjacency-list I/O) ──────────────────────────────────
- id: number-of-islands
  time_complexity: "O(m*n)"
  space_complexity: "O(m*n)"
  title: Number of Islands
  difficulty: medium
  pattern: graph
  category: Trees & Graphs
  lists: [blind75, neetcode150]
  func_name: num_islands
  prompt: |
    Number of Islands

    Given a grid of 1s (land) and 0s (water), return the number of islands. An
    island is a group of 1s connected horizontally or vertically.

    Example:
      [[1,1,0],
       [1,0,0],
       [0,0,1]]  -> 2
  starter: |
    def num_islands(grid):
        pass  # write your solution; delete this line
  solution: |
    def num_islands(grid):
        if not grid:
            return 0
        m, n = len(grid), len(grid[0])
        seen = set()

        def dfs(i, j):
            if i < 0 or j < 0 or i >= m or j >= n:
                return
            if grid[i][j] == 0 or (i, j) in seen:
                return
            seen.add((i, j))
            dfs(i + 1, j); dfs(i - 1, j); dfs(i, j + 1); dfs(i, j - 1)

        count = 0
        for i in range(m):
            for j in range(n):
                if grid[i][j] == 1 and (i, j) not in seen:
                    count += 1
                    dfs(i, j)
        return count
  tests:
    - name: case 1
      input: [[[1,1,0],[1,0,0],[0,0,1]]]
      expected: 2
    - name: case 2
      input: [[[1,1,1],[0,1,0],[1,1,1]]]
      expected: 1
    - name: case 3
      input: [[[0]]]
      expected: 0

- id: course-schedule
  time_complexity: "O(V+E)"
  space_complexity: "O(V+E)"
  title: Course Schedule
  difficulty: medium
  pattern: graph
  category: Trees & Graphs
  lists: [blind75, neetcode150]
  func_name: can_finish
  prompt: |
    Course Schedule

    There are num_courses courses labeled 0..num_courses-1. prerequisites[i] =
    [a, b] means you must take course b before course a. Return True if you can
    finish all courses (no cyclic dependency), else False.

    Example:
      can_finish(2, [[1,0]]) -> True
      can_finish(2, [[1,0],[0,1]]) -> False  (cycle)
  starter: |
    def can_finish(num_courses, prerequisites):
        pass  # write your solution; delete this line
  solution: |
    def can_finish(num_courses, prerequisites):
        graph = [[] for _ in range(num_courses)]
        for a, b in prerequisites:
            graph[a].append(b)
        state = [0] * num_courses  # 0 unvisited, 1 visiting, 2 done

        def dfs(c):
            if state[c] == 1:
                return False
            if state[c] == 2:
                return True
            state[c] = 1
            for nxt in graph[c]:
                if not dfs(nxt):
                    return False
            state[c] = 2
            return True

        return all(dfs(c) for c in range(num_courses))
  tests:
    - name: case 1
      input: [2, [[1,0]]]
      expected: true
    - name: case 2
      input: [2, [[1,0],[0,1]]]
      expected: false
    - name: case 3
      input: [1, []]
      expected: true

# ── Trie (design / op-list; dispatch loop scaffolded) ────────────────────────
- id: implement-trie
  time_complexity: "O(n)"
  space_complexity: "O(n)"
  title: Implement Trie (Prefix Tree)
  difficulty: medium
  pattern: trie
  category: Tries
  lists: [blind75, neetcode150]
  func_name: trie_ops
  prompt: |
    Implement Trie (Prefix Tree)

    Implement a trie with insert, search (exact word), and starts_with (any word
    with this prefix). Fill in the four Trie methods — the dispatch loop that runs
    a list of operations is already written for you.

    operations is a list of [op, arg], e.g.
      [["insert","apple"],["search","apple"],["search","app"],
       ["startsWith","app"],["insert","app"],["search","app"]]
    returns one result per op (insert -> null; search/startsWith -> true/false):
      [null, true, false, true, null, true]
  starter: |
    class Trie:
        def __init__(self):
            pass  # set up your data structure

        def insert(self, word):
            pass  # add word to the trie

        def search(self, word):
            pass  # return True if the exact word was inserted

        def starts_with(self, prefix):
            pass  # return True if any inserted word starts with prefix

    # Dispatch loop (already written — do not change):
    def trie_ops(operations):
        t = Trie()
        out = []
        for op, arg in operations:
            if op == "insert":
                out.append(t.insert(arg))
            elif op == "search":
                out.append(t.search(arg))
            else:
                out.append(t.starts_with(arg))
        return out
  solution: |
    class Trie:
        def __init__(self):
            self.root = {}

        def insert(self, word):
            node = self.root
            for c in word:
                node = node.setdefault(c, {})
            node["$"] = True

        def search(self, word):
            node = self.root
            for c in word:
                if c not in node:
                    return False
                node = node[c]
            return "$" in node

        def starts_with(self, prefix):
            node = self.root
            for c in prefix:
                if c not in node:
                    return False
                node = node[c]
            return True

    def trie_ops(operations):
        t = Trie()
        out = []
        for op, arg in operations:
            if op == "insert":
                out.append(t.insert(arg))
            elif op == "search":
                out.append(t.search(arg))
            else:
                out.append(t.starts_with(arg))
        return out
  tests:
    - name: case 1
      input: [[["insert","apple"],["search","apple"],["search","app"],["startsWith","app"],["insert","app"],["search","app"]]]
      expected: [null, true, false, true, null, true]
    - name: case 2
      input: [[["search","x"],["startsWith","x"],["insert","x"],["search","x"]]]
      expected: [false, false, null, true]
    - name: case 3
      input: [[["insert","app"],["insert","apple"],["startsWith","appl"],["search","app"],["search","ap"],["startsWith","b"]]]
      expected: [null, null, true, true, false, false]
