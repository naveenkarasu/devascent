- id: nc-min-stack
  time_complexity: "O(1)"
  space_complexity: "O(n)"
  title: Min Stack
  difficulty: medium
  pattern: stack
  category: Stack
  lists: [neetcode150]
  func_name: min_stack_ops
  prompt: |
    Min Stack

    Implement a stack with push, pop, top, and get_min — all O(1). Fill in the
    MinStack methods; the loop running the operations is written for you. Each op
    is ["push", v] / ["pop"] / ["top"] / ["getMin"]; push/pop return null.

    Example:
      [["push",-2],["push",0],["push",-3],["getMin"],["pop"],["top"],["getMin"]]
        -> [null,null,null,-3,null,0,-2]
  starter: |
    class MinStack:
        def __init__(self):
            pass

        def push(self, val):
            pass

        def pop(self):
            pass

        def top(self):
            pass  # return the top value

        def get_min(self):
            pass  # return the current minimum

    # built for you — do not change:
    def min_stack_ops(operations):
        st = MinStack()
        out = []
        for op in operations:
            if op[0] == "push":
                out.append(st.push(op[1]))
            elif op[0] == "pop":
                out.append(st.pop())
            elif op[0] == "top":
                out.append(st.top())
            else:
                out.append(st.get_min())
        return out
  solution: |
    class MinStack:
        def __init__(self):
            self.stack = []
            self.mins = []

        def push(self, val):
            self.stack.append(val)
            self.mins.append(val if not self.mins else min(val, self.mins[-1]))

        def pop(self):
            self.stack.pop()
            self.mins.pop()

        def top(self):
            return self.stack[-1]

        def get_min(self):
            return self.mins[-1]

    def min_stack_ops(operations):
        st = MinStack()
        out = []
        for op in operations:
            if op[0] == "push":
                out.append(st.push(op[1]))
            elif op[0] == "pop":
                out.append(st.pop())
            elif op[0] == "top":
                out.append(st.top())
            else:
                out.append(st.get_min())
        return out
  tests:
    - name: case 1
      input: [[["push",-2],["push",0],["push",-3],["getMin"],["pop"],["top"],["getMin"]]]
      expected: [null, null, null, -3, null, 0, -2]
    - name: case 2
      input: [[["push",1],["push",2],["top"],["getMin"],["pop"],["getMin"]]]
      expected: [null, null, 2, 1, null, 1]
    - name: case 3
      input: [[["push",2],["push",2],["getMin"],["pop"],["getMin"],["push",1],["getMin"]]]
      expected: [null, null, 2, null, 2, null, 1]

- id: nc-lru-cache
  time_complexity: "O(1)"
  space_complexity: "O(n)"
  title: LRU Cache
  difficulty: medium
  pattern: linked-list
  category: Linked List
  lists: [neetcode150]
  func_name: lru_cache_ops
  prompt: |
    LRU Cache

    Implement a least-recently-used cache with the given capacity. get(key)
    returns the value or -1; put(key,value) inserts/updates and evicts the
    least-recently-used entry when over capacity. Both O(1). Fill in the methods;
    the dispatch loop is written for you. Ops: ["get",k] / ["put",k,v].

    Example (capacity 2):
      [["put",1,1],["put",2,2],["get",1],["put",3,3],["get",2],["get",3]]
        -> [null,null,1,null,-1,3]
  starter: |
    class LRUCache:
        def __init__(self, capacity):
            pass

        def get(self, key):
            pass  # return value or -1

        def put(self, key, value):
            pass

    # built for you — do not change:
    def lru_cache_ops(capacity, operations):
        cache = LRUCache(capacity)
        out = []
        for op in operations:
            if op[0] == "get":
                out.append(cache.get(op[1]))
            else:
                out.append(cache.put(op[1], op[2]))
        return out
  solution: |
    from collections import OrderedDict

    class LRUCache:
        def __init__(self, capacity):
            self.cap = capacity
            self.d = OrderedDict()

        def get(self, key):
            if key not in self.d:
                return -1
            self.d.move_to_end(key)
            return self.d[key]

        def put(self, key, value):
            if key in self.d:
                self.d.move_to_end(key)
            self.d[key] = value
            if len(self.d) > self.cap:
                self.d.popitem(last=False)

    def lru_cache_ops(capacity, operations):
        cache = LRUCache(capacity)
        out = []
        for op in operations:
            if op[0] == "get":
                out.append(cache.get(op[1]))
            else:
                out.append(cache.put(op[1], op[2]))
        return out
  tests:
    - name: case 1
      input: [2, [["put",1,1],["put",2,2],["get",1],["put",3,3],["get",2],["put",4,4],["get",1],["get",3],["get",4]]]
      expected: [null, null, 1, null, -1, null, -1, 3, 4]
    - name: case 2
      input: [1, [["put",2,1],["get",2],["put",3,2],["get",2],["get",3]]]
      expected: [null, 1, null, -1, 2]
    - name: case 3
      input: [2, [["put",1,1],["put",2,2],["put",1,10],["get",1],["get",2],["put",3,3],["get",2]]]
      expected: [null, null, null, 10, 2, null, 2]

- id: nc-time-based-kv
  time_complexity: "O(log n)"
  space_complexity: "O(n)"
  title: Time Based Key-Value Store
  difficulty: medium
  pattern: binary-search
  category: Binary Search
  lists: [neetcode150]
  func_name: time_map_ops
  prompt: |
    Time Based Key-Value Store

    Store multiple values per key, each stamped with a strictly increasing
    timestamp. get(key, t) returns the value with the largest timestamp <= t, or
    "" if none. Fill in the methods; the loop is scaffolded. Ops:
    ["set",key,value,timestamp] / ["get",key,timestamp].

    Example:
      [["set","foo","bar",1],["get","foo",1],["get","foo",3],
       ["set","foo","bar2",4],["get","foo",4],["get","foo",5]]
        -> [null,"bar","bar",null,"bar2","bar2"]
  starter: |
    class TimeMap:
        def __init__(self):
            pass

        def set(self, key, value, timestamp):
            pass

        def get(self, key, timestamp):
            pass  # value with largest timestamp <= given, else ""

    # built for you — do not change:
    def time_map_ops(operations):
        tm = TimeMap()
        out = []
        for op in operations:
            if op[0] == "set":
                out.append(tm.set(op[1], op[2], op[3]))
            else:
                out.append(tm.get(op[1], op[2]))
        return out
  solution: |
    import bisect

    class TimeMap:
        def __init__(self):
            self.store = {}

        def set(self, key, value, timestamp):
            self.store.setdefault(key, ([], []))
            self.store[key][0].append(timestamp)
            self.store[key][1].append(value)

        def get(self, key, timestamp):
            if key not in self.store:
                return ""
            times, vals = self.store[key]
            i = bisect.bisect_right(times, timestamp)
            return vals[i - 1] if i > 0 else ""

    def time_map_ops(operations):
        tm = TimeMap()
        out = []
        for op in operations:
            if op[0] == "set":
                out.append(tm.set(op[1], op[2], op[3]))
            else:
                out.append(tm.get(op[1], op[2]))
        return out
  tests:
    - name: case 1
      input: [[["set","foo","bar",1],["get","foo",1],["get","foo",3],["set","foo","bar2",4],["get","foo",4],["get","foo",5]]]
      expected: [null, "bar", "bar", null, "bar2", "bar2"]
    - name: case 2
      input: [[["get","x",1],["set","x","a",2],["get","x",1],["get","x",2]]]
      expected: ["", null, "", "a"]
    - name: case 3
      input: [[["set","k","v1",5],["set","k","v2",10],["get","k",4],["get","k",5],["get","k",10],["get","k",20]]]
      expected: [null, null, "", "v1", "v2", "v2"]

- id: nc-kth-largest-stream
  time_complexity: "O(log n)"
  space_complexity: "O(n)"
  title: Kth Largest Element in a Stream
  difficulty: easy
  pattern: heap
  category: Heap / Priority Queue
  lists: [neetcode150]
  func_name: kth_largest_stream_ops
  prompt: |
    Kth Largest Element in a Stream

    Maintain the kth largest value as numbers are added. The class is initialized
    with k and an initial list; each add(val) returns the current kth largest.
    Fill in the methods; the loop is scaffolded. Ops: ["add", val].

    Example (k=3, init [4,5,8,2]):
      [["add",3],["add",5],["add",10],["add",9],["add",4]] -> [4,5,5,8,8]
  starter: |
    class KthLargest:
        def __init__(self, k, nums):
            pass

        def add(self, val):
            pass  # return the kth largest after adding val

    # built for you — do not change:
    def kth_largest_stream_ops(k, nums, operations):
        kl = KthLargest(k, nums)
        out = []
        for op in operations:
            out.append(kl.add(op[1]))
        return out
  solution: |
    import heapq

    class KthLargest:
        def __init__(self, k, nums):
            self.k = k
            self.heap = nums[:]
            heapq.heapify(self.heap)
            while len(self.heap) > k:
                heapq.heappop(self.heap)

        def add(self, val):
            heapq.heappush(self.heap, val)
            while len(self.heap) > self.k:
                heapq.heappop(self.heap)
            return self.heap[0]

    def kth_largest_stream_ops(k, nums, operations):
        kl = KthLargest(k, nums)
        out = []
        for op in operations:
            out.append(kl.add(op[1]))
        return out
  tests:
    - name: case 1
      input: [3, [4,5,8,2], [["add",3],["add",5],["add",10],["add",9],["add",4]]]
      expected: [4, 5, 5, 8, 8]
    - name: case 2
      input: [1, [], [["add",-3],["add",-2],["add",-4],["add",0],["add",4]]]
      expected: [-3, -2, -2, 0, 4]
    - name: case 3
      input: [2, [3,5], [["add",4],["add",6],["add",1]]]
      expected: [4, 5, 5]

- id: nc-find-median-stream
  time_complexity: "O(log n)"
  space_complexity: "O(n)"
  title: Find Median from Data Stream
  difficulty: hard
  pattern: heap
  category: Heap / Priority Queue
  lists: [neetcode150, blind75]
  func_name: median_stream_ops
  prompt: |
    Find Median from Data Stream

    Support add_num(v) and find_median() in O(log n) / O(1). Fill in the two-heap
    structure; the dispatch loop is scaffolded. Ops: ["addNum", v] / ["findMedian"].
    With an even count the median is the average of the two middle values (so it
    can be fractional, e.g. 1.5).

    Example:
      [["addNum",1],["addNum",2],["findMedian"],["addNum",3],["findMedian"]]
        -> [null,null,1.5,null,2]
  starter: |
    class MedianFinder:
        def __init__(self):
            pass

        def add_num(self, v):
            pass

        def find_median(self):
            pass  # return the median (average of the two middle values if even)

    # built for you — do not change:
    def median_stream_ops(operations):
        mf = MedianFinder()
        out = []
        for op in operations:
            if op[0] == "addNum":
                out.append(mf.add_num(op[1]))
            else:
                out.append(mf.find_median())
        return out
  solution: |
    import heapq

    class MedianFinder:
        def __init__(self):
            self.lo = []  # max-heap (negated)
            self.hi = []  # min-heap

        def add_num(self, v):
            heapq.heappush(self.lo, -v)
            heapq.heappush(self.hi, -heapq.heappop(self.lo))
            if len(self.hi) > len(self.lo):
                heapq.heappush(self.lo, -heapq.heappop(self.hi))

        def find_median(self):
            if len(self.lo) > len(self.hi):
                return -self.lo[0]
            return (-self.lo[0] + self.hi[0]) / 2.0

    def median_stream_ops(operations):
        mf = MedianFinder()
        out = []
        for op in operations:
            if op[0] == "addNum":
                out.append(mf.add_num(op[1]))
            else:
                out.append(mf.find_median())
        return out
  tests:
    - name: case 1
      input: [[["addNum",1],["addNum",2],["findMedian"],["addNum",3],["findMedian"]]]
      expected: [null, null, 1.5, null, 2]
    - name: case 2
      input: [[["addNum",-1],["addNum",-2],["findMedian"],["addNum",-3],["findMedian"]]]
      expected: [null, null, -1.5, null, -2]
    - name: case 3
      input: [[["addNum",5],["findMedian"]]]
      expected: [null, 5]

- id: nc-design-twitter
  time_complexity: "O(n log n)"
  space_complexity: "O(n)"
  title: Design Twitter
  difficulty: medium
  pattern: heap
  category: Heap / Priority Queue
  lists: [neetcode150]
  func_name: twitter_ops
  prompt: |
    Design Twitter

    Implement post_tweet(user, tweet), get_news_feed(user) (the 10 most recent
    tweet ids from the user and everyone they follow, newest first), follow(a,b),
    and unfollow(a,b). Fill in the methods; the dispatch loop is scaffolded. Ops:
    ["postTweet",u,t] / ["getNewsFeed",u] / ["follow",a,b] / ["unfollow",a,b].

    Example:
      [["postTweet",1,5],["getNewsFeed",1],["follow",1,2],["postTweet",2,6],
       ["getNewsFeed",1],["unfollow",1,2],["getNewsFeed",1]]
        -> [null,[5],null,null,[6,5],null,[5]]
  starter: |
    class Twitter:
        def __init__(self):
            pass

        def post_tweet(self, user, tweet):
            pass

        def get_news_feed(self, user):
            pass  # up to 10 most-recent tweet ids, newest first

        def follow(self, a, b):
            pass

        def unfollow(self, a, b):
            pass

    # built for you — do not change:
    def twitter_ops(operations):
        tw = Twitter()
        out = []
        for op in operations:
            if op[0] == "postTweet":
                out.append(tw.post_tweet(op[1], op[2]))
            elif op[0] == "getNewsFeed":
                out.append(tw.get_news_feed(op[1]))
            elif op[0] == "follow":
                out.append(tw.follow(op[1], op[2]))
            else:
                out.append(tw.unfollow(op[1], op[2]))
        return out
  solution: |
    from collections import defaultdict

    class Twitter:
        def __init__(self):
            self.time = 0
            self.tweets = defaultdict(list)   # user -> list of (time, tweetId)
            self.following = defaultdict(set)

        def post_tweet(self, user, tweet):
            self.tweets[user].append((self.time, tweet))
            self.time += 1

        def get_news_feed(self, user):
            people = self.following[user] | {user}
            all_tweets = []
            for p in people:
                all_tweets.extend(self.tweets[p])
            all_tweets.sort(reverse=True)
            return [tid for _, tid in all_tweets[:10]]

        def follow(self, a, b):
            self.following[a].add(b)

        def unfollow(self, a, b):
            self.following[a].discard(b)

    def twitter_ops(operations):
        tw = Twitter()
        out = []
        for op in operations:
            if op[0] == "postTweet":
                out.append(tw.post_tweet(op[1], op[2]))
            elif op[0] == "getNewsFeed":
                out.append(tw.get_news_feed(op[1]))
            elif op[0] == "follow":
                out.append(tw.follow(op[1], op[2]))
            else:
                out.append(tw.unfollow(op[1], op[2]))
        return out
  tests:
    - name: case 1
      input: [[["postTweet",1,5],["getNewsFeed",1],["follow",1,2],["postTweet",2,6],["getNewsFeed",1],["unfollow",1,2],["getNewsFeed",1]]]
      expected: [null, [5], null, null, [6,5], null, [5]]
    - name: case 2
      input: [[["postTweet",1,1],["postTweet",1,2],["getNewsFeed",1]]]
      expected: [null, null, [2,1]]
    - name: case 3
      input: [[["postTweet",1,10],["postTweet",2,20],["follow",1,2],["getNewsFeed",1],["getNewsFeed",2]]]
      expected: [null, null, null, [20,10], [20]]

- id: nc-detect-squares
  time_complexity: "O(n)"
  space_complexity: "O(n)"
  title: Detect Squares
  difficulty: medium
  pattern: math
  category: Math & Bit
  lists: [neetcode150]
  func_name: detect_squares_ops
  prompt: |
    Detect Squares

    Support add([x,y]) and count([x,y]) — the number of axis-aligned squares that
    can be formed using the query point as one corner and three previously added
    points. Fill in the methods; the loop is scaffolded. Ops: ["add",[x,y]] /
    ["count",[x,y]].

    Example:
      [["add",[3,10]],["add",[11,2]],["add",[3,2]],["count",[11,10]],
       ["count",[14,8]],["add",[11,2]],["count",[11,10]]]
        -> [null,null,null,1,0,null,2]
  starter: |
    class DetectSquares:
        def __init__(self):
            pass

        def add(self, point):
            pass

        def count(self, point):
            pass  # number of squares with `point` as a corner

    # built for you — do not change:
    def detect_squares_ops(operations):
        ds = DetectSquares()
        out = []
        for op in operations:
            if op[0] == "add":
                out.append(ds.add(op[1]))
            else:
                out.append(ds.count(op[1]))
        return out
  solution: |
    from collections import defaultdict

    class DetectSquares:
        def __init__(self):
            self.cnt = defaultdict(int)

        def add(self, point):
            self.cnt[(point[0], point[1])] += 1

        def count(self, point):
            px, py = point
            total = 0
            for (x, y), c in list(self.cnt.items()):
                if abs(x - px) == abs(y - py) and x != px and y != py:
                    total += c * self.cnt[(px, y)] * self.cnt[(x, py)]
            return total

    def detect_squares_ops(operations):
        ds = DetectSquares()
        out = []
        for op in operations:
            if op[0] == "add":
                out.append(ds.add(op[1]))
            else:
                out.append(ds.count(op[1]))
        return out
  tests:
    - name: case 1
      input: [[["add",[3,10]],["add",[11,2]],["add",[3,2]],["count",[11,10]],["count",[14,8]],["add",[11,2]],["count",[11,10]]]]
      expected: [null, null, null, 1, 0, null, 2]
    - name: case 2
      input: [[["add",[0,0]],["add",[0,1]],["add",[1,0]],["add",[1,1]],["count",[0,0]]]]
      expected: [null, null, null, null, 1]
    - name: case 3
      input: [[["add",[0,0]],["add",[2,0]],["add",[0,2]],["count",[2,2]],["add",[2,2]],["count",[0,0]]]]
      expected: [null, null, null, 1, null, 1]
