# NeetCode 150 extra problems — batch 1. Plain I/O, no shape field.
# Authored original; all test cases hand-traced.

- id: nc-course-schedule-ii
  title: Course Schedule II
  difficulty: medium
  pattern: graph
  category: Trees & Graphs
  lists: [neetcode150]
  func_name: find_order
  prompt: |
    Course Schedule II

    There are num_courses courses labeled 0 through num_courses-1.
    prerequisites[i] = [a, b] means course b must be taken before course a.
    Return a valid ordering in which all courses can be finished, or an
    empty list [] if it is impossible (cycle detected).

    Among all valid orderings return the LEXICOGRAPHICALLY SMALLEST one.
    Use a min-heap (Kahn's algorithm) so that the smallest available
    course is always chosen next.

    Example:
      find_order(2, [[1,0]])           -> [0, 1]
      find_order(4, [[1,0],[2,0],[3,1],[3,2]]) -> [0, 1, 2, 3]
      find_order(1, [])                -> [0]
      find_order(2, [[0,1],[1,0]])     -> []
  starter: |
    def find_order(num_courses, prerequisites):
        pass  # write your solution; delete this line
  solution: |
    import heapq

    def find_order(num_courses, prerequisites):
        in_degree = [0] * num_courses
        adj = [[] for _ in range(num_courses)]
        for a, b in prerequisites:
            adj[b].append(a)
            in_degree[a] += 1
        heap = [i for i in range(num_courses) if in_degree[i] == 0]
        heapq.heapify(heap)
        order = []
        while heap:
            node = heapq.heappop(heap)
            order.append(node)
            for nei in adj[node]:
                in_degree[nei] -= 1
                if in_degree[nei] == 0:
                    heapq.heappush(heap, nei)
        return order if len(order) == num_courses else []
  tests:
    - name: case 1
      input: [2, [[1,0]]]
      expected: [0, 1]
    - name: case 2
      input: [4, [[1,0],[2,0],[3,1],[3,2]]]
      expected: [0, 1, 2, 3]
    - name: case 3
      input: [1, []]
      expected: [0]
    - name: case 4
      input: [2, [[0,1],[1,0]]]
      expected: []

- id: nc-walls-and-gates
  title: Walls and Gates
  difficulty: medium
  pattern: graph
  category: Trees & Graphs
  lists: [neetcode150]
  func_name: walls_and_gates
  prompt: |
    Walls and Gates

    You are given an m x n grid rooms initialized with three possible values:
      -1  — a wall or obstacle
       0  — a gate
       2147483647 (INF) — an empty room

    Fill each empty room with the distance to its nearest gate. If it is
    impossible to reach a gate, leave the value as INF. Return the filled grid.

    Use multi-source BFS: seed the queue with all gates simultaneously.

    Example:
      Input:
        [[2147483647,-1,0,2147483647],
         [2147483647,2147483647,2147483647,-1],
         [2147483647,-1,2147483647,-1],
         [0,-1,2147483647,2147483647]]
      Output:
        [[3,-1,0,1],
         [2,2,1,-1],
         [1,-1,2,-1],
         [0,-1,3,4]]
  starter: |
    def walls_and_gates(rooms):
        pass  # write your solution; delete this line
  solution: |
    from collections import deque

    def walls_and_gates(rooms):
        if not rooms or not rooms[0]:
            return rooms
        INF = 2147483647
        m, n = len(rooms), len(rooms[0])
        queue = deque()
        for i in range(m):
            for j in range(n):
                if rooms[i][j] == 0:
                    queue.append((i, j))
        while queue:
            i, j = queue.popleft()
            for di, dj in [(1,0),(-1,0),(0,1),(0,-1)]:
                ni, nj = i + di, j + dj
                if 0 <= ni < m and 0 <= nj < n and rooms[ni][nj] == INF:
                    rooms[ni][nj] = rooms[i][j] + 1
                    queue.append((ni, nj))
        return rooms
  tests:
    - name: case 1
      input: [[[2147483647,-1,0,2147483647],[2147483647,2147483647,2147483647,-1],[2147483647,-1,2147483647,-1],[0,-1,2147483647,2147483647]]]
      expected: [[3,-1,0,1],[2,2,1,-1],[1,-1,2,-1],[0,-1,3,4]]
    - name: case 2
      input: [[[2147483647,0,2147483647,2147483647]]]
      expected: [[1,0,1,2]]
    - name: case 3
      input: [[[2147483647,-1],[-1,0]]]
      expected: [[2147483647,-1],[-1,0]]

- id: nc-redundant-connection
  title: Redundant Connection
  difficulty: medium
  pattern: graph
  category: Trees & Graphs
  lists: [neetcode150]
  func_name: find_redundant_connection
  prompt: |
    Redundant Connection

    You are given a graph that was originally a tree (n nodes labeled 1 to n)
    with one extra edge added. edges[i] = [u, v] represents an undirected edge.

    Return the edge [u, v] that can be removed so the resulting graph is a tree.
    If there are multiple answers, return the edge that appears LAST in the input.

    Use union-find: return the first edge whose two endpoints are already in the
    same connected component — that edge is the redundant one.

    Example:
      find_redundant_connection([[1,2],[1,3],[2,3]])    -> [2, 3]
      find_redundant_connection([[1,2],[2,3],[3,4],[1,4],[1,5]]) -> [1, 4]
  starter: |
    def find_redundant_connection(edges):
        pass  # write your solution; delete this line
  solution: |
    def find_redundant_connection(edges):
        n = len(edges)
        parent = list(range(n + 1))
        rank = [0] * (n + 1)

        def find(x):
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        def union(a, b):
            pa, pb = find(a), find(b)
            if pa == pb:
                return False
            if rank[pa] < rank[pb]:
                pa, pb = pb, pa
            parent[pb] = pa
            if rank[pa] == rank[pb]:
                rank[pa] += 1
            return True

        for u, v in edges:
            if not union(u, v):
                return [u, v]
        return []
  tests:
    - name: case 1
      input: [[[1,2],[1,3],[2,3]]]
      expected: [2, 3]
    - name: case 2
      input: [[[1,2],[2,3],[3,4],[1,4],[1,5]]]
      expected: [1, 4]
    - name: case 3
      input: [[[1,2],[2,3],[1,3]]]
      expected: [1, 3]

- id: nc-find-duplicate
  title: Find the Duplicate Number
  difficulty: medium
  pattern: linked-list
  category: Linked List
  lists: [neetcode150]
  func_name: find_duplicate
  prompt: |
    Find the Duplicate Number

    Given an array nums of n + 1 integers where each integer is in the range
    [1, n] inclusive, there is exactly one repeated number. Return that number.

    Constraints: you must not modify the array and must use only O(1) extra space.

    Use Floyd's cycle detection: treat the array as a linked list where index i
    points to nums[i]. The duplicate creates a cycle; the cycle entrance is the
    repeated value.

    Example:
      find_duplicate([1,3,4,2,2]) -> 2
      find_duplicate([3,1,3,4,2]) -> 3
      find_duplicate([2,2,2,2,2]) -> 2
  starter: |
    def find_duplicate(nums):
        pass  # write your solution; delete this line
  solution: |
    def find_duplicate(nums):
        slow = nums[0]
        fast = nums[nums[0]]
        while slow != fast:
            slow = nums[slow]
            fast = nums[nums[fast]]
        slow2 = 0
        while slow != slow2:
            slow = nums[slow]
            slow2 = nums[slow2]
        return slow
  tests:
    - name: case 1
      input: [[1,3,4,2,2]]
      expected: 2
    - name: case 2
      input: [[3,1,3,4,2]]
      expected: 3
    - name: case 3
      input: [[2,2,2,2,2]]
      expected: 2

- id: nc-burst-balloons
  title: Burst Balloons
  difficulty: hard
  pattern: dp
  category: Dynamic Programming
  lists: [neetcode150]
  func_name: max_coins
  prompt: |
    Burst Balloons

    You are given n balloons indexed 0 through n-1. nums[i] represents the
    number painted on the i-th balloon. You may burst them in any order.

    Bursting balloon i when its left neighbor is l and right neighbor is r
    earns nums[l] * nums[i] * nums[r] coins. Adjacent balloons close the gap.
    After all balloons are burst, return the maximum coins collected.

    Treat nums as padded with virtual 1s at both ends.
    Use interval DP: dp[i][j] = max coins from bursting all balloons strictly
    between boundary indices i and j (in the padded array), where k is the
    LAST balloon burst in that interval.

    Example:
      max_coins([3,1,5,8]) -> 167
      max_coins([1,5])     -> 10
  starter: |
    def max_coins(nums):
        pass  # write your solution; delete this line
  solution: |
    def max_coins(nums):
        nums = [1] + nums + [1]
        n = len(nums)
        dp = [[0] * n for _ in range(n)]
        for length in range(2, n):
            for left in range(0, n - length):
                right = left + length
                for k in range(left + 1, right):
                    coins = (nums[left] * nums[k] * nums[right]
                             + dp[left][k] + dp[k][right])
                    if coins > dp[left][right]:
                        dp[left][right] = coins
        return dp[0][n - 1]
  tests:
    - name: case 1
      input: [[3,1,5,8]]
      expected: 167
    - name: case 2
      input: [[1,5]]
      expected: 10
    - name: case 3
      input: [[7]]
      expected: 7

- id: nc-regex-matching
  title: Regular Expression Matching
  difficulty: hard
  pattern: dp
  category: Dynamic Programming
  lists: [neetcode150]
  func_name: is_match
  prompt: |
    Regular Expression Matching

    Given an input string s and a pattern p, implement regular expression
    matching supporting '.' and '*':
      '.'  matches any single character.
      '*'  matches zero or more of the preceding element.

    The matching must cover the ENTIRE string s (not partial).

    Use 2-D DP where dp[i][j] is True if s[0..i-1] matches p[0..j-1].
    Recurrence for '*': either skip the pair (zero occurrences) using dp[i][j-2],
    or extend (one more occurrence) if p[j-2] matches s[i-1], using dp[i-1][j].

    Example:
      is_match("aa", "a")    -> False
      is_match("aa", "a*")   -> True
      is_match("ab", ".*")   -> True
      is_match("mississippi", "mis*is*p*.") -> False
  starter: |
    def is_match(s, p):
        pass  # write your solution; delete this line
  solution: |
    def is_match(s, p):
        m, n = len(s), len(p)
        dp = [[False] * (n + 1) for _ in range(m + 1)]
        dp[0][0] = True
        for j in range(2, n + 1):
            if p[j - 1] == '*':
                dp[0][j] = dp[0][j - 2]
        for i in range(1, m + 1):
            for j in range(1, n + 1):
                if p[j - 1] == '*':
                    dp[i][j] = dp[i][j - 2]
                    if p[j - 2] == s[i - 1] or p[j - 2] == '.':
                        dp[i][j] = dp[i][j] or dp[i - 1][j]
                elif p[j - 1] == s[i - 1] or p[j - 1] == '.':
                    dp[i][j] = dp[i - 1][j - 1]
        return dp[m][n]
  tests:
    - name: case 1
      input: ["aa", "a"]
      expected: false
    - name: case 2
      input: ["aa", "a*"]
      expected: true
    - name: case 3
      input: ["ab", ".*"]
      expected: true
    - name: case 4
      input: ["mississippi", "mis*is*p*."]
      expected: false
