- id: nc-linked-list-cycle
  time_complexity: "O(n)"
  space_complexity: "O(1)"
  title: Linked List Cycle
  difficulty: easy
  pattern: linked-list
  category: Linked List
  lists: [neetcode150, blind75]
  func_name: has_cycle
  prompt: |
    Linked List Cycle

    Return True if the linked list has a cycle. The list is built for you from
    `values`; if `pos` >= 0 the tail links back to the node at index `pos`
    (a cycle), else there is no cycle. Fill in detect(head).

    Examples:
      has_cycle([3,2,0,-4], 1) -> True
      has_cycle([1], -1) -> False
  starter: |
    class ListNode:
        def __init__(self, val=0, next=None):
            self.val = val
            self.next = next

    def detect(head):
        pass  # return True if the list starting at head has a cycle

    # built for you — do not change:
    def has_cycle(values, pos):
        nodes = [ListNode(v) for v in values]
        for i in range(len(nodes) - 1):
            nodes[i].next = nodes[i + 1]
        if pos >= 0 and nodes:
            nodes[-1].next = nodes[pos]
        return detect(nodes[0] if nodes else None)
  solution: |
    class ListNode:
        def __init__(self, val=0, next=None):
            self.val = val
            self.next = next

    def detect(head):
        slow = fast = head
        while fast is not None and fast.next is not None:
            slow = slow.next
            fast = fast.next.next
            if slow is fast:
                return True
        return False

    def has_cycle(values, pos):
        nodes = [ListNode(v) for v in values]
        for i in range(len(nodes) - 1):
            nodes[i].next = nodes[i + 1]
        if pos >= 0 and nodes:
            nodes[-1].next = nodes[pos]
        return detect(nodes[0] if nodes else None)
  tests:
    - {name: case 1, input: [[3,2,0,-4], 1], expected: true}
    - {name: case 2, input: [[1,2], 0], expected: true}
    - {name: case 3, input: [[1], -1], expected: false}

- id: nc-merge-k-sorted
  time_complexity: "O(n log n)"
  space_complexity: "O(n)"
  title: Merge k Sorted Lists
  difficulty: hard
  pattern: linked-list
  category: Linked List
  lists: [neetcode150, blind75]
  func_name: merge_k_lists
  prompt: |
    Merge k Sorted Lists

    Given k sorted lists (as arrays), merge them into one sorted list and return
    it as an array.

    Examples:
      merge_k_lists([[1,4,5],[1,3,4],[2,6]]) -> [1,1,2,3,4,4,5,6]
      merge_k_lists([]) -> []
  starter: |
    def merge_k_lists(lists):
        pass  # write your solution; delete this line
  solution: |
    def merge_k_lists(lists):
        import heapq
        heap = []
        for i, lst in enumerate(lists):
            if lst:
                heapq.heappush(heap, (lst[0], i, 0))
        out = []
        while heap:
            val, i, j = heapq.heappop(heap)
            out.append(val)
            if j + 1 < len(lists[i]):
                heapq.heappush(heap, (lists[i][j + 1], i, j + 1))
        return out
  tests:
    - {name: case 1, input: [[[1,4,5],[1,3,4],[2,6]]], expected: [1,1,2,3,4,4,5,6]}
    - {name: case 2, input: [[]], expected: []}
    - {name: case 3, input: [[[]]], expected: []}

- id: nc-reorder-list
  time_complexity: "O(n)"
  space_complexity: "O(1)"
  title: Reorder List
  difficulty: medium
  pattern: linked-list
  category: Linked List
  lists: [neetcode150, blind75]
  func_name: reorder_list
  shape: linkedlist
  arg_kinds: [node]
  ret_kind: node
  prompt: |
    Reorder List

    Reorder the list L0 -> L1 -> ... -> Ln  into  L0 -> Ln -> L1 -> Ln-1 -> ...
    Return the head. You receive a real ListNode.

    Examples:
      1->2->3->4   becomes   1->4->2->3
      1->2->3->4->5  becomes  1->5->2->4->3
  starter: |
    # class ListNode: val, next  (provided by the grader)

    def reorder_list(head):
        pass  # write your solution; delete this line
  solution: |
    def reorder_list(head):
        if head is None or head.next is None:
            return head
        slow, fast = head, head
        while fast.next is not None and fast.next.next is not None:
            slow = slow.next
            fast = fast.next.next
        second = slow.next
        slow.next = None
        prev = None
        while second is not None:
            nxt = second.next
            second.next = prev
            prev = second
            second = nxt
        first = head
        while prev is not None:
            n1 = first.next
            n2 = prev.next
            first.next = prev
            prev.next = n1
            first = n1
            prev = n2
        return head
  tests:
    - {name: case 1, input: [[1,2,3,4]], expected: [1,4,2,3]}
    - {name: case 2, input: [[1,2,3,4,5]], expected: [1,5,2,4,3]}
    - {name: case 3, input: [[1]], expected: [1]}

- id: nc-encode-decode-strings
  time_complexity: "O(n)"
  space_complexity: "O(n)"
  title: Encode and Decode Strings
  difficulty: medium
  pattern: string
  category: Arrays & Hashing
  lists: [neetcode150, blind75]
  func_name: encode_decode
  prompt: |
    Encode and Decode Strings

    Design encode(list-of-strings) -> one string, and decode(string) -> the
    original list, so that any strings (including ones with separators) round-trip
    exactly. The harness calls decode(encode(strs)) and checks it equals strs.

    Example:
      encode_decode(["lint","code","love","you"]) -> ["lint","code","love","you"]
  starter: |
    def encode(strs):
        pass  # serialize the list into one string

    def decode(s):
        pass  # restore the original list

    # built for you — do not change:
    def encode_decode(strs):
        s = encode(strs)
        assert isinstance(s, str), "encode must return a single string"
        return decode(s)
  solution: |
    def encode(strs):
        return "".join(str(len(s)) + "#" + s for s in strs)

    def decode(s):
        res = []
        i = 0
        while i < len(s):
            j = i
            while s[j] != "#":
                j += 1
            length = int(s[i:j])
            res.append(s[j + 1:j + 1 + length])
            i = j + 1 + length
        return res

    def encode_decode(strs):
        s = encode(strs)
        assert isinstance(s, str), "encode must return a single string"
        return decode(s)
  tests:
    - {name: case 1, input: [["lint","code","love","you"]], expected: ["lint","code","love","you"]}
    - {name: case 2, input: [["",""]], expected: ["",""]}
    - {name: case 3, input: [["a#b","2#c"]], expected: ["a#b","2#c"]}

- id: nc-clone-graph
  time_complexity: "O(V+E)"
  space_complexity: "O(V+E)"
  title: Clone Graph
  difficulty: medium
  pattern: graph
  category: Trees & Graphs
  lists: [neetcode150, blind75]
  func_name: clone_graph
  prompt: |
    Clone Graph

    Return a deep copy of a connected undirected graph. The graph is given as an
    adjacency list (1-indexed): adj[i] lists the neighbor labels of node i+1.
    The scaffold builds the Node graph and re-serializes your clone; you write
    clone(node) — a deep copy using a visited map.

    Example:
      clone_graph([[2,4],[1,3],[2,4],[1,3]]) -> [[2,4],[1,3],[2,4],[1,3]]
  starter: |
    class Node:
        def __init__(self, val=0, neighbors=None):
            self.val = val
            self.neighbors = neighbors if neighbors is not None else []

    def clone(node):
        pass  # return a deep copy of the connected graph reachable from node

    # built for you — do not change:
    def clone_graph(adj):
        if not adj:
            return []
        nodes = {i + 1: Node(i + 1) for i in range(len(adj))}
        for i, nbrs in enumerate(adj):
            nodes[i + 1].neighbors = [nodes[x] for x in nbrs]
        cloned = clone(nodes[1])
        orig_ids = set(id(n) for n in nodes.values())
        visited_ids = set()
        st = [cloned]
        while st:
            nd = st.pop()
            if id(nd) in visited_ids:
                continue
            visited_ids.add(id(nd))
            for n in nd.neighbors:
                st.append(n)
        assert orig_ids.isdisjoint(visited_ids), "clone must be a deep copy (new node objects)"
        out = [[] for _ in range(len(adj))]
        seen = set()
        stack = [cloned]
        while stack:
            nd = stack.pop()
            if nd.val in seen:
                continue
            seen.add(nd.val)
            out[nd.val - 1] = sorted(n.val for n in nd.neighbors)
            for n in nd.neighbors:
                stack.append(n)
        return out
  solution: |
    class Node:
        def __init__(self, val=0, neighbors=None):
            self.val = val
            self.neighbors = neighbors if neighbors is not None else []

    def clone(node):
        if node is None:
            return None
        mp = {}
        def dfs(n):
            if n in mp:
                return mp[n]
            copy = Node(n.val)
            mp[n] = copy
            for nb in n.neighbors:
                copy.neighbors.append(dfs(nb))
            return copy
        return dfs(node)

    def clone_graph(adj):
        if not adj:
            return []
        nodes = {i + 1: Node(i + 1) for i in range(len(adj))}
        for i, nbrs in enumerate(adj):
            nodes[i + 1].neighbors = [nodes[x] for x in nbrs]
        cloned = clone(nodes[1])
        orig_ids = set(id(n) for n in nodes.values())
        visited_ids = set()
        st = [cloned]
        while st:
            nd = st.pop()
            if id(nd) in visited_ids:
                continue
            visited_ids.add(id(nd))
            for n in nd.neighbors:
                st.append(n)
        assert orig_ids.isdisjoint(visited_ids), "clone must be a deep copy (new node objects)"
        out = [[] for _ in range(len(adj))]
        seen = set()
        stack = [cloned]
        while stack:
            nd = stack.pop()
            if nd.val in seen:
                continue
            seen.add(nd.val)
            out[nd.val - 1] = sorted(n.val for n in nd.neighbors)
            for n in nd.neighbors:
                stack.append(n)
        return out
  tests:
    - {name: case 1, input: [[[2,4],[1,3],[2,4],[1,3]]], expected: [[2,4],[1,3],[2,4],[1,3]]}
    - {name: case 2, input: [[[2],[1]]], expected: [[2],[1]]}
    - {name: case 3, input: [[]], expected: []}
