- id: nc-jump-game-ii
  title: Jump Game II
  difficulty: medium
  pattern: greedy
  category: Greedy
  lists: [neetcode150]
  func_name: jump
  prompt: |
    Jump Game II

    You are given a 0-indexed array of integers where nums[i] represents the
    maximum length of a forward jump from index i. Return the minimum number of
    jumps to reach the last index. You can assume that you can always reach the
    last index.

    Examples:
      jump([2,3,1,1,4]) -> 2
      jump([2,3,0,1,4]) -> 2
  starter: |
    def jump(nums):
        pass  # write your solution; delete this line
  solution: |
    def jump(nums):
        jumps = 0
        cur_end = 0
        farthest = 0
        for i in range(len(nums) - 1):
            farthest = max(farthest, i + nums[i])
            if i == cur_end:
                jumps += 1
                cur_end = farthest
        return jumps
  tests:
    - {name: case 1, input: [[2,3,1,1,4]], expected: 2}
    - {name: case 2, input: [[2,3,0,1,4]], expected: 2}
    - {name: case 3, input: [[1,1,1,1]], expected: 3}

- id: nc-hand-of-straights
  title: Hand of Straights
  difficulty: medium
  pattern: greedy
  category: Greedy
  lists: [neetcode150]
  func_name: is_n_straight_hand
  prompt: |
    Hand of Straights

    Given an array of integers representing a hand of cards and an integer
    group_size, return True if you can rearrange the cards into groups of
    group_size consecutive cards, else False.

    Examples:
      is_n_straight_hand([1,2,3,6,2,3,4,7,8], 3) -> True
      is_n_straight_hand([1,2,3,4,5], 4) -> False
  starter: |
    def is_n_straight_hand(hand, group_size):
        pass  # write your solution; delete this line
  solution: |
    def is_n_straight_hand(hand, group_size):
        if len(hand) % group_size != 0:
            return False
        count = {}
        for card in hand:
            count[card] = count.get(card, 0) + 1
        for card in sorted(count):
            if count[card] > 0:
                need = count[card]
                for i in range(group_size):
                    if count.get(card + i, 0) < need:
                        return False
                    count[card + i] -= need
        return True
  tests:
    - {name: case 1, input: [[1,2,3,6,2,3,4,7,8], 3], expected: true}
    - {name: case 2, input: [[1,2,3,4,5], 4], expected: false}
    - {name: case 3, input: [[1,2,3], 3], expected: true}

- id: nc-merge-triplets
  title: Merge Triplets to Form Target
  difficulty: medium
  pattern: greedy
  category: Greedy
  lists: [neetcode150]
  func_name: merge_triplets
  prompt: |
    Merge Triplets to Form Target

    You are given a 2D array triplets where triplets[i] = [a, b, c] and a target
    triplet target = [x, y, z]. A merge operation takes the element-wise maximum
    of two triplets. Return True if it is possible to choose some triplets and
    merge them to obtain the target triplet, else False.

    Examples:
      merge_triplets([[2,5,3],[1,8,4],[1,7,5]], [2,7,5]) -> True
      merge_triplets([[3,4,5],[4,5,6]], [3,2,5]) -> False
  starter: |
    def merge_triplets(triplets, target):
        pass  # write your solution; delete this line
  solution: |
    def merge_triplets(triplets, target):
        result = [0, 0, 0]
        for t in triplets:
            if t[0] <= target[0] and t[1] <= target[1] and t[2] <= target[2]:
                result = [max(result[i], t[i]) for i in range(3)]
        return result == list(target)
  tests:
    - {name: case 1, input: [[[2,5,3],[1,8,4],[1,7,5]], [2,7,5]], expected: true}
    - {name: case 2, input: [[[3,4,5],[4,5,6]], [3,2,5]], expected: false}
    - {name: case 3, input: [[[1,2,3],[2,2,2]], [2,2,3]], expected: true}

- id: nc-partition-labels
  title: Partition Labels
  difficulty: medium
  pattern: greedy
  category: Greedy
  lists: [neetcode150]
  func_name: partition_labels
  prompt: |
    Partition Labels

    You are given a string s. Partition the string into as many parts as possible
    so that each letter appears in at most one part, and return a list of integers
    representing the size of each part.

    Examples:
      partition_labels("ababcbacadefegdehijhklij") -> [9,7,8]
      partition_labels("eccbbbbdec") -> [10]
  starter: |
    def partition_labels(s):
        pass  # write your solution; delete this line
  solution: |
    def partition_labels(s):
        last = {c: i for i, c in enumerate(s)}
        result = []
        start = end = 0
        for i, c in enumerate(s):
            end = max(end, last[c])
            if i == end:
                result.append(end - start + 1)
                start = i + 1
        return result
  tests:
    - {name: case 1, input: ["ababcbacadefegdehijhklij"], expected: [9,7,8]}
    - {name: case 2, input: ["eccbbbbdec"], expected: [10]}
    - {name: case 3, input: ["a"], expected: [1]}

- id: nc-valid-paren-string
  title: Valid Parenthesis String
  difficulty: medium
  pattern: greedy
  category: Greedy
  lists: [neetcode150]
  func_name: check_valid_string
  prompt: |
    Valid Parenthesis String

    Given a string s containing only '(', ')', and '*', return True if the string
    is valid. '*' can be treated as '(', ')', or an empty string.

    Examples:
      check_valid_string("()") -> True
      check_valid_string("(*)") -> True
      check_valid_string("(*))") -> True
  starter: |
    def check_valid_string(s):
        pass  # write your solution; delete this line
  solution: |
    def check_valid_string(s):
        lo = hi = 0
        for c in s:
            if c == '(':
                lo += 1
                hi += 1
            elif c == ')':
                lo -= 1
                hi -= 1
            else:
                lo -= 1
                hi += 1
            if hi < 0:
                return False
            lo = max(lo, 0)
        return lo == 0
  tests:
    - {name: case 1, input: ["()"], expected: true}
    - {name: case 2, input: ["(*)"], expected: true}
    - {name: case 3, input: ["(*))"], expected: true}
    - {name: case 4, input: ["(((*)"], expected: false}