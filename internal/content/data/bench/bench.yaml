    Examples:
      count_even_sum_triples([1, 2, 3, 4, 5], 1, 5) -> 6
      count_even_sum_triples([2, 4, 6, 8], 1, 4) -> 4
  starter: |
    def count_even_sum_triples(arr: list, l: int, r: int):
        pass  # write your solution; delete this line
  solution: |-
    def count_even_sum_triples(arr: list, l: int, r: int) -> int:
        # Count index triples (i, j, k) with l <= i < j < k <= r (1-indexed)
        # where arr[i-1] + arr[j-1] + arr[k-1] is even.
        # A sum of three integers is even iff all three are even,
        # or exactly two are odd (and one is even).
        sub = arr[l - 1:r]
        e = sum(1 for x in sub if x % 2 == 0)
        o = len(sub) - e
        return (e * (e - 1) * (e - 2)) // 6 + (o * (o - 1) // 2) * e
