      majority_elements_n3([3, 2, 3]) -> [3]
      majority_elements_n3([1, 1, 1, 3, 3, 2, 2, 2]) -> [1, 2]
  starter: |
    def majority_elements_n3(nums):
        pass  # write your solution; delete this line
  solution: |
    def majority_elements_n3(nums):
        cnt1, cnt2, num1, num2 = 0, 0, None, None
        for n in nums:
            if n == num1:
                cnt1 += 1
            elif n == num2:
                cnt2 += 1
            elif cnt1 == 0:
                num1, cnt1 = n, 1
            elif cnt2 == 0:
                num2, cnt2 = n, 1
            else:
                cnt1 -= 1
                cnt2 -= 1
        threshold = len(nums) // 3
        result = []
        if nums.count(num1) > threshold:
            result.append(num1)
        if num2 != num1 and nums.count(num2) > threshold:
            result.append(num2)
        return sorted(result)
