  slug: tiered-income-tax
  func_name: net_salary
  prompt: |-
    Tiered Income Tax

    Implement net_salary(gross: float).

    Examples:
      net_salary(250000.0) -> 250000.0
      net_salary(400000.0) -> 395000.0
  starter: |
    def net_salary(gross: float):
        pass  # write your solution; delete this line
  solution: |
    def net_salary(gross: float) -> float:
        tax = 0.0
        if gross <= 300000:
            tax = 0.0
        elif gross <= 500000:
            tax = (gross - 300000) * 0.05
        elif gross <= 1000000:
            tax = 200000 * 0.05 + (gross - 500000) * 0.20
        else:
            tax = 200000 * 0.05 + 500000 * 0.20 + (gross - 1000000) * 0.30
        return round(gross - tax, 2)
  tests:
  - name: case 1
    input:
    - 250000.0
    expected: 250000.0
  - name: case 2
    input:
    - 400000.0
    expected: 395000.0
