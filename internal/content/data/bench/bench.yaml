- id: modular-exponentiation
  title: Modular Exponentiation
  difficulty: medium
  pattern: math
  category: Math & Bit
  lists: []
  slug: modular-exponentiation
  func_name: modular_exponentiation
  prompt: |-
    Modular Exponentiation

    Implement modular_exponentiation(x, n, m).

    Examples:
      modular_exponentiation(2, 10, 1000) -> 24
      modular_exponentiation(3, 4, 5) -> 1
  starter: |
    def modular_exponentiation(x, n, m):
        pass  # write your solution; delete this line
  solution: |-
    def modular_exponentiation(x, n, m):
        res = 1
        x = x % m
        while n > 0:
            if n % 2 != 0:
                res = (res * x) % m
                n -= 1
            else:
                x = (x * x) % m
                n //= 2
        return res
