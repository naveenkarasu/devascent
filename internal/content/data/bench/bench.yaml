    Merge Two Sorted Arrays Without Extra Space

    Implement merge_sorted_in_place(arr1, arr2).

    Examples:
      merge_sorted_in_place([1, 3, 5], [2, 4, 6]) -> [1, 2, 3, 4, 5, 6]
      merge_sorted_in_place([1, 2, 3], [4, 5, 6]) -> [1, 2, 3, 4, 5, 6]
  starter: |
    def merge_sorted_in_place(arr1, arr2):
        pass  # write your solution; delete this line
  solution: |
    def merge_sorted_in_place(arr1, arr2):
        m = len(arr1)
        n = len(arr2)
        result = [0] * (m + n)
        l, r, k = m - 1, n - 1, m + n - 1
        while l >= 0 and r >= 0:
            if arr1[l] > arr2[r]:
                result[k] = arr1[l]
                l -= 1
            else:
                result[k] = arr2[r]
                r -= 1
            k -= 1
        while l >= 0:
            result[k] = arr1[l]
            l -= 1
            k -= 1
        while r >= 0:
            result[k] = arr2[r]
            r -= 1
            k -= 1
        return result
  tests:
