      is_perfect_square(30) -> false
  starter: |
    def is_perfect_square(num: int):
        pass  # write your solution; delete this line
  solution: |
    def is_perfect_square(num: int) -> bool:
        if num < 1:
            return False
        lo, hi = 1, num
        while lo <= hi:
            mid = (lo + hi) // 2
            sq = mid * mid
            if sq == num:
                return True
            elif sq < num:
                lo = mid + 1
            else:
                hi = mid - 1
        return False
