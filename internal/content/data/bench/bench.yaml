- id: edit-distance
  title: Edit Distance (Levenshtein)
  difficulty: hard
  pattern: dp
  category: Dynamic Programming
  lists: []
  slug: edit-distance-levenshtein
  func_name: edit_distance
  prompt: |-
    Edit Distance (Levenshtein)

    Implement edit_distance(str1, str2).

    Examples:
      edit_distance("horse", "ros") -> 3
      edit_distance("intention", "execution") -> 5
  starter: |
    def edit_distance(str1, str2):
        pass  # write your solution; delete this line
  solution: |-
    def edit_distance(str1, str2):
        m, n = len(str1), len(str2)
        cur = list(range(n + 1))
        for i in range(1, m + 1):
            pre = cur[0]
            cur[0] = i
            for j in range(1, n + 1):
                temp = cur[j]
                if str1[i - 1] == str2[j - 1]:
                    cur[j] = pre
                else:
                    cur[j] = min(pre, cur[j - 1], cur[j]) + 1
                pre = temp
        return cur[n]
  tests:
  - name: case 1
    input:
    - horse
    - ros
    expected: 3
  - name: case 2
    input:
    - intention
    - execution
    expected: 5
  - name: case 3
    input:
    - abc
    - abc
    expected: 0
  - name: case 4
    input:
    - ''
    - abc
    expected: 3
- id: allocate-books
  title: Allocate Books to Students
  difficulty: hard
  pattern: binary-search
  category: Binary Search
  lists: []
  slug: allocate-books-to-students
  func_name: allocate_books
  prompt: |-
    Allocate Books to Students

    Implement allocate_books(pages, students).

    Examples:
      allocate_books([12, 34, 67, 90], 2) -> 113
      allocate_books([15, 17, 20], 2) -> 32
  starter: |
    def allocate_books(pages, students):
        pass  # write your solution; delete this line
  solution: |-
    def allocate_books(pages, students):
        n = len(pages)
        if students > n:
            return -1
        def can_allocate(max_pages):
            count = 1
            total = 0
            for p in pages:
                if p > max_pages:
                    return False
                if total + p > max_pages:
                    count += 1
                    total = p
                else:
                    total += p
            return count <= students
        lo, hi = max(pages), sum(pages)
        ans = hi
        while lo <= hi:
            mid = (lo + hi) // 2
            if can_allocate(mid):
                ans = mid
                hi = mid - 1
            else:
                lo = mid + 1
        return ans
  tests:
  - name: case 1
    input:
    - - 12
