  title: Binary Search in Sorted Array
  difficulty: easy
  pattern: binary-search
  category: Binary Search
  lists: []
  slug: binary-search-in-sorted-array
  func_name: contains_element
  prompt: |-
    Binary Search in Sorted Array

    Implement contains_element(arr: list, key: int).

    Examples:
      contains_element([1, 2, 3, 3, 3, 4, 4, 5], 2) -> true
      contains_element([1, 2, 3, 3, 3, 4, 4, 5], 6) -> false
  starter: |
    def contains_element(arr: list, key: int):
        pass  # write your solution; delete this line
  solution: |
    def contains_element(arr: list, key: int) -> bool:
        lo, hi = 0, len(arr) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if arr[mid] == key:
                return True
            elif arr[mid] < key:
                lo = mid + 1
            else:
                hi = mid - 1
        return False
