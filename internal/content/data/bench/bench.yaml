  func_name: collectible_count
  prompt: |-
    Max-Gap Collectible Items

    Implement collectible_count(rain_times: list, dry_durations: list).

    Examples:
      collectible_count([0, 5, 10], [3, 6, 4, 7]) -> 2
      collectible_count([0, 100], [10, 50, 99, 100, 101]) -> 4
  starter: |
    def collectible_count(rain_times: list, dry_durations: list):
        pass  # write your solution; delete this line
  solution: |-
    def collectible_count(rain_times: list, dry_durations: list) -> int:
        # rain_times: strictly increasing timestamps when it rains.
        # dry_durations: each item's required drying time.
        # After each rain, items get wet again.
        # You can collect all dried items at most once per gap.
        # An item can be collected if its drying time fits within
        # the longest gap between consecutive rain events.
        # Return the maximum number of items you can collect.
        max_gap = 0
        for i in range(len(rain_times) - 1):
            gap = rain_times[i + 1] - rain_times[i]
            if gap > max_gap:
                max_gap = gap
        return sum(1 for d in dry_durations if d <= max_gap)
