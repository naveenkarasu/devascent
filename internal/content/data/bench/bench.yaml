- id: reverse-integer
  title: Reverse Digits of an Integer
  difficulty: easy
  pattern: math
  category: Math & Bit
  lists: []
  slug: reverse-digits-of-an-integer
  func_name: reverse_integer
  prompt: |-
    Reverse Digits of an Integer

    Implement reverse_integer(x).

    Examples:
      reverse_integer(123) -> 321
      reverse_integer(-123) -> -321
  starter: |
    def reverse_integer(x):
        pass  # write your solution; delete this line
  solution: |-
    def reverse_integer(x):
        sign = -1 if x < 0 else 1
        x = abs(x)
        rev = 0
        while x:
            rev = rev * 10 + x % 10
            x //= 10
        rev *= sign
        if rev > 2**31 - 1 or rev < -(2**31):
            return 0
        return rev
  tests:
  - name: case 1
    input:
    - 123
    expected: 321
  - name: case 2
    input:
    - -123
    expected: -321
  - name: case 3
    input:
    - 120
    expected: 21
  - name: case 4
    input:
    - 1534236469
    expected: 0
- id: generate-parentheses
  title: Generate All Valid Parentheses Combinations
  difficulty: medium
  pattern: string
  category: Strings
  lists: []
  slug: generate-all-valid-parentheses-combinations
  func_name: generate_parentheses
  prompt: |-
    Generate All Valid Parentheses Combinations

    Implement generate_parentheses(n).

    Examples:
      generate_parentheses(1) -> ["()"]
      generate_parentheses(2) -> ["(())", "()()"]
  starter: |
    def generate_parentheses(n):
        pass  # write your solution; delete this line
  solution: |-
    def generate_parentheses(n):
        result = []
        def backtrack(s, open_count, close_count):
            if len(s) == 2 * n:
                result.append(s)
                return
            if open_count < n:
                backtrack(s + '(', open_count + 1, close_count)
            if close_count < open_count:
                backtrack(s + ')', open_count, close_count + 1)
        backtrack('', 0, 0)
        return sorted(result)
  tests:
  - name: case 1
    input:
    - 1
