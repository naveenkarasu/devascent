  solution: |-
    def bounded_sequence_sum(n: int, b: int, x: int, y: int) -> int:
        # Build sequence a[0..n] where a[0]=0.
        # For each i >= 1: if a[i-1]+x <= b then a[i]=a[i-1]+x else a[i]=a[i-1]-y.
