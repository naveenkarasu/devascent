  title: Bubble Sort Swap Counter
  difficulty: medium
  pattern: sorting
  category: Arrays & Hashing
  lists: []
  slug: bubble-sort-swap-counter
  func_name: bubble_sort_info
  prompt: |-
    Bubble Sort Swap Counter

    Implement bubble_sort_info(arr: list).

    Examples:
      bubble_sort_info([3, 1, 2]) -> {"swaps": 2, "first": 1, "last": 3}
      bubble_sort_info([1, 2, 3]) -> {"swaps": 0, "first": 1, "last": 3}
  starter: |
    def bubble_sort_info(arr: list):
        pass  # write your solution; delete this line
  solution: |-
    def bubble_sort_info(arr: list) -> dict:
        a = arr[:]
        swaps = 0
        is_sorted = False
        while not is_sorted:
            is_sorted = True
            for i in range(len(a) - 1):
                if a[i] > a[i + 1]:
                    a[i], a[i + 1] = a[i + 1], a[i]
                    swaps += 1
                    is_sorted = False
        return {"swaps": swaps, "first": a[0], "last": a[-1]}
