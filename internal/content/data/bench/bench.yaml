- id: zigzag-string-read
  title: Zigzag Pattern String Read
  difficulty: medium
  pattern: string
  category: Strings
  lists: []
  slug: zigzag-pattern-string-read
  func_name: zigzag_convert
  prompt: |-
    Zigzag Pattern String Read

    Implement zigzag_convert(s, num_rows).

    Examples:
      zigzag_convert("PAYPALISHIRING", 3) -> "PAHNAPLSIIGYIR"
      zigzag_convert("PAYPALISHIRING", 4) -> "PINALSIGYAHRPI"
  starter: |
    def zigzag_convert(s, num_rows):
        pass  # write your solution; delete this line
  solution: |
    def zigzag_convert(s, num_rows):
        if num_rows == 1:
            return s
        rows = [""] * num_rows
        row, direction = 0, -1
        for ch in s:
            rows[row] += ch
            if row == 0 or row == num_rows - 1:
                direction = -direction
            row += direction
        return "".join(rows)
  tests:
