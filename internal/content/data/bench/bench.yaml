- id: subset-sum-equal-k
  title: Subset Sum Equal to K
  difficulty: medium
  pattern: dp
  category: Dynamic Programming
  lists: []
  slug: subset-sum-equal-to-k
  func_name: subset_sum_to_k
  prompt: |-
    Subset Sum Equal to K

    Implement subset_sum_to_k(nums, k).

    Examples:
      subset_sum_to_k([3, 34, 4, 12, 5, 2], 9) -> true
      subset_sum_to_k([3, 34, 4, 12, 5, 2], 30) -> false
  starter: |
    def subset_sum_to_k(nums, k):
        pass  # write your solution; delete this line
  solution: |-
    def subset_sum_to_k(nums, k):
        n = len(nums)
        prev = [False] * (k + 1)
        prev[0] = True
        if nums[0] <= k:
            prev[nums[0]] = True
        for i in range(1, n):
            curr = [False] * (k + 1)
            curr[0] = True
            for j in range(1, k + 1):
                not_take = prev[j]
                take = prev[j - nums[i]] if nums[i] <= j else False
                curr[j] = take or not_take
            prev = curr
        return prev[k]
  tests:
