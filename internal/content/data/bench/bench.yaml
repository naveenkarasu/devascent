    Examples:
      rotate_matrix_cw([[1, 0], [0, 1]]) -> [[0, 1], [1, 0]]
      rotate_matrix_cw([[1, 2, 3], [4, 5, 6], [7, 8, 9]]) -> [[7, 4, 1], [8, 5, 2], [9, 6, 3]]
  starter: |
    def rotate_matrix_cw(matrix: List[List[int]]):
        pass  # write your solution; delete this line
  solution: |
    from typing import List

    def rotate_matrix_cw(matrix: List[List[int]]) -> List[List[int]]:
        """Return a new N x N matrix that is the input rotated 90 degrees clockwise.
        Formula: result[i][j] = matrix[n-1-j][i]
        """
        n = len(matrix)
        return [[matrix[n - 1 - j][i] for j in range(n)] for i in range(n)]
