- id: adjacent-pair-compression
  title: Adjacent Identical Character Compression
  difficulty: medium
  pattern: string
  category: Strings
  lists: []
  slug: adjacent-identical-character-compression
  func_name: compressed_length
  prompt: |-
    Adjacent Identical Character Compression

    Implement compressed_length(s: str).

    Examples:
      compressed_length("aabbcc") -> 3
      compressed_length("abcde") -> 5
  starter: |
    def compressed_length(s: str):
        pass  # write your solution; delete this line
  solution: |-
    def compressed_length(s: str) -> int:
        # Scan left to right; whenever two adjacent identical characters appear,
        # consume both as one unit (greedy). Return the total number of units.
        n = len(s)
        count = 0
        i = 0
        while i < n:
            if i + 1 < n and s[i] == s[i + 1]:
                count += 1
                i += 2
            else:
                count += 1
                i += 1
        return count
