- id: selection-sort-after-k-passes
  title: Array State After K Selection Sort Passes
  difficulty: easy
  pattern: sorting
  category: Arrays & Hashing
  lists: []
  slug: array-state-after-k-selection-sort-passes
  func_name: selection_sort_k_passes
  prompt: |-
    Array State After K Selection Sort Passes

    Implement selection_sort_k_passes(arr: List[int], k: int).

    Examples:
      selection_sort_k_passes([5, 3, 8, 1, 4], 0) -> [5, 3, 8, 1, 4]
      selection_sort_k_passes([5, 3, 8, 1, 4], 1) -> [1, 3, 8, 5, 4]
  starter: |
    def selection_sort_k_passes(arr: List[int], k: int):
        pass  # write your solution; delete this line
  solution: |
    from typing import List

    def selection_sort_k_passes(arr: List[int], k: int) -> List[int]:
        """Return a copy of arr after exactly k passes of selection sort.
        Each pass i finds the minimum of arr[i:] and swaps it into position i.
        """
        result = arr[:]
        n = len(result)
        passes = min(k, n - 1)
        for i in range(passes):
            min_idx = i
            for j in range(i + 1, n):
                if result[j] < result[min_idx]:
                    min_idx = j
            result[i], result[min_idx] = result[min_idx], result[i]
        return result
  tests:
  - name: case 1
    input:
    - - 5
      - 3
      - 8
      - 1
      - 4
    - 0
    expected:
    - 5
    - 3
    - 8
    - 1
    - 4
  - name: case 2
