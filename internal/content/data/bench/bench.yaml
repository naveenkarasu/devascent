  slug: square-root-of-largest-perfect-square-divisor
  func_name: max_square_divisor_root
  prompt: |-
    Square Root of Largest Perfect-Square Divisor

    Implement max_square_divisor_root(n: int).

    Examples:
      max_square_divisor_root(1) -> 1
      max_square_divisor_root(4) -> 2
  starter: |
    def max_square_divisor_root(n: int):
        pass  # write your solution; delete this line
  solution: |
    def max_square_divisor_root(n: int) -> int:
        # Return the largest integer d such that d*d divides n.
        # Equivalently, product of p^(e//2) over each prime factor p with exponent e.
        answer = 1
        remaining = n
        fact = 2
        while fact * fact <= n:
            count = 0
            while remaining % fact == 0:
                count += 1
                remaining //= fact
                if count == 2:
                    answer *= fact
                    count = 0
            fact += 1
        return answer
  tests:
