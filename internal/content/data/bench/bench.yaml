      is_divisible_by_six("11") -> false
  starter: |
    def is_divisible_by_six(s: str):
        pass  # write your solution; delete this line
  solution: |
    def is_divisible_by_six(s: str) -> bool:
        # s represents a non-negative integer as a decimal string.
        # Return True if the number is divisible by 6 (i.e., divisible by 2 AND 3).
        # Divisible by 2: last digit is even.
        # Divisible by 3: sum of digits is divisible by 3.
        if (int(s[-1]) % 2) != 0:
            return False
        digit_sum = sum(int(ch) for ch in s)
        return digit_sum % 3 == 0
