- id: next-permutation
  title: Next Permutation
  difficulty: medium
  pattern: arrays
  category: Arrays & Hashing
  lists: []
  slug: next-permutation
  func_name: next_permutation
  prompt: |-
    Next Permutation

    Implement next_permutation(nums).

    Examples:
      next_permutation([1, 2, 3]) -> [1, 3, 2]
      next_permutation([3, 2, 1]) -> [1, 2, 3]
  starter: |
    def next_permutation(nums):
        pass  # write your solution; delete this line
  solution: |-
    def next_permutation(nums):
        nums = list(nums)
        n = len(nums)
        i = n - 2
        while i >= 0 and nums[i] >= nums[i + 1]:
            i -= 1
        if i != -1:
            j = n - 1
            while nums[j] <= nums[i]:
                j -= 1
            nums[i], nums[j] = nums[j], nums[i]
        left, right = i + 1, n - 1
        while left < right:
            nums[left], nums[right] = nums[right], nums[left]
            left += 1
            right -= 1
        return nums
