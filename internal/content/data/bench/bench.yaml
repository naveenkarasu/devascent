  starter: |
    def majority_element_ii(nums):
        pass  # write your solution; delete this line
  solution: |-
    def majority_element_ii(nums):
        cnt1, cnt2, num1, num2 = 0, 0, 0, 1
        for n in nums:
            if num1 == n:
                cnt1 += 1
            elif num2 == n:
                cnt2 += 1
            elif cnt1 == 0:
                num1, cnt1 = n, 1
            elif cnt2 == 0:
                num2, cnt2 = n, 1
            else:
                cnt1 -= 1
                cnt2 -= 1
        cnt1 = cnt2 = 0
        for n in nums:
            if n == num1:
                cnt1 += 1
            elif n == num2:
                cnt2 += 1
        res = []
        if cnt1 > len(nums) // 3:
            res.append(num1)
        if cnt2 > len(nums) // 3:
            res.append(num2)
        return sorted(res)
