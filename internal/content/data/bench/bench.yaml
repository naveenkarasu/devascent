- id: integer-division-without-operators
  title: Integer Division Without Multiplication or Division
  difficulty: medium
  pattern: bit
  category: Math & Bit
  lists: []
  slug: integer-division-without-multiplication-or-division
  func_name: divide_integers
  prompt: |-
    Integer Division Without Multiplication or Division

    Implement divide_integers(dividend, divisor).

    Examples:
      divide_integers(10, 3) -> 3
      divide_integers(7, -2) -> -3
  starter: |
    def divide_integers(dividend, divisor):
        pass  # write your solution; delete this line
  solution: |
    def divide_integers(dividend, divisor):
        INT_MAX = 2**31 - 1
        INT_MIN = -(2**31)
        if dividend == INT_MIN and divisor == -1:
            return INT_MAX
        negative = (dividend < 0) != (divisor < 0)
        a, b = abs(dividend), abs(divisor)
        result = 0
        while a >= b:
            temp, multiple = b, 1
            while a >= (temp << 1):
                temp <<= 1
                multiple <<= 1
            a -= temp
            result += multiple
        return -result if negative else result
  tests:
