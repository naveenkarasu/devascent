  slug: off-bulbs-between-first-and-last-lit-bulb
  func_name: off_bulbs_between_lit
  prompt: |-
    Off Bulbs Between First and Last Lit Bulb

    Implement off_bulbs_between_lit(bulbs: list).

    Examples:
      off_bulbs_between_lit([1, 0, 0, 1, 0, 1]) -> 3
      off_bulbs_between_lit([0, 0, 1, 0, 0]) -> 0
  starter: |
    def off_bulbs_between_lit(bulbs: list):
        pass  # write your solution; delete this line
  solution: |
    def off_bulbs_between_lit(bulbs: list) -> int:
        # Given a list of 0s and 1s (0=off, 1=on), return the count of
        # off bulbs that lie strictly between the first and last on bulb.
        n = len(bulbs)
        first_on = -1
        last_on = -1
        for i in range(n):
            if bulbs[i] == 1:
                first_on = i
                break
        for i in range(n - 1, -1, -1):
            if bulbs[i] == 1:
                last_on = i
                break
        if first_on == -1:
            return 0
        count = 0
        for j in range(first_on, last_on + 1):
            if bulbs[j] == 0:
                count += 1
        return count
