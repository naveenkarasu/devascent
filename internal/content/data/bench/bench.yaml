    Examples:
      free_vertices(10, 0) -> 10
      free_vertices(10, 1) -> 8
  starter: |
    def free_vertices(n: int, m: int):
        pass  # write your solution; delete this line
  solution: |
    import math

    def free_vertices(n: int, m: int) -> int:
        # Find smallest k such that k*(k-1)//2 >= m.
        # Those k vertices are used; the rest are free.
        k = 0
        while k * (k - 1) // 2 < m:
            k += 1
        return n - k
