- id: minimum-pages-allocation
  title: Minimum Maximum Pages Allocated to Students
  difficulty: hard
  pattern: binary-search
  category: Binary Search
  lists: []
  slug: minimum-maximum-pages-allocated-to-students
  func_name: min_max_pages
  prompt: |-
    Minimum Maximum Pages Allocated to Students

    Implement min_max_pages(pages, num_students).

    Examples:
      min_max_pages([12, 34, 67, 90], 2) -> 113
      min_max_pages([10, 20, 30, 40], 2) -> 60
  starter: |
    def min_max_pages(pages, num_students):
        pass  # write your solution; delete this line
  solution: |
    def min_max_pages(pages, num_students):
        if num_students > len(pages):
            return -1

        def can_allocate(max_pages):
            students = 1
            current = 0
            for p in pages:
                if p > max_pages:
                    return False
                if current + p > max_pages:
                    students += 1
                    current = p
                else:
                    current += p
            return students <= num_students

        lo, hi = max(pages), sum(pages)
        result = hi
        while lo <= hi:
            mid = (lo + hi) // 2
            if can_allocate(mid):
                result = mid
                hi = mid - 1
            else:
                lo = mid + 1
        return result
  tests:
