  title: Median of Two Sorted Arrays
  difficulty: hard
  pattern: binary-search
  category: Binary Search
  lists: []
  slug: median-of-two-sorted-arrays
  func_name: find_median_sorted_arrays
  prompt: |-
    Median of Two Sorted Arrays

    Implement find_median_sorted_arrays(nums1, nums2).

    Examples:
      find_median_sorted_arrays([1, 3], [2]) -> 2.0
      find_median_sorted_arrays([1, 2], [3, 4]) -> 2.5
  starter: |
    def find_median_sorted_arrays(nums1, nums2):
        pass  # write your solution; delete this line
  solution: |
    def find_median_sorted_arrays(nums1, nums2):
        if len(nums1) > len(nums2):
            nums1, nums2 = nums2, nums1
        m, n = len(nums1), len(nums2)
        total = m + n
        lo, hi = 0, m
        while lo <= hi:
            cut1 = (lo + hi) // 2
            cut2 = (total + 1) // 2 - cut1
            l1 = nums1[cut1 - 1] if cut1 > 0 else float('-inf')
            l2 = nums2[cut2 - 1] if cut2 > 0 else float('-inf')
            r1 = nums1[cut1] if cut1 < m else float('inf')
            r2 = nums2[cut2] if cut2 < n else float('inf')
            if l1 <= r2 and l2 <= r1:
                if total % 2 == 0:
                    return (max(l1, l2) + min(r1, r2)) / 2.0
                else:
                    return float(max(l1, l2))
            elif l1 > r2:
                hi = cut1 - 1
            else:
                lo = cut1 + 1
        return 0.0
  tests:
