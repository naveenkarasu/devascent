- id: insertion-sort-array
  title: Sort Array Using Insertion Sort
  difficulty: easy
  pattern: sorting
  category: Arrays & Hashing
  lists: []
  slug: sort-array-using-insertion-sort
  func_name: insertion_sort
  prompt: |-
    Sort Array Using Insertion Sort

    Implement insertion_sort(arr: list).

    Examples:
      insertion_sort([5, 4, 2, 5, 3, 1]) -> [1, 2, 3, 4, 5, 5]
      insertion_sort([3, 11, 4, 200]) -> [3, 4, 11, 200]
  starter: |
    def insertion_sort(arr: list):
        pass  # write your solution; delete this line
  solution: |
    def insertion_sort(arr: list) -> list:
        a = arr[:]
        n = len(a)
        for i in range(1, n):
            key = a[i]
            j = i - 1
            while j >= 0 and a[j] > key:
                a[j + 1] = a[j]
                j -= 1
            a[j + 1] = key
        return a
  tests:
