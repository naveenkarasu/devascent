      best_team_coverage([[1, 1], [0, 0], [1, 1]]) -> [2, 3]
  starter: |
    def best_team_coverage(topics: list):
        pass  # write your solution; delete this line
  solution: |
    def best_team_coverage(topics: list) -> list:
        n = len(topics)
        k = len(topics[0])
        max_topics = 0
        best_count = 0
        for i in range(n):
            for j in range(i + 1, n):
                covered = 0
                for t in range(k):
                    if topics[i][t] == 1 or topics[j][t] == 1:
                        covered += 1
                if covered > max_topics:
                    max_topics = covered
                    best_count = 1
                elif covered == max_topics:
                    best_count += 1
        return [max_topics, best_count]
