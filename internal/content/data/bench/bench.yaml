- id: multiply-large-numbers-as-strings
  title: Multiply Two Large Numbers Represented as Strings
  difficulty: medium
  pattern: string
  category: Strings
  lists: []
  slug: multiply-two-large-numbers-represented-as-strings
  func_name: multiply_strings
  prompt: |-
    Multiply Two Large Numbers Represented as Strings

    Implement multiply_strings(num1, num2).

    Examples:
      multiply_strings("2", "3") -> "6"
      multiply_strings("123", "456") -> "56088"
  starter: |
    def multiply_strings(num1, num2):
        pass  # write your solution; delete this line
  solution: |
    def multiply_strings(num1, num2):
        m, n = len(num1), len(num2)
        pos = [0] * (m + n)
        for i in range(m - 1, -1, -1):
            for j in range(n - 1, -1, -1):
                mul = (ord(num1[i]) - ord('0')) * (ord(num2[j]) - ord('0'))
                p1, p2 = i + j, i + j + 1
                total = mul + pos[p2]
                pos[p2] = total % 10
                pos[p1] += total // 10
        s = ''.join(map(str, pos)).lstrip('0')
        return s if s else '0'
