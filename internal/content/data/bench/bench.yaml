    def insert_to_minimize(a: str) -> str:
        # Given a numeric string a (no leading zeros), insert exactly one digit
        # anywhere to produce the smallest possible number with no leading zeros.
        # Strategy: if a starts with '1', inserting '0' right after the leading '1'
        # gives the smallest possible value (e.g. '19' -> '109').
        # Otherwise, prepending '1' before all digits is optimal (e.g. '36' -> '136').
        if a[0] == '1':
            return a[0] + '0' + a[1:]
        return '1' + a
  tests:
  - name: case 1
    input:
    - '36'
    expected: '136'
  - name: case 2
    input:
    - '100'
    expected: '1000'
  - name: case 3
    input:
    - '19'
    expected: '109'
  - name: case 4
    input:
    - '25'
    expected: '125'
- id: password-strength-check
  title: Password Strength Validator
  difficulty: easy
  pattern: string
  category: Strings
  lists: []
  slug: password-strength-validator
  func_name: is_strong_password
  prompt: |-
    Password Strength Validator

    Implement is_strong_password(s: str).

    Examples:
      is_strong_password("Abcdef1!") -> true
      is_strong_password("abcdefg1!") -> false
  starter: |
    def is_strong_password(s: str):
        pass  # write your solution; delete this line
  solution: |
    def is_strong_password(s: str) -> bool:
        if len(s) < 8:
            return False
        has_upper = any(c.isupper() for c in s)
        has_lower = any(c.islower() for c in s)
        has_digit = any(c.isdigit() for c in s)
        has_special = any(not c.isalnum() for c in s)
        return has_upper and has_lower and has_digit and has_special
  tests:
  - name: case 1
    input:
    - Abcdef1!
    expected: true
  - name: case 2
    input:
    - abcdefg1!
    expected: false
  - name: case 3
    input:
    - ABCDEF1!
    expected: false
  - name: case 4
    input:
    - Ab1!
    expected: false
  - name: case 5
    input:
    - Abcdef12
    expected: false
