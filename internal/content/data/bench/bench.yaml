- id: next-lexicographic-permutation
  title: Next Lexicographic Permutation
  difficulty: medium
  pattern: arrays
  category: Arrays & Hashing
  lists: []
  slug: next-lexicographic-permutation
  func_name: next_permutation
  prompt: |-
    Next Lexicographic Permutation

    Implement next_permutation(nums).

    Examples:
      next_permutation([1, 3, 2]) -> [2, 1, 3]
      next_permutation([1, 2, 3]) -> [1, 3, 2]
  starter: |
    def next_permutation(nums):
        pass  # write your solution; delete this line
  solution: |
    def next_permutation(nums):
        n = len(nums)
        pivot = -1
        for i in range(n - 2, -1, -1):
            if nums[i] < nums[i + 1]:
                pivot = i
                break
        if pivot == -1:
            nums.reverse()
            return nums
        for r in range(n - 1, pivot, -1):
            if nums[r] > nums[pivot]:
                nums[pivot], nums[r] = nums[r], nums[pivot]
                break
        nums[pivot + 1:] = nums[pivot + 1:][::-1]
        return nums
  tests:
  - name: case 1
    input:
    - - 1
      - 3
      - 2
    expected:
    - 2
    - 1
    - 3
