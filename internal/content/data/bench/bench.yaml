  title: Tetris Board Row Clear
  difficulty: medium
  pattern: arrays
  category: Arrays & Hashing
  lists: []
  slug: tetris-board-row-clear
  func_name: clear_full_rows
  prompt: |-
    Tetris Board Row Clear

    Implement clear_full_rows(board: List[List[str]], empty: str).

    Examples:
      clear_full_rows([["X", "X", "X"], ["O", "X", "O"], ["X", "X", "X"]], "O") -> [["O", "O", "O"], ["O", "O", "O"], ["O", "X", "O"]]
      clear_full_rows([["X", "X"], ["O", "X"], ["X", "O"]], "O") -> [["O", "O"], ["O", "X"], ["X", "O"]]
  starter: |
    def clear_full_rows(board: List[List[str]], empty: str):
        pass  # write your solution; delete this line
  solution: |
    from typing import List

    def clear_full_rows(board: List[List[str]], empty: str) -> List[List[str]]:
        """Remove rows containing no empty cell and prepend blank rows to preserve height."""
        cols = len(board[0]) if board else 0
        surviving = [row for row in board if empty in row]
        cleared_count = len(board) - len(surviving)
        blank_rows = [[empty] * cols for _ in range(cleared_count)]
        return blank_rows + surviving
  tests:
