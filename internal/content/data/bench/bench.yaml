- id: triple-bucket-sum
  title: Sum of Triple-Bucket Products
  difficulty: medium
  pattern: math
  category: Math & Bit
  lists: []
  slug: sum-of-triple-bucket-products
  func_name: triple_bucket_sum
  prompt: |-
    Sum of Triple-Bucket Products

    Implement triple_bucket_sum(counts: list).

    Examples:
      triple_bucket_sum([1, 1, 1, 1, 1]) -> 10
      triple_bucket_sum([2, 1, 1, 1, 1]) -> 16
  starter: |
    def triple_bucket_sum(counts: list):
        pass  # write your solution; delete this line
  solution: |
    def triple_bucket_sum(counts: list) -> int:
        # counts has exactly 5 non-negative integers.
        # Return sum of counts[i]*counts[j]*counts[k] for all i<j<k, mod 1e9+7.
        MOD = 10**9 + 7
        ans = 0
        n = len(counts)
        for i in range(n - 2):
            for j in range(i + 1, n - 1):
                for k in range(j + 1, n):
                    ans = (ans + counts[i] * counts[j] * counts[k]) % MOD
        return ans
  tests:
  - name: case 1
    input:
    - - 1
      - 1
      - 1
      - 1
      - 1
    expected: 10
  - name: case 2
    input:
    - - 2
      - 1
      - 1
      - 1
      - 1
