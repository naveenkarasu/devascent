  slug: minimum-changes-to-break-triple-runs
  func_name: min_changes_no_triple
  prompt: |-
    Minimum Changes to Break Triple Runs

    Implement min_changes_no_triple(s: str).

    Examples:
      min_changes_no_triple("aaa") -> 1
      min_changes_no_triple("aaabbb") -> 2
  starter: |
    def min_changes_no_triple(s: str):
        pass  # write your solution; delete this line
  solution: |
    def min_changes_no_triple(s: str) -> int:
        # Return minimum number of characters to change so that
        # no three consecutive characters are the same.
        # Greedy: whenever a run of 3 equals appears, change the 3rd
        # character (breaking the run as early as possible).
        s = list(s)
        ans = 0
        same = 1
        for i in range(1, len(s)):
            if s[i] == s[i - 1]:
                same += 1
            else:
                same = 1
            if same == 3:
                ans += 1
                s[i] = '@'
                same = 1
        return ans
  tests:
