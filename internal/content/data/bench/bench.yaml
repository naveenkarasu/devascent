    Examples:
      trap_water([0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]) -> 6
      trap_water([4, 2, 0, 3, 2, 5]) -> 9
  starter: |
    def trap_water(height):
        pass  # write your solution; delete this line
  solution: |-
    def trap_water(height):
        l, r, level, water = 0, len(height) - 1, 0, 0
        while l < r:
            lower = height[l] if height[l] < height[r] else height[r]
            if height[l] < height[r]:
                l += 1
            else:
                r -= 1
            level = max(level, lower)
            water += level - lower
        return water
