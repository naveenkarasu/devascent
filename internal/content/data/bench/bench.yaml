- id: max-bitwise-and-below-k
  title: Maximum Bitwise AND of Two Distinct Integers Below K
  difficulty: medium
  pattern: bit
  category: Math & Bit
  lists: []
  slug: maximum-bitwise-and-of-two-distinct-integers-below-k
  func_name: max_and_below_k
  prompt: |-
    Maximum Bitwise AND of Two Distinct Integers Below K

    Implement max_and_below_k(n: int, k: int).

    Examples:
      max_and_below_k(5, 3) -> 2
      max_and_below_k(7, 4) -> 3
  starter: |
    def max_and_below_k(n: int, k: int):
        pass  # write your solution; delete this line
  solution: |-
    def max_and_below_k(n: int, k: int) -> int:
        # Given positive integers n and k, find the maximum value of (a & b)
        # over all pairs of distinct integers a, b with 1 <= a < b <= n,
        # subject to (a & b) < k.
        # Key observation: (k-1) | k fills all trailing zero bits of k,
        # giving the largest number expressible by combining bits up to k.
        # If that value fits within [1..n] then k-1 is always achievable
        # (take a=k-1, b=(k-1)|k which is <= n).
        # Otherwise k-2 is always achievable and valid.
        if ((k - 1) | k) <= n:
            return k - 1
        return k - 2
