- id: first-missing-positive-integer
  title: First Missing Positive Integer
  difficulty: hard
  pattern: arrays
  category: Arrays & Hashing
  lists: []
  slug: first-missing-positive-integer
  func_name: first_missing_positive
  prompt: |-
    First Missing Positive Integer

    Implement first_missing_positive(nums).

    Examples:
      first_missing_positive([1, 2, 0]) -> 3
      first_missing_positive([1, -1, 3, 4]) -> 2
  starter: |
    def first_missing_positive(nums):
        pass  # write your solution; delete this line
  solution: |
    def first_missing_positive(nums):
        n = len(nums)
        for i in range(n):
            while 1 <= nums[i] <= n and nums[nums[i] - 1] != nums[i]:
                correct = nums[i] - 1
                nums[i], nums[correct] = nums[correct], nums[i]
        for i in range(n):
            if nums[i] != i + 1:
                return i + 1
        return n + 1
