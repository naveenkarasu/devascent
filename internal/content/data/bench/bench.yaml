- id: count-grid-3-colorings
  title: Count Proper 3-Colorings of a Grid
  difficulty: hard
  pattern: backtracking
  category: Backtracking
  lists: []
  slug: count-proper-3-colorings-of-a-grid
  func_name: count_grid_colorings
  prompt: |-
    Count Proper 3-Colorings of a Grid

    Implement count_grid_colorings(n: int, m: int).

    Examples:
      count_grid_colorings(1, 1) -> 3
      count_grid_colorings(1, 2) -> 6
  starter: |
    def count_grid_colorings(n: int, m: int):
        pass  # write your solution; delete this line
  solution: |
    def count_grid_colorings(n: int, m: int) -> int:
        # Count the number of ways to assign one of 3 colors to each cell of an
        # n x m grid such that no two horizontally or vertically adjacent cells
        # share the same color. Return the count modulo 10^9 + 7.
        MOD = 10**9 + 7
        grid = [[0] * m for _ in range(n)]

        def backtrack(pos):
            if pos == n * m:
                return 1
            r, c = divmod(pos, m)
            total = 0
            for color in range(1, 4):
                if (r == 0 or grid[r - 1][c] != color) and \
                   (c == 0 or grid[r][c - 1] != color):
                    grid[r][c] = color
                    total = (total + backtrack(pos + 1)) % MOD
                    grid[r][c] = 0
            return total

        return backtrack(0)
  tests:
  - name: case 1
    input:
    - 1
    - 1
    expected: 3
  - name: case 2
    input:
    - 1
    - 2
    expected: 6
  - name: case 3
    input:
    - 2
    - 2
    expected: 18
  - name: case 4
    input:
    - 1
    - 3
    expected: 12
