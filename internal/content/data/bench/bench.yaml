        pass  # write your solution; delete this line
  solution: |-
    def max_div_plus_mod(l: int, r: int, a: int) -> int:
        # Find x in [l, r] that maximizes floor(x/a) + x%a.
        # Candidates: x=r and x=(largest multiple of a <= r) - 1.
        best = r // a + r % a
        multiple = (r // a) * a
