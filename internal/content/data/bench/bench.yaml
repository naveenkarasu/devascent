    Examples:
      modular_sqrt(4, 5) -> 2
      modular_sqrt(1, 7) -> 1
  starter: |
    def modular_sqrt(n: int, m: int):
        pass  # write your solution; delete this line
  solution: |-
    def modular_sqrt(n: int, m: int) -> int:
        # Find the smallest non-negative integer x such that x^2 % m == n.
        # Return -1 if no such x exists in [0, m-1].
        for x in range(m):
            if (x * x) % m == n:
                return x
        return -1
