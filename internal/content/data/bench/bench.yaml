- id: running-median-of-stream
  title: Running Median of a Data Stream
  difficulty: hard
  pattern: heap
  category: Heap / Priority Queue
  lists:
  - blind75
  - neetcode150
  slug: find-median-from-data-stream
  func_name: running_medians
  prompt: |-
    Running Median of a Data Stream

    Implement running_medians(stream).

    Examples:
      running_medians([5, 15, 1, 3]) -> [5.0, 10.0, 5.0, 4.0]
      running_medians([2, 4, 6]) -> [2.0, 3.0, 4.0]
  starter: |
    def running_medians(stream):
        pass  # write your solution; delete this line
  solution: |
    import heapq

    def running_medians(stream):
        lo = []  # max-heap (stored as negatives)
        hi = []  # min-heap
        result = []
        for num in stream:
            heapq.heappush(lo, -num)
            heapq.heappush(hi, -heapq.heappop(lo))
            if len(hi) > len(lo):
                heapq.heappush(lo, -heapq.heappop(hi))
            if len(lo) == len(hi):
                result.append((-lo[0] + hi[0]) / 2.0)
            else:
                result.append(float(-lo[0]))
        return result
