- id: sieve-of-eratosthenes
  title: Primes Up to N
  difficulty: medium
  pattern: math
  category: Math & Bit
  lists: []
  slug: primes-up-to-n
  func_name: primes_up_to_n
  prompt: |-
    Primes Up to N

    Implement primes_up_to_n(n: int).

    Examples:
      primes_up_to_n(1) -> []
      primes_up_to_n(5) -> [2, 3, 5]
  starter: |
    def primes_up_to_n(n: int):
        pass  # write your solution; delete this line
  solution: |
    def primes_up_to_n(n: int) -> list:
        if n < 2:
            return []
        is_prime = [True] * (n + 1)
        is_prime[0] = is_prime[1] = False
        i = 2
        while i * i <= n:
            if is_prime[i]:
                for j in range(i * i, n + 1, i):
                    is_prime[j] = False
            i += 1
        return [i for i in range(2, n + 1) if is_prime[i]]
  tests:
