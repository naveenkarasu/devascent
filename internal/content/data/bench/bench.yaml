    def product_of_counts(s: str) -> int:
        MOD = 10**9 + 7
        freq = {}
        for ch in s:
            freq[ch] = freq.get(ch, 0) + 1
        result = 1
        for cnt in freq.values():
            result = (result * cnt) % MOD
        return result
