    Examples:
      filter_even_digit_numbers([42, 564, 5775, 34, 123, 454, 1, 5, 45, 3556, 23442]) -> [42, 5775, 34, 45, 3556]
      filter_even_digit_numbers([1, 10, 100, 1000]) -> [10, 1000]
  starter: |
    def filter_even_digit_numbers(nums: list):
        pass  # write your solution; delete this line
  solution: |
    def filter_even_digit_numbers(nums: list) -> list:
        def digit_count(n):
            if n == 0:
                return 1
            count = 0
            while n > 0:
                count += 1
                n //= 10
            return count
        return [x for x in nums if digit_count(x) % 2 == 0]
