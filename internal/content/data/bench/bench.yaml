  starter: |
    def lexical_order(n):
        pass  # write your solution; delete this line
  solution: |
    def lexical_order(n):
        result = []
        cur = 1
        while len(result) < n:
            result.append(cur)
            if cur * 10 <= n:
                cur *= 10
            else:
                while cur % 10 == 9 or cur >= n:
                    cur //= 10
                cur += 1
        return result
