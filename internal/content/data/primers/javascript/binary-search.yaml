  example: |
    Worked example — find the index of target in a sorted array, or -1 if absent:

      Keep an inclusive range [lo..hi]. Each step look at the middle element and drop
      the half that cannot contain the target. The range shrinks by half every step,
      so a million elements take only ~20 checks. Math.floor gives a valid integer
      index without any overflow concern in JavaScript.

        function search(arr, target) {
            let lo = 0, hi = arr.length - 1;
            while (lo <= hi) {
                const mid = Math.floor((lo + hi) / 2);
                if (arr[mid] === target) {
                    return mid;
                } else if (arr[mid] < target) {
                    lo = mid + 1;
                } else {
                    hi = mid - 1;
                }
            }
            return -1;
        }

    Takeaway: the invariant is "if target exists, it is inside [lo..hi]." Every branch
    must preserve that. When lo > hi the range is empty — the target is absent.
