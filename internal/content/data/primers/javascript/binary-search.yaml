- category: 'Binary Search'
  lang: javascript
  title: 'Binary Search — JavaScript refresher'
  summary: |
    Binary search finds a target in a SORTED array in O(log n) by repeatedly halving
    the search range. Look at the middle: if it is the target you are done; if the
    target is smaller, throw away the right half; if larger, throw away the left half.

    The pattern generalizes far beyond "find this number": any time the answer space
    is monotonic ("works for everything >= X, fails below X"), you can binary-search
    the smallest X that works.

    JavaScript notes:
      - JS numbers are 64-bit floats — (lo + hi) / 2 does NOT integer-overflow like
        Java. Use Math.floor((lo + hi) / 2) to get an integer midpoint.
      - There is no built-in Arrays.binarySearch — write your own.
      - Always verify the loop invariant: "if the target exists, it is in [lo..hi]."
  sections:
    - title: Declarations
      ops:
        - label: 'standard inclusive bounds'
          code: 'let lo = 0, hi = arr.length - 1;'
        - label: 'answer-space search (search on a value range)'
          code: 'let lo = minPossible, hi = maxPossible;'
        - label: 'integer midpoint (Math.floor prevents fractional index)'
          code: 'const mid = Math.floor((lo + hi) / 2);'
    - title: Basic operations
      ops:
        - label: 'loop condition (inclusive both ends)'
          code: |
            while (lo <= hi) {
              /* ... */
            }
        - label: 'check middle'
          code: 'if (arr[mid] === target) return mid;'
        - label: 'discard left half (target is to the right)'
          code: 'lo = mid + 1;'
        - label: 'discard right half (target is to the left)'
          code: 'hi = mid - 1;'
        - label: 'not found sentinel'
          code: 'return -1;   // lo > hi means absent'
    - title: Iteration & loops
      ops:
        - label: 'standard binary search loop'
          code: |
            while (lo <= hi) {
                const mid = Math.floor((lo + hi) / 2);
                if (arr[mid] === target) return mid;
                else if (arr[mid] < target) lo = mid + 1;
                else hi = mid - 1;
            }
        - label: 'left-boundary (first index >= target)'
          code: |
            while (lo < hi) {
                const mid = Math.floor((lo + hi) / 2);
                if (arr[mid] < target) lo = mid + 1;
                else hi = mid;
            }
        - label: 'answer-space: keep lo as best valid answer'
          code: |
            if (feasible(mid)) {
              best = mid;
              hi = mid - 1;
            } else lo = mid + 1;
