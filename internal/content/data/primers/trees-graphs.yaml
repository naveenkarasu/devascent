- category: "Trees & Graphs"
  lang: python
  title: "Trees & Graphs — Python refresher"
  summary: |
    Trees are connected acyclic graphs; binary trees add left/right children.
    DFS (recursive or stack) explores depth-first; BFS (deque) explores level
    by level. Graphs extend this to arbitrary edges — add a visited set to
    avoid cycles. Reach for DFS on path/subtree problems, BFS on shortest-path
    or level-order problems.
  sections:
    - title: Declarations
      ops:
        - label: 'TreeNode class'
          code: |
            class TreeNode:
                def __init__(self, val=0, left=None, right=None):
                    self.val = val
                    self.left = left
                    self.right = right
        - label: 'adjacency list (unweighted)'
          code: |
            from collections import defaultdict
            graph = defaultdict(list)
        - label: 'adjacency list (weighted)'
          code: |
            adj = defaultdict(list)
            adj[u].append((v, w))
        - label: 'BFS queue'
          code: |
            from collections import deque
            q = deque([root])
        - label: 'visited set (graph cycle prevention)'
          code: 'seen = set()'
    - title: Basic operations
      ops:
        - label: 'add directed edge'
          code: 'graph[u].append(v)'
        - label: 'add undirected edge'
          code: |
            graph[u].append(v)
            graph[v].append(u)
        - label: 'BFS dequeue'
          code: 'node = q.popleft()'
        - label: 'BFS enqueue children'
          code: 'if node.left: q.append(node.left)'
        - label: 'check if node is leaf'
