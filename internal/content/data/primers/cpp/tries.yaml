  example: |
    Worked example — implement a trie supporting insert, search, and startsWith:

      A TrieNode holds 26 child pointers (initially null) and an isEnd flag.
      Insert walks the chain, creating nodes as needed. Search walks the chain
      and returns isEnd at the last character. startsWith is identical but
      returns true regardless of isEnd.

        struct TrieNode {
            TrieNode* children[26] = {};
            bool isEnd = false;
        };

        struct Trie {
            TrieNode* root = new TrieNode();

            void insert(const string& w) {
                TrieNode* cur = root;
                for (char c : w) {
                    int i = c - 'a';
                    if (!cur->children[i]) cur->children[i] = new TrieNode();
                    cur = cur->children[i];
                }
                cur->isEnd = true;
            }

            bool search(const string& w) {
                TrieNode* cur = root;
                for (char c : w) {
                    int i = c - 'a';
                    if (!cur->children[i]) return false;
                    cur = cur->children[i];
                }
                return cur->isEnd;
            }
        };

    Takeaway: tries trade memory for speed. Each node needs O(26) pointers for a
    lowercase-only alphabet; use unordered_map<char, TrieNode*> for larger sets.
