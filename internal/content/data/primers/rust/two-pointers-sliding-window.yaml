- category: 'Two Pointers & Sliding Window'
  lang: rust
  title: 'Two Pointers & Sliding Window — Rust refresher'
  summary: |
    Two-pointer techniques use two indices that move through a slice together,
    avoiding the O(n^2) cost of nested loops. The window variant maintains a
    contiguous sub-slice whose size or contents satisfy a constraint.

    Two-pointer patterns:
      - Opposite ends (lo/hi): palindrome check, two-sum in sorted array.
      - Same direction (slow/fast): remove duplicates, partition by predicate.

    Sliding-window pattern:
      - Expand right pointer; shrink left pointer when the window violates the
        constraint. Track state (HashMap counts, running sum) incrementally.

    Rust notes:
      - Slices (&[T]) and string slices (&str) are index-able; use usize for indices.
      - Char-level windows on &str: collect to Vec<char> first, or use
        s.as_bytes() for ASCII problems.
      - Mutable slice operations like .swap(i, j) work in place.
  sections:
    - title: Declarations
      ops:
        - label: 'two pointers at opposite ends'
          code: 'let (mut lo, mut hi) = (0usize, nums.len() - 1);'
        - label: 'sliding window left/right'
          code: 'let (mut left, mut right) = (0usize, 0usize);'
        - label: 'window state — character count'
          code: 'let mut window: HashMap<u8, i32> = HashMap::new();'
        - label: 'collect string to byte slice for ASCII'
          code: 'let bytes = s.as_bytes();'
    - title: Basic operations
      ops:
        - label: 'swap two elements in a Vec'
          code: 'v.swap(i, j);'
        - label: 'advance right and add to window'
          code: |
            *window.entry(bytes[right]).or_insert(0) += 1;
            right += 1;
        - label: 'shrink left and remove from window'
          code: |
            let e = window.entry(bytes[left]).or_insert(0);
            *e -= 1;
            if *e == 0 { window.remove(&bytes[left]); }
            left += 1;
        - label: 'window length'
          code: 'let len = right - left;'
    - title: Iteration & loops
      ops:
        - label: 'opposite-ends while loop'
          code: |
            while lo < hi {
                // process nums[lo] and nums[hi]
                lo += 1;
                hi -= 1;
            }
        - label: 'sliding window over array'
          code: |
            for right in 0..n {
                // expand: include nums[right]
                while /* window invalid */ left < right {
                    // shrink: exclude nums[left]
                    left += 1;
                }
                // record answer for this window
            }
        - label: 'fixed-size window of k elements'
          code: |
            for i in 0..nums.len() {
                // add nums[i]
                if i >= k {
                    // remove nums[i - k]
                }
            }
    - title: Special operations (two pointers & sliding window)
      ops:
        - label: 'two-sum in sorted array (opposite ends)'
          code: |
            while lo < hi {
                let s = nums[lo] + nums[hi];
                if s == target { return Some((lo, hi)); }
                else if s < target { lo += 1; }
                else { hi -= 1; }
            }
        - label: 'remove duplicates in-place (slow/fast)'
          code: |
            let mut slow = 0usize;
            for fast in 1..nums.len() {
                if nums[fast] != nums[slow] {
                    slow += 1;
                    nums[slow] = nums[fast];
                }
            }
        - label: 'longest substring without repeating characters'
          code: |
            let mut seen: HashMap<u8, usize> = HashMap::new();
            let (mut left, mut best) = (0usize, 0usize);
            let bytes = s.as_bytes();
            for right in 0..bytes.len() {
                if let Some(&prev) = seen.get(&bytes[right]) {
                    if prev >= left { left = prev + 1; }
                }
                seen.insert(bytes[right], right);
                best = best.max(right - left + 1);
            }
        - label: 'check if a string is a palindrome (two pointers)'
          code: |
            let bytes = s.as_bytes();
            let (mut lo, mut hi) = (0usize, bytes.len() - 1);
            while lo < hi {
                if bytes[lo] != bytes[hi] { return false; }
                lo += 1;
                hi -= 1;
            }
  example: |
    Worked example — longest subarray with sum at most k:

      Maintain a window [left, right]. Expand right each step; if the running sum
      exceeds k, shrink from the left. Record the window length at each valid state.
      One pass, O(n) time.

        fn longest_subarray(nums: &[i32], k: i32) -> usize {
            let (mut left, mut sum, mut best) = (0usize, 0i32, 0usize);
            for right in 0..nums.len() {
                sum += nums[right];
                while sum > k && left <= right {
                    sum -= nums[left];
                    left += 1;
                }
                best = best.max(right - left + 1);
            }
            best
        }

    Takeaway: expand eagerly, shrink lazily — update your answer after each
    expansion, inside the valid window. The left pointer never goes backward.
