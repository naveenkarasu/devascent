    - title: Special operations (arrays & hashing)
      ops:
        - label: 'two-sum using a HashMap'
          code: |
            let mut seen: HashMap<i32, usize> = HashMap::new();
            for (i, &x) in nums.iter().enumerate() {
                if let Some(&j) = seen.get(&(target - x)) {
                    return vec![j as i32, i as i32];
                }
                seen.insert(x, i);
            }
        - label: 'letter frequency with fixed array'
          code: |
            let mut freq = [0u32; 26];
            for c in s.chars() {
                freq[(c as u8 - b'a') as usize] += 1;
            }
        - label: 'group anagrams by sorted key'
          code: |
            let mut groups: HashMap<String, Vec<String>> = HashMap::new();
            for word in words {
                let mut key: Vec<char> = word.chars().collect();
                key.sort_unstable();
                let key: String = key.into_iter().collect();
                groups.entry(key).or_insert_with(Vec::new).push(word);
            }
        - label: 'window of size k — count distinct'
          code: |
            let mut counts: HashMap<i32, i32> = HashMap::new();
            for i in 0..nums.len() {
                *counts.entry(nums[i]).or_insert(0) += 1;
                if i >= k {
                    let old = nums[i - k];
                    *counts.get_mut(&old).unwrap() -= 1;
                    if counts[&old] == 0 {
                        counts.remove(&old);
                    }
                }
            }
  example: |
    Worked example — are two strings anagrams of each other?

      Both strings must have the same character frequencies. Build a fixed
      26-element array, increment for each char in the first string, decrement
      for each char in the second. If every cell is zero, they are anagrams.

        fn is_anagram(a: &str, b: &str) -> bool {
            if a.len() != b.len() { return false; }
            let mut freq = [0i32; 26];
            for c in a.chars() { freq[(c as u8 - b'a') as usize] += 1; }
            for c in b.chars() { freq[(c as u8 - b'a') as usize] -= 1; }
            freq.iter().all(|&x| x == 0)
        }

    Takeaway: a fixed [i32; 26] is faster than a HashMap for lowercase-letter
    counting, and the entry API is your tool for any other keyed counting task.
