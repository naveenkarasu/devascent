- category: 'Arrays & Hashing'
  lang: rust
  title: 'Arrays & Hashing — Rust refresher'
  summary: |
    Arrays and hash maps are the backbone of frequency-count and lookup problems.
    In Rust the go-to types are Vec<T> (a growable array) and HashMap<K,V> /
    HashSet<T> from std::collections.

    Ownership rules mean you often iterate with .iter() (borrows) rather than
    consuming the collection. Use .enumerate() to get (index, value) pairs.

    Key patterns:
      - Frequency count: HashMap<char, usize> or a fixed [usize; 26] for letters.
      - Deduplication: collect into a HashSet, or sort + dedup() on a Vec.
      - Two-sum / lookup: insert while scanning, check before inserting.
      - The entry API avoids double-lookup: map.entry(k).or_insert(0).

    Rust gotcha: Vec indexing (v[i]) panics on out-of-bounds. Prefer .get(i)
    which returns Option<&T>, or guard with i < v.len().
  sections:
