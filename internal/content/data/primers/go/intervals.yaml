- category: 'Intervals'
  lang: go
  title: 'Intervals — Go refresher'
  summary: |
    Interval problems deal with ranges [start, end] and ask you to merge,
    insert, count overlaps, or schedule them. The key move in almost every
    interval problem is to SORT by start time (or end time) first.

    Two intervals [a,b] and [c,d] overlap when a <= d AND c <= b.
    Merge them into [min(a,c), max(b,d)].

    Go notes:
      - Represent an interval as []int{start, end} or a struct.
      - sort.Slice with a custom less func is how you sort multi-field data.
      - Build the merged list by comparing the new interval's start against
        the last merged interval's end.
  sections:
    - title: Declarations
      ops:
        - label: 'interval as int slice'
          code: 'interval := []int{2, 6}'
        - label: 'list of intervals'
          code: 'intervals := [][]int{{1,3},{2,6},{8,10}}'
        - label: 'sort by start time'
          code: 'sort.Slice(intervals, func(i, j int) bool { return intervals[i][0] < intervals[j][0] })'
    - title: Basic operations
      ops:
        - label: 'check overlap'
          code: 'overlap := a[0] <= b[1] && b[0] <= a[1]'
        - label: 'merge two overlapping intervals'
          code: 'merged := []int{min(a[0], b[0]), max(a[1], b[1])}'
        - label: 'extend last merged interval'
          code: 'res[len(res)-1][1] = max(res[len(res)-1][1], iv[1])'
        - label: 'check if new interval comes after last merged'
          code: 'if iv[0] > res[len(res)-1][1] { res = append(res, iv) }'
    - title: Iteration & loops
      ops:
        - label: 'merge overlapping intervals'
          code: |
            res := [][]int{intervals[0]}
            for _, iv := range intervals[1:] {
                last := res[len(res)-1]
                if iv[0] <= last[1] {
                    if iv[1] > last[1] {
                        last[1] = iv[1]
                    }
                } else {
                    res = append(res, iv)
                }
            }
        - label: 'count meeting rooms needed (sweep line)'
          code: |
            for _, iv := range sorted {
                if iv[0] >= minEnd {
                    heap.Pop(endHeap)
                }
                heap.Push(endHeap, iv[1])
            }
    - title: Special operations (intervals)
      ops:
        - label: 'insert interval and merge'
          code: |
            res := [][]int{}
            for i, iv := range intervals {
                if newInterval[1] < iv[0] {
                    res = append(res, newInterval)
                    return append(res, intervals[i:]...)
                }
                if newInterval[0] > iv[1] {
                    res = append(res, iv)
                } else {
                    newInterval[0] = min(newInterval[0], iv[0])
                    newInterval[1] = max(newInterval[1], iv[1])
                }
            }
        - label: 'total covered length (merged intervals)'
          code: |
            total := 0
            for _, iv := range merged {
                total += iv[1] - iv[0]
            }
        - label: 'find all overlapping pairs'
          code: 'for i := 0; i < len(intervals)-1; i++ { if intervals[i][1] >= intervals[i+1][0] { /* overlap */ } }'
        - label: 'non-overlapping after removal (greedy, sort by end)'
          code: |
            end := -(1 << 62)
            for _, iv := range sorted {
                if iv[0] >= end {
                    end = iv[1]
                } else {
                    remove++
                }
            }
  example: |
    Worked example — merge all overlapping intervals.

      Sort by start. Walk the list: if the current interval starts before or at
      the end of the last result interval, extend that end. Otherwise append a
      new interval. One pass after sorting: O(n log n) total.

        func merge(intervals [][]int) [][]int {
            sort.Slice(intervals, func(i, j int) bool {
                return intervals[i][0] < intervals[j][0]
            })
            res := [][]int{intervals[0]}
            for _, iv := range intervals[1:] {
                last := res[len(res)-1]
                if iv[0] <= last[1] {
                    if iv[1] > last[1] {
                        last[1] = iv[1]
                    }
                } else {
                    res = append(res, iv)
                }
            }
            return res
        }

    Takeaway: sort first, then one linear scan. The merge condition is
    iv[0] <= last[1] (new interval starts before current one ends).
