- category: 'Heap / Priority Queue'
  lang: go
  title: 'Heap / Priority Queue — Go refresher'
  summary: |
    A heap (priority queue) gives O(log n) insert and O(log n) remove-min/max,
    and O(1) peek-min/max. Use it for "k-th largest/smallest", "merge k sorted
    lists", scheduling, and Dijkstra's algorithm.

    Go has NO built-in heap type. You must implement heap.Interface from the
    container/heap package. The interface requires five methods:

      Len() int
      Less(i, j int) bool    — defines min-heap or max-heap
      Swap(i, j int)
      Push(x any)            — append to underlying slice
      Pop() any              — remove and return last element

    Then use heap.Init, heap.Push, heap.Pop. For a max-heap, negate Less.
    A common shortcut: define IntHeap as type IntHeap []int and implement all five.
  sections:
    - title: Declarations
      ops:
        - label: 'min-heap of ints (implement heap.Interface)'
          code: |
            type IntHeap []int
            func (h IntHeap) Len() int            { return len(h) }
            func (h IntHeap) Less(i, j int) bool  { return h[i] < h[j] }
            func (h IntHeap) Swap(i, j int)        { h[i], h[j] = h[j], h[i] }
            func (h *IntHeap) Push(x any)          { *h = append(*h, x.(int)) }
            func (h *IntHeap) Pop() any {
                old := *h
                n := len(old)
                x := old[n-1]
                *h = old[:n-1]
                return x
            }
        - label: 'initialise and populate'
          code: 'h := &IntHeap{3, 1, 4};  heap.Init(h)'
        - label: 'max-heap: flip the Less comparison'
          code: 'func (h IntHeap) Less(i, j int) bool { return h[i] > h[j] }'
    - title: Basic operations
      ops:
        - label: 'push a new element'
          code: 'heap.Push(h, 5)'
        - label: 'pop the min (or max) element'
          code: 'v := heap.Pop(h).(int)'
        - label: 'peek at the top without removing'
          code: 'top := (*h)[0]'
        - label: 'size of heap'
          code: 'n := h.Len()'
        - label: 'check if empty'
          code: 'if h.Len() == 0 { ... }'
    - title: Iteration & loops
      ops:
        - label: 'drain the heap in sorted order'
          code: |
            for h.Len() > 0 {
                v := heap.Pop(h).(int)
                _ = v
            }
        - label: 'k-th largest: maintain min-heap of size k'
          code: |
            for _, v := range nums {
                heap.Push(h, v)
                if h.Len() > k {
                    heap.Pop(h)
                }
            }
            return (*h)[0]
        - label: 'merge k sorted slices (push [val, listIdx, elemIdx])'
          code: 'heap.Push(h, [3]int{lists[i][0], i, 0})'
    - title: Special operations (heap)
      ops:
        - label: 'build heap from unsorted slice (O(n))'
          code: 'h := (*IntHeap)(&nums);  heap.Init(h)'
        - label: 'heap sort: pop all elements'
          code: 'res := make([]int, 0, h.Len());  for h.Len() > 0 { res = append(res, heap.Pop(h).(int)) }'
        - label: 'fix heap after external mutation at index i'
          code: 'heap.Fix(h, i)'
        - label: 'remove element at index i'
          code: 'heap.Remove(h, i)'
  example: |
    Worked example — find the k-th largest element using a min-heap of size k.

      Push each element. If the heap grows beyond k, pop the smallest. After all
      elements, the heap top is the k-th largest. O(n log k) time, O(k) space.

        type IntHeap []int
        func (h IntHeap) Len() int            { return len(h) }
        func (h IntHeap) Less(i, j int) bool  { return h[i] < h[j] }
        func (h IntHeap) Swap(i, j int)        { h[i], h[j] = h[j], h[i] }
        func (h *IntHeap) Push(x any)          { *h = append(*h, x.(int)) }
        func (h *IntHeap) Pop() any {
            old := *h; n := len(old); x := old[n-1]; *h = old[:n-1]; return x
        }

        func findKthLargest(nums []int, k int) int {
            h := &IntHeap{}
            heap.Init(h)
            for _, v := range nums {
                heap.Push(h, v)
                if h.Len() > k {
                    heap.Pop(h)
                }
            }
            return (*h)[0]
        }

    Takeaway: Go's container/heap requires you to implement the interface yourself.
    For a max-heap just flip Less. Peek is (*h)[0]; heap.Push/Pop maintain order.
