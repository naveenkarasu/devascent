- category: Math & Bit
  lang: java
  title: Math & Bit Manipulation — Java refresher
  summary: |
    These problems lean on number facts and on treating an int as 32 raw bits.

    Bit basics: & (AND), | (OR), ^ (XOR), ~ (NOT), << (shift left = multiply by 2),
    >> (shift right). Two facts solve a huge share of bit problems:
      - x ^ x == 0  and  x ^ 0 == x  → XOR cancels pairs, so XOR-ing a whole array
        leaves only the value that appears an odd number of times.
      - x & (x - 1) clears the lowest set bit → loop it to count set bits.

    Math notes:
      - int overflows silently past ~2.1 billion. If a sum/product can grow large,
        use long. This is a frequent hidden bug.
      - Integer division truncates: 7 / 2 == 3. Use % for the remainder.
      - Use >>> (unsigned right shift) when looping over all 32 bits, so the sign
        bit does not flood the number with 1s.
  sections:
    - title: Declarations
      ops:
        - label: 'result accumulator for XOR'
          code: 'int result = 0;'
        - label: 'use long to avoid int overflow'
          code: 'long sum = (long) a + b;'
        - label: 'bitmask for lowest n bits'
          code: 'int mask = (1 << n) - 1;'
    - title: Basic operations
      ops:
        - label: 'is bit i set?'
          code: '((x >> i) & 1) == 1'
        - label: 'set bit i'
          code: 'x |= (1 << i);'
        - label: 'clear bit i'
          code: 'x &= ~(1 << i);'
        - label: 'XOR cancels pairs (lone value survives)'
          code: 'result ^= num;'
        - label: 'drop lowest set bit (Kernighan)'
          code: 'x = x & (x - 1);'
        - label: 'integer division'
          code: 'int q = n / 10;'
        - label: 'remainder'
          code: 'int digit = n % 10;'
    - title: Most-used built-in functions
      ops:
        - label: 'absolute value'
          code: 'int a = Math.abs(x);'
        - label: 'power (floating-point)'
          code: 'double p = Math.pow(base, exp);'
        - label: 'square root'
          code: 'double r = Math.sqrt(n);'
        - label: 'count set bits (library)'
          code: 'int bits = Integer.bitCount(x);'
        - label: 'highest one-bit'
          code: 'int hi = Integer.highestOneBit(x);'
        - label: 'lowest one-bit'
          code: 'int lo = Integer.lowestOneBit(x);'
    - title: Iteration & loops
      ops:
        - label: 'XOR across whole array'
          code: |
            int res = 0;
            for (int v : nums) res ^= v;
        - label: 'count bits with Kernighan loop'
          code: |
            int count = 0;
            while (x != 0) {
                x &= (x - 1);
                count++;
            }
        - label: 'iterate all 32 bits (unsigned shift)'
          code: |
            for (int i = 0; i < 32; i++) {
                int bit = (x >>> i) & 1;
            }
        - label: 'reverse digits of an integer'
          code: |
            long rev = 0;
            while (n != 0) {
                rev = rev * 10 + n % 10;
                n /= 10;
            }
    - title: Special operations (math & bit)
      ops:
        - label: 'is power of two?'
          code: 'boolean isPow2 = x > 0 && (x & (x - 1)) == 0;'
        - label: 'swap without temp (XOR swap)'
          code: |
            a ^= b;
            b ^= a;
            a ^= b;
        - label: 'isolate lowest set bit'
          code: 'int lowest = x & (-x);'
        - label: 'check if number is odd'
          code: 'boolean odd = (x & 1) == 1;'
        - label: 'fast multiply by power of 2'
          code: 'int doubled = x << 1;'
        - label: 'fast divide by power of 2'
          code: 'int halved = x >> 1;'
  example: |
    Worked example — single number (every value appears twice except one):

      You could count with a HashMap (O(n) space). But XOR is cleaner: equal values
      cancel to 0, and 0 ^ x == x, so XOR-ing the whole array leaves exactly the one
      unpaired value — O(n) time, O(1) space.

        int singleNumber(int[] nums) {
            int result = 0;
            for (int num : nums) {
                result ^= num;   // pairs cancel; the lone number survives
            }
            return result;
        }

    Bonus — count set bits with Kernighan's trick:

        int countBits(int x) {
            int count = 0;
            while (x != 0) { x &= (x - 1); count++; }   // clears one bit per loop
            return count;
        }

    Takeaway: XOR is "remember what is unpaired," and x & (x-1) peels bits off one at
    a time. And whenever numbers might get big, switch to long BEFORE they overflow.
