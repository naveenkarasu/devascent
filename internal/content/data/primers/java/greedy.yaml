- category: Greedy
  lang: java
  title: Greedy — Java refresher
  summary: |
    A greedy algorithm builds the answer step by step, always taking the choice that
    looks best RIGHT NOW and never reconsidering. When it works, it is short and fast
    (often one pass, O(n) or O(n log n) after a sort).

    The catch: greedy is only correct when a locally-best choice is guaranteed to be
    part of a globally-best answer. For many problems it is NOT (those usually need
    Dynamic Programming instead). So the real skill is spotting the "greedy-safe"
    structure — typically: sort by some key, then sweep once making the obvious local
    pick. If you cannot argue why local-best stays globally-best, be suspicious.

    Java notes:
      - Sorting is the usual setup: Arrays.sort(a) for primitives.
      - To sort objects by a field, use a Comparator (often a lambda).
      - Track a running best with Math.max / Math.min instead of re-scanning.
  sections:
