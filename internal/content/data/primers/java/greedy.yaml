            PriorityQueue<Integer> hi = new PriorityQueue<>();
  example: |
    Worked example — Jump Game (each a[i] is the max jump from index i; can you
    reach the last index?):

      Greedy idea: track the FARTHEST index reachable so far. Walk left to right; if
      you ever stand on an index beyond that frontier, you are stuck — return false.
      Otherwise extend the frontier. No backtracking, no DP table — one pass.

        boolean canJump(int[] a) {
            int farthest = 0;
            for (int i = 0; i < a.length; i++) {
                if (i > farthest) {
                    return false;        // this index is unreachable
                }
                farthest = Math.max(farthest, i + a[i]);
                if (farthest >= a.length - 1) {
                    return true;         // last index already reachable
                }
            }
            return true;
        }

    Why greedy is safe here: extending to the farthest reach can never hurt — any
    index a smaller reach could touch, the larger reach also touches. Takeaway:
    greedy = one confident local pick per step, but only after you can justify it.
