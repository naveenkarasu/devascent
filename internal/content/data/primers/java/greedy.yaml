            }
    - title: Special operations (greedy)
      ops:
        - label: 'minimum number of jumps (track current and next reach)'
          code: |
            int jumps = 0, curEnd = 0, farthest = 0;
            for (int i = 0; i < n-1; i++) {
                farthest = Math.max(farthest, i+a[i]);
                if (i == curEnd) {
                    jumps++;
                    curEnd = farthest;
                }
            }
        - label: 'activity selection: sort by end time, greedily take non-overlapping'
          code: |
            Arrays.sort(intervals, (x, y) -> Integer.compare(x[1], y[1]));
            int end = Integer.MIN_VALUE;
            for (int[] iv : intervals) {
                if (iv[0] >= end) {
                    count++;
                    end = iv[1];
                }
            }
        - label: 'gas station: running tank and total surplus'
          code: |
            int total = 0, tank = 0, start = 0;
            for (int i = 0; i < n; i++) {
                total += gain[i];
                tank += gain[i];
                if (tank < 0) {
                    start = i+1;
                    tank = 0;
                }
            }
        - label: 'two-heap trick for streaming median'
