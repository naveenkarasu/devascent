- category: Intervals
  lang: java
  title: Intervals — Java refresher
  summary: |
    Interval problems deal with ranges like [start, end] — meetings, bookings, number
    lines. The universal first move is to SORT the intervals by start time. Once
    sorted, you can sweep left to right and decide overlaps with a simple comparison,
    because anything that could overlap the current interval now sits right next to it.

    Two intervals [a, b] and [c, d] OVERLAP when a <= d AND c <= b — i.e. each starts
    before the other ends. Merging overlaps means extending the current end to the
    max of the two ends.

    Java notes:
      - An interval is often an int[] of length 2: {start, end}.
      - Sort by start: intervals.sort or Arrays.sort with a comparator on index [0].
      - Use a List<int[]> to collect merged results, then toArray at the end.
  sections:
    - title: Declarations
      ops:
        - label: 'interval as int array {start, end}'
          code: 'int[] iv = {start, end};'
        - label: 'list to collect merged results'
          code: 'List<int[]> merged = new ArrayList<>();'
        - label: 'min-heap ordered by end time (meeting rooms)'
          code: 'PriorityQueue<Integer> ends = new PriorityQueue<>();'
    - title: Basic operations
      ops:
        - label: 'sort by start time'
          code: 'Arrays.sort(intervals, (x, y) -> Integer.compare(x[0], y[0]));'
        - label: 'do two intervals overlap?'
          code: 'boolean overlap = a[0] <= b[1] && b[0] <= a[1];'
        - label: 'extend the running end'
          code: 'current[1] = Math.max(current[1], next[1]);'
        - label: 'save current and start a new one'
          code: |
            merged.add(current);
            current = next;
        - label: 'convert result list to array'
          code: 'return merged.toArray(new int[merged.size()][]);'
    - title: Iteration & loops
      ops:
        - label: 'merge-intervals sweep'
          code: |
            for (int[] next : intervals) {
                if (next[0] <= current[1]) {
                    current[1] = Math.max(current[1], next[1]);
                } else {
                    merged.add(current);
                    current = next;
                }
            }
        - label: 'count non-overlapping intervals (greedy)'
          code: |
            int end = Integer.MIN_VALUE;
            for (int[] iv : intervals) {
                if (iv[0] >= end) {
                    count++;
                    end = iv[1];
                }
            }
        - label: 'meeting rooms II: track active end times'
          code: |
            for (int[] iv : intervals) {
                if (!ends.isEmpty() && ends.peek() <= iv[0]) ends.poll();
                ends.offer(iv[1]);
            }
    - title: Special operations (intervals)
      ops:
        - label: 'insert and merge a new interval'
          code: |
            while (i < n && intervals[i][1] < newInterval[0]) merged.add(intervals[i++]);
            while (i < n && intervals[i][0] <= newInterval[1]) {
                newInterval[0] = Math.min(newInterval[0], intervals[i][0]);
                newInterval[1] = Math.max(newInterval[1], intervals[i++][1]);
            }
            merged.add(newInterval);
        - label: 'minimum rooms needed = heap size after sweep'
          code: 'return ends.size();'
        - label: 'check if one interval contains another'
          code: 'boolean contains = a[0] <= b[0] && b[1] <= a[1];'
  example: |
    Worked example — merge all overlapping intervals:

      Sort by start. Walk through; keep the "current" interval you are building. If the
      next interval starts at or before current's end, they overlap — stretch current's
      end to cover it. Otherwise current is finished: save it and start a new current.

        int[][] merge(int[][] intervals) {
            Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));
            List<int[]> merged = new ArrayList<>();
            int[] current = intervals[0];
            merged.add(current);
            for (int i = 1; i < intervals.length; i++) {
                int[] next = intervals[i];
                if (next[0] <= current[1]) {                 // overlap
                    current[1] = Math.max(current[1], next[1]);
                } else {                                     // gap: start fresh
                    current = next;
                    merged.add(current);
                }
            }
            return merged.toArray(new int[merged.size()][]);
        }

    Note current is the SAME object stored in the list, so updating current[1] also
    updates the saved entry. Takeaway: sort by start, then a single sweep decides
    every overlap — almost all interval problems begin with that sort.
