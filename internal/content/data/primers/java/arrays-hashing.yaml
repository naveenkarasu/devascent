  example: |
    Worked example — Two Sum (find indices i, j with a[i] + a[j] == target):

      Brute force checks every pair: O(n^2). Instead, walk the array once and store
      each value's index in a HashMap. For each number, look up whether its partner
      (target - num) was already seen — O(1) per step, O(n) total.

        int[] twoSum(int[] nums, int target) {
            Map<Integer, Integer> seen = new HashMap<>();
            for (int i = 0; i < nums.length; i++) {
                int need = target - nums[i];
                if (seen.containsKey(need)) {
                    return new int[] { seen.get(need), i };
                }
                seen.put(nums[i], i);
            }
            return new int[] {};   // no pair found
        }

    Takeaway: a HashMap turns "search for a partner" from a nested loop into a
    single pass. Most Arrays & Hashing problems are a version of this trade — the
    map remembers the past so you never have to scan it again.
