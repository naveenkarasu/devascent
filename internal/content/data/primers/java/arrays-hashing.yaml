- category: Arrays & Hashing
  lang: java
  title: Arrays & Hashing — Java refresher
  summary: |
    An array (int[], String[]) holds values by index, 0-based, with a FIXED length
    you set when you create it. When you need a growable list, use ArrayList. When
    you need fast "have I seen this key?" or "how many of each?", reach for a
    HashMap (key -> value) or HashSet (just keys) — both give average O(1) lookup.

    The core trade: a brute-force double loop is O(n^2). Remember what you have seen
    in a HashMap/HashSet and you usually drop to a single O(n) pass.

    Java notes for beginners:
      - int[] has a fixed .length; ArrayList grows and uses .size().
      - Generics need OBJECT types: HashMap<Integer,Integer>, not <int,int>.
        Java auto-boxes int <-> Integer for you.
      - Compare contents with .equals(), NOT == (== compares object identity).
