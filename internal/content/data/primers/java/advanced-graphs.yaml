- category: Advanced Graphs
  lang: java
  title: Advanced Graphs — Java refresher
  summary: |
    Beyond plain DFS/BFS, a few named graph tools cover most "advanced" problems:

      - Topological sort: order tasks so every prerequisite comes before what needs it
        (course schedules, build order). Works only on a DAG (no cycles). Kahn's
        algorithm repeatedly removes nodes whose in-degree is 0.
      - Union-Find (Disjoint Set Union): near-O(1) "are these two in the same group?"
        and "merge two groups." Great for counting connected components and detecting
        cycles in an undirected graph.
      - Dijkstra: shortest path from a source when edges have NON-NEGATIVE weights.
        It is BFS with a min-heap (PriorityQueue) ordered by distance so far.

    Pick by the question: "valid ordering / cycle in directed graph?" -> topo sort;
    "connectivity / grouping?" -> union-find; "cheapest path with weights?" -> Dijkstra.

    Java notes:
      - Adjacency list: Map<Integer, List<int[]>> where int[] is {neighbor, weight}.
      - Union-Find is just an int[] parent array plus find() with path compression.
      - Dijkstra uses a PriorityQueue ordered by distance.
