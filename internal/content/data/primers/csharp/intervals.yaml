- category: 'Intervals'
  lang: csharp
  title: 'Intervals — C# refresher'
  summary: |
    Interval problems deal with ranges [start, end]. The universal first step is almost
    always: sort by start time. Then you can detect overlaps in a single left-to-right
    sweep, merge adjacent intervals, and count simultaneous overlaps with a line sweep.

    Key patterns: merge overlapping intervals, insert a new interval, find minimum
    meeting rooms (max simultaneous), determine if intervals cover a range.

    C# notes:
      - Represent each interval as int[] {start, end} or a custom record/struct.
      - Sort: Array.Sort(intervals, (a, b) => a[0] - b[0]) or LINQ OrderBy.
      - Two intervals overlap when a.end >= b.start (assuming sorted by start).
      - Merged end: Math.Max(last.end, current.end).
  sections:
    - title: Declarations
      ops:
        - label: 'array of [start, end] pairs'
          code: 'int[][] intervals = { new[]{1,3}, new[]{2,6}, new[]{8,10} };'
        - label: 'sort by start time'
          code: 'Array.Sort(intervals, (a, b) => a[0] - b[0]);'
        - label: 'result list for merged intervals'
          code: 'var merged = new List<int[]>();'
    - title: Basic operations
      ops:
        - label: 'check overlap (sorted by start)'
          code: 'bool overlaps = current[0] <= last[1];'
        - label: 'merge: extend the end'
          code: 'last[1] = Math.Max(last[1], current[1]);'
        - label: 'add non-overlapping interval to result'
          code: 'merged.Add(new[] { current[0], current[1] });'
    - title: Iteration & loops
      ops:
        - label: 'merge overlapping intervals'
          code: |
            Array.Sort(intervals, (a, b) => a[0] - b[0]);
            var merged = new List<int[]>();
            foreach (var iv in intervals) {
                if (merged.Count == 0 || merged[^1][1] < iv[0])
                    merged.Add(new[] { iv[0], iv[1] });
                else
                    merged[^1][1] = Math.Max(merged[^1][1], iv[1]);
            }
        - label: 'minimum meeting rooms (line sweep with sorted events)'
          code: |
            int[] starts = intervals.Select(i => i[0]).OrderBy(x => x).ToArray();
            int[] ends   = intervals.Select(i => i[1]).OrderBy(x => x).ToArray();
            int rooms = 0, maxRooms = 0, e = 0;
            for (int s = 0; s < starts.Length; s++)
            {
                if (starts[s] < ends[e]) rooms++;
                else
                {
                    rooms--;
                    e++;
                }
                maxRooms = Math.Max(maxRooms, rooms);
            }
    - title: Special operations (intervals)
      ops:
        - label: 'insert and merge a new interval'
          code: |
            var result = new List<int[]>();
            int i = 0, n = intervals.Length;
            while (i < n && intervals[i][1] < newInterval[0]) result.Add(intervals[i++]);
            while (i < n && intervals[i][0] <= newInterval[1]) {
                newInterval[0] = Math.Min(newInterval[0], intervals[i][0]);
                newInterval[1] = Math.Max(newInterval[1], intervals[i][1]);
                i++;
            }
            result.Add(newInterval);
            while (i < n) result.Add(intervals[i++]);
        - label: 'check if a point is covered by any interval'
          code: 'bool covered = intervals.Any(iv => iv[0] <= point && point <= iv[1]);'
        - label: 'total covered length (after merging)'
          code: 'int len = merged.Sum(iv => iv[1] - iv[0]);'
  example: |
    Worked example — merge all overlapping intervals:

      Sort by start. Walk left to right. If the current interval starts after the
      last merged interval ends, append it. Otherwise it overlaps — extend the end
      of the last merged interval. One pass after sorting: O(n log n) total.

        int[][] Merge(int[][] intervals) {
            Array.Sort(intervals, (a, b) => a[0] - b[0]);
            var merged = new List<int[]>();
            foreach (var iv in intervals) {
                if (merged.Count == 0 || merged[^1][1] < iv[0])
                    merged.Add(new[] { iv[0], iv[1] });
                else
                    merged[^1][1] = Math.Max(merged[^1][1], iv[1]);
            }
            return merged.ToArray();
        }

    Takeaway: sort by start first — it reduces the overlap check to a single
    comparison with the last interval in the result list.
