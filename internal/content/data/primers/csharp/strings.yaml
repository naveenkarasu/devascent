        - label: 'build output efficiently (avoid += in a loop)'
          code: |
            var sb = new StringBuilder();
            foreach (var part in parts)
            {
                sb.Append(part);
            }
            return sb.ToString();
        - label: 'split on a delimiter'
          code: 'string[] parts = s.Split('' '');'
  example: |
    Worked example — are two strings anagrams (same letters, any order)?

      Different lengths can never be anagrams. Otherwise count each letter of the
      first string (+1) and subtract for the second (-1). If every count lands back
      at zero, the letters matched exactly. One pass each, O(n), no sorting needed.

        bool IsAnagram(string a, string b) {
            if (a.Length != b.Length) return false;
            int[] count = new int[26];
            for (int i = 0; i < a.Length; i++) {
                count[a[i] - 'a']++;
                count[b[i] - 'a']--;
            }
            foreach (int v in count) {
                if (v != 0) return false;
            }
            return true;
        }

    Takeaway: an int[26] is a tiny, fast frequency map for lowercase letters. Use
    StringBuilder when assembling output, and note == is safe for content comparison in C#.
