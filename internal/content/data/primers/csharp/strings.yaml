- category: Strings
  lang: csharp
  title: 'Strings — C# refresher'
  summary: |
    Strings are sequences of characters. The key C# fact: string is IMMUTABLE — every
    "change" (concatenation, replace) produces a brand-new string. Building a string
    in a loop with += is O(n^2). Use StringBuilder to append, then call ToString() once.

    Many string problems reduce to counting characters (anagrams, frequency tables) or
    a two-pointer / sliding-window scan (palindromes, substrings).

    C# notes:
      - char c = s[i];  and  s.Length  to read (indexer, not a method call).
      - == compares CONTENT in C#, so "hello" == "hello" is true. This is safe and idiomatic.
      - c - 'a' maps lowercase letters to 0..25 — use as an int[26] index.
      - s.ToCharArray() gives a char[] you can sort or scan.
      - Substring(startIndex, LENGTH) — second arg is a LENGTH, not an end index.
  sections:
