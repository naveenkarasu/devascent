    - title: Iteration & loops
      ops:
        - label: 'foreach over characters'
          code: |
            foreach (char c in s)
            {
                // ...
            }
        - label: 'indexed for loop'
          code: |
            for (int i = 0; i < s.Length; i++)
            {
                char c = s[i];
            }
        - label: 'two-pointer while loop (ends inward)'
          code: |
            int lo = 0, hi = s.Length - 1;
            while (lo < hi)
            {
                // ...
                lo++;
                hi--;
            }
    - title: Ordering & comparison
      ops:
        - label: 'sort the characters of a string'
          code: |
            char[] cs = s.ToCharArray();
            Array.Sort(cs);
            string sorted = new string(cs);
        - label: 'lexicographic compare (<0, 0, >0)'
          code: 'int cmp = string.Compare(a, b, StringComparison.Ordinal);'
        - label: 'sort a list of strings — declare list'
