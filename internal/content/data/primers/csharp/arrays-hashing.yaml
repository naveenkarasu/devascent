        - label: 'dictionary insert / update'
          code: 'map["key"] = 5;'
        - label: 'safe count increment (avoids KeyNotFoundException)'
          code: 'map["k"] = map.GetValueOrDefault("k", 0) + 1;'
        - label: 'dictionary lookup with TryGetValue'
