- category: 'Arrays & Hashing'
  lang: csharp
  title: 'Arrays & Hashing — C# refresher'
  summary: |
    Arrays and hash maps are the two most-reached-for tools in interview problems. A
    plain array gives O(1) indexed access; a Dictionary<K,V> gives O(1) average-case
    lookup, insert, and delete by key.

    The classic hashing pattern: scan the input once, recording counts or positions in
    a dictionary, then use those records to answer queries in O(1). This turns naive
    O(n^2) solutions into O(n).

    C# notes:
      - int[] arr = new int[n]; initializes to zeros.
      - Dictionary<K,V> is the workhorse; HashSet<T> for membership tests only.
      - GetValueOrDefault(key, 0) avoids a KeyNotFoundException when incrementing counts.
      - ContainsKey(k) before [] access; or TryGetValue(k, out var v) in one call.
      - Array.Sort(arr) sorts in-place; LINQ OrderBy(...) returns a new sequence.
  sections:
    - title: Declarations
      ops:
        - label: 'fixed-size int array (zero-initialized)'
          code: 'int[] arr = new int[n];'
        - label: 'array with initializer'
          code: 'int[] arr = {1, 2, 3};'
        - label: 'dictionary (key -> value)'
          code: 'var map = new Dictionary<string, int>();'
        - label: 'hash set (unique values)'
          code: 'var set = new HashSet<int>();'
        - label: 'dynamic list (resizable array)'
          code: 'var list = new List<int>();'
    - title: Basic operations
      ops:
