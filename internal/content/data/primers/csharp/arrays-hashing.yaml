            }
    - title: Special operations (arrays & hashing)
      ops:
        - label: 'two-sum: index of complement'
          code: |
            var seen = new Dictionary<int, int>();
            for (int i = 0; i < nums.Length; i++)
            {
                int need = target - nums[i];
                if (seen.ContainsKey(need)) return new[] { seen[need], i };
                seen[nums[i]] = i;
            }
        - label: 'frequency map from an array'
          code: |
            var freq = new Dictionary<int, int>();
            foreach (int x in nums)
                freq[x] = freq.GetValueOrDefault(x, 0) + 1;
        - label: 'group items by a key (anagram buckets, etc.)'
          code: |
            var groups = new Dictionary<string, List<string>>();
            foreach (string w in words)
            {
                char[] cs = w.ToCharArray();
                Array.Sort(cs);
                string key = new string(cs);
                if (!groups.ContainsKey(key)) groups[key] = new List<string>();
                groups[key].Add(w);
            }
        - label: 'prefix-sum array'
          code: |
            int[] prefix = new int[n + 1];
            for (int i = 0; i < n; i++) prefix[i + 1] = prefix[i] + nums[i];
  example: |
    Worked example — find all pairs that sum to a target value:

      Scan left to right. For each number, compute what its partner must be
      (target - current). If that partner is already in a HashSet, we found a pair.
      Otherwise record the current number and move on. One pass, O(n).

        bool HasPairWithSum(int[] nums, int target) {
            var seen = new HashSet<int>();
            foreach (int x in nums) {
                if (seen.Contains(target - x)) return true;
                seen.Add(x);
            }
            return false;
        }

    Takeaway: HashSet.Contains is O(1). Trading a little memory for a hash set turns
    an O(n^2) nested-loop search into a single O(n) scan.
