- category: 'Two Pointers & Sliding Window'
  lang: csharp
  title: 'Two Pointers & Sliding Window — C# refresher'
  summary: |
    Two-pointer technique uses two indices that move through data, avoiding a nested
    loop and dropping O(n^2) solutions to O(n). It applies whenever the array is sorted
    or you need to find a pair/triplet satisfying some condition.

    Sliding window is a specialization: keep a [left, right) window expanding from the
    right and shrinking from the left to maintain a constraint (e.g., at most k distinct
    chars, sum <= target). Both patterns avoid extra allocations — just indices.

    C# notes:
      - Use plain int lo/hi or left/right; no special type needed.
      - A Dictionary or int[26] tracks the window's current contents efficiently.
      - string.Length and array.Length both give the size; pick the right one.
  sections:
    - title: Declarations
      ops:
        - label: 'opposing ends (sorted array, palindrome check)'
          code: 'int lo = 0, hi = arr.Length - 1;'
        - label: 'same-direction window'
          code: 'int left = 0, right = 0;'
        - label: 'window character count (string window)'
          code: 'int[] count = new int[26];'
        - label: 'window state map (general)'
          code: 'var window = new Dictionary<char, int>();'
    - title: Basic operations
      ops:
        - label: 'advance right pointer'
          code: 'right++;'
        - label: 'shrink left pointer'
          code: 'left++;'
        - label: 'current window size'
          code: 'int size = right - left;'
        - label: 'add element entering window'
          code: 'window[c] = window.GetValueOrDefault(c, 0) + 1;'
        - label: 'remove element leaving window'
          code: |
            window[c]--;
            if (window[c] == 0) window.Remove(c);
    - title: Iteration & loops
      ops:
        - label: 'two-pointer inward (sorted pair sum)'
          code: |
            while (lo < hi)
            {
                int sum = arr[lo] + arr[hi];
                if (sum == target)
                {
                    /* found */
                    lo++;
                    hi--;
                }
                else if (sum < target) lo++;
                else hi--;
            }
