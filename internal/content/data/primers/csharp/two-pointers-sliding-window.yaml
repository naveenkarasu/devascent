    - title: Special operations (sliding window)
      ops:
        - label: 'longest substring with at most k distinct characters'
          code: |
            int left = 0, best = 0;
            var freq = new Dictionary<char, int>();
            for (int r = 0; r < s.Length; r++)
            {
                freq[s[r]] = freq.GetValueOrDefault(s[r], 0) + 1;
                while (freq.Count > k)
                {
                    freq[s[left]]--;
                    if (freq[s[left]] == 0) freq.Remove(s[left]);
                    left++;
                }
                best = Math.Max(best, r - left + 1);
            }
