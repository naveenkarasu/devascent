  example: |
    Worked example — longest substring without repeating characters:

      Expand the right end one character at a time. If the new character is already
      in the window, shrink from the left until it is gone. Track the best length seen.
      Every character enters and leaves the window at most once: O(n) total.

        int LengthOfLongestSubstring(string s) {
            var seen = new HashSet<char>();
            int left = 0, best = 0;
            for (int right = 0; right < s.Length; right++) {
                while (seen.Contains(s[right])) {
                    seen.Remove(s[left]);
                    left++;
                }
                seen.Add(s[right]);
                best = Math.Max(best, right - left + 1);
            }
            return best;
        }

    Takeaway: the window shrinks only when a constraint is violated. Each element is
    processed at most twice (once added, once removed), giving O(n) overall.
