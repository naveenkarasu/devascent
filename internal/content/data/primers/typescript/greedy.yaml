- category: 'Greedy'
  lang: typescript
  title: 'Greedy — TypeScript refresher'
  summary: |
    A greedy algorithm makes the locally optimal choice at each step and never
    backtracks. It works when a problem has "greedy choice property" — a local
    optimum leads to a global optimum. Greedy solutions are usually O(n log n)
    (sort first, then one pass) or O(n) (one pass with running state).

    Common greedy patterns:
      - Sort by endpoint / deadline / value-per-weight, then scan.
      - Track a running value (max reachable index, remaining capacity).
      - Exchange argument: prove swapping two adjacent choices cannot improve the result.

    TypeScript specifics:
      - Always pass a comparator to `.sort()` — default is lexicographic.
      - Use `Number.NEGATIVE_INFINITY` / `Number.POSITIVE_INFINITY` as sentinels.
      - Type tuple arrays as `[number, number][]` to document (start, end) pairs.
  sections:
    - title: Declarations
      ops:
        - label: 'interval array typed as tuples'
          code: 'const intervals: [number, number][] = [[1,3],[2,6],[8,10]];'
        - label: 'running greedy state variable'
          code: 'let maxReach = 0;'
        - label: 'result counter'
          code: 'let count = 0;'
    - title: Basic operations
      ops:
        - label: 'sort intervals by start time'
          code: 'intervals.sort((a, b) => a[0] - b[0]);'
        - label: 'sort intervals by end time'
          code: 'intervals.sort((a, b) => a[1] - b[1]);'
        - label: 'update running maximum'
          code: 'maxReach = Math.max(maxReach, nums[i] + i);'
        - label: 'check if current index is reachable'
          code: 'if (i > maxReach) return false;'
    - title: Iteration & loops
      ops:
        - label: 'one-pass greedy scan'
          code: |
            for (let i = 0; i < nums.length; i++) {
              // update greedy state using nums[i]
              // decide whether to increment count / update result
            }
        - label: 'interval sweep: process sorted by end'
          code: |
            intervals.sort((a, b) => a[1] - b[1]);
            let end = -Infinity;
            for (const [s, e] of intervals) {
              if (s >= end) {
                count++;
                end = e;
              }
            }
    - title: Special operations (Greedy)
      ops:
        - label: 'jump game — can you reach the last index?'
          code: |
            function canJump(nums: number[]): boolean {
              let maxReach = 0;
              for (let i = 0; i < nums.length; i++) {
                if (i > maxReach) return false;
                maxReach = Math.max(maxReach, i + nums[i]);
              }
              return true;
            }
        - label: 'minimum number of intervals to remove for non-overlapping'
          code: |
            intervals.sort((a, b) => a[1] - b[1]);
            let count = 0, end = -Infinity;
            for (const [s, e] of intervals) {
              if (s >= end) {
                end = e;
              } else {
                count++;
              }
            }
            return count;
        - label: 'assign cookies — greedy match smallest sufficient cookie'
          code: |
            g.sort((a, b) => a - b);
            c.sort((a, b) => a - b);
            let i = 0, j = 0;
            while (i < g.length && j < c.length) {
              if (c[j] >= g[i]) i++;
              j++;
            }
            return i;
  example: |
    Worked example — minimum number of arrows to burst all balloons (intervals).

      Sort balloons by their right endpoint. Shoot an arrow at the rightmost point of
      the first balloon. This arrow also bursts every balloon that starts before or at
      that point. Move to the next unbursted balloon and repeat.

        function findMinArrowShots(points: [number, number][]): number {
            points.sort((a, b) => a[1] - b[1]);
            let arrows = 1;
            let arrowPos = points[0][1];
            for (let i = 1; i < points.length; i++) {
                if (points[i][0] > arrowPos) {
                    arrows++;
                    arrowPos = points[i][1];
                }
            }
            return arrows;
        }

    Takeaway: sort by end time, then greedily extend coverage as far right as
    possible. Most interval-greedy problems follow this same sort-then-scan shape.
