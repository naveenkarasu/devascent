- category: 'Intervals'
  lang: typescript
  title: 'Intervals — TypeScript refresher'
  summary: |
    Interval problems involve ranges [start, end] that may overlap or be merged.
    The canonical first step is to SORT by start time (or end time, depending on the
    problem). After sorting, a single linear scan can merge, count overlaps, or find
    gaps.

    Common interval patterns:
      - Merge overlapping intervals: sort by start, extend end greedily.
      - Insert interval into a sorted list: handle left non-overlap, merge, right non-overlap.
      - Meeting rooms (max concurrent): event sweep with +1/-1 on a sorted timeline.

    TypeScript specifics:
      - Type intervals as `[number, number][]` (tuple array) for destructuring clarity.
      - Sort with: `intervals.sort((a, b) => a[0] - b[0]);`
      - Use spread push for result: `result.push([start, end]);`
      - `Number.NEGATIVE_INFINITY` / `Number.POSITIVE_INFINITY` useful as sentinels.
  sections:
    - title: Declarations
      ops:
        - label: 'interval list typed as tuples'
          code: 'const intervals: [number, number][] = [[1,3],[2,6],[8,10]];'
        - label: 'result accumulator'
          code: 'const result: [number, number][] = [];'
        - label: 'tracking current merged interval'
          code: 'let [start, end] = intervals[0];'
    - title: Basic operations
      ops:
        - label: 'sort by start time'
          code: 'intervals.sort((a, b) => a[0] - b[0]);'
        - label: 'check overlap: a overlaps b if a.end >= b.start'
          code: 'const overlaps = end >= intervals[i][0];'
        - label: 'extend end of current merged interval'
          code: 'end = Math.max(end, intervals[i][1]);'
        - label: 'commit current interval'
          code: 'result.push([start, end]);'
        - label: 'start a new merged interval'
          code: '[start, end] = intervals[i];'
    - title: Iteration & loops
      ops:
        - label: 'merge overlapping intervals'
          code: |
            intervals.sort((a, b) => a[0] - b[0]);
            let [start, end] = intervals[0];
            for (let i = 1; i < intervals.length; i++) {
              if (intervals[i][0] <= end) {
                end = Math.max(end, intervals[i][1]);
              } else {
                result.push([start, end]);
                [start, end] = intervals[i];
              }
            }
            result.push([start, end]);
        - label: 'event sweep for max concurrent meetings'
          code: |
            const events: [number, number][] = [];
            for (const [s, e] of intervals) {
              events.push([s, 1]);
              events.push([e, -1]);
            }
            events.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
            let cur = 0, max = 0;
            for (const [, delta] of events) {
              cur += delta;
              max = Math.max(max, cur);
            }
    - title: Special operations (Intervals)
      ops:
        - label: 'insert a new interval and merge'
          code: |
            function insert(intervals: [number,number][], nw: [number,number]): [number,number][] {
              const result: [number,number][] = [];
              let i = 0;
              while (i < intervals.length && intervals[i][1] < nw[0]) result.push(intervals[i++]);
              while (i < intervals.length && intervals[i][0] <= nw[1]) {
                nw[0] = Math.min(nw[0], intervals[i][0]);
                nw[1] = Math.max(nw[1], intervals[i][1]);
                i++;
              }
              result.push(nw);
              while (i < intervals.length) result.push(intervals[i++]);
              return result;
            }
        - label: 'minimum number of arrows to burst all balloons'
          code: |
            intervals.sort((a, b) => a[1] - b[1]);
            let arrows = 1, pos = intervals[0][1];
            for (let i = 1; i < intervals.length; i++) {
              if (intervals[i][0] > pos) {
                arrows++;
                pos = intervals[i][1];
              }
            }
            return arrows;
        - label: 'non-overlapping intervals to remove'
          code: |
            intervals.sort((a, b) => a[1] - b[1]);
            let count = 0, end = -Infinity;
            for (const [s, e] of intervals) {
              if (s >= end) {
                end = e;
              } else {
                count++;
              }
            }
            return count;
  example: |
    Worked example — merge all overlapping intervals in a list.

      Sort by start. Walk through: if the current interval overlaps the last merged
      (its start <= merged end), extend the merged end. Otherwise, commit the merged
      interval and start a new one. One pass after sorting, O(n log n) total.

        function merge(intervals: [number, number][]): [number, number][] {
            intervals.sort((a, b) => a[0] - b[0]);
            const result: [number, number][] = [];
            let [start, end] = intervals[0];
            for (let i = 1; i < intervals.length; i++) {
                if (intervals[i][0] <= end) {
                    end = Math.max(end, intervals[i][1]);
                } else {
                    result.push([start, end]);
                    [start, end] = intervals[i];
                }
            }
            result.push([start, end]);
            return result;
        }

    Takeaway: sort first, then one greedy pass. TypeScript tuple types `[number, number]`
    make destructuring clean and prevent mixing up start/end.
