    - title: Special operations (Two Pointers & Sliding Window)
      ops:
        - label: 'longest substring without repeating characters'
          code: |
            const seen = new Set<string>();
            let left = 0, max = 0;
            for (let right = 0; right < s.length; right++) {
              while (seen.has(s[right])) {
                seen.delete(s[left++]);
              }
              seen.add(s[right]);
              max = Math.max(max, right - left + 1);
            }
        - label: 'check if a string is a palindrome (two pointers)'
          code: |
            let lo = 0, hi = s.length - 1;
            while (lo < hi) {
              if (s[lo] !== s[hi]) return false;
              lo++;
              hi--;
            }
            return true;
        - label: 'three-sum (sort + outer loop + two-pointer inner)'
          code: |
            nums.sort((a, b) => a - b);
            for (let i = 0; i < nums.length - 2; i++) {
              let lo = i + 1, hi = nums.length - 1;
