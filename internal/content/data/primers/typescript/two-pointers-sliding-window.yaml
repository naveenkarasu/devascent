  example: |
    Worked example — longest substring with at most k distinct characters.

      Use a sliding window with a Map to count characters in the window. Expand right
      by adding the new character. When the number of distinct keys exceeds k, shrink
      left until it is valid again. Track the maximum window size seen.

        function lengthOfLongestSubstringKDistinct(s: string, k: number): number {
            const window = new Map<string, number>();
            let left = 0, maxLen = 0;
            for (let right = 0; right < s.length; right++) {
                window.set(s[right], (window.get(s[right]) ?? 0) + 1);
                while (window.size > k) {
                    const cnt = window.get(s[left])! - 1;
                    if (cnt === 0) window.delete(s[left]); else window.set(s[left], cnt);
                    left++;
                }
                maxLen = Math.max(maxLen, right - left + 1);
            }
            return maxLen;
        }

    Takeaway: the window Map holds exactly the state you need. Shrinking left is
    always a while-loop so multiple shrinks can happen in one step.
