<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>DevAscent</title>
    <script>/* set saved theme before first paint to avoid a flash (?theme= overrides, for demos) */
      (function(){var q=new URLSearchParams(location.search).get('theme');
       var t=q||localStorage.getItem('devascent-theme')||'prismatic';
       document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<div id="app"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
